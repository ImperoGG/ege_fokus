function renderTrainer() {
  if (trainer) return renderQuiz();
  return renderTrainerLobby();
}

function addMistake(questionId, selectedIndex) {
  const question = QUESTION_BY_ID[questionId];
  if (!question) return;
  const existing = state.progress.mistakes[questionId];
  state.progress.mistakes[questionId] = {
    questionId,
    count: (existing?.count || 0) + 1,
    lastAt: new Date().toISOString(),
    lastWrong: selectedIndex
  };
}

function finishTrainer() {
  if (!trainer || trainer.finished) return;
  clearTrainerTimer();
  const total = trainer.queue.length;
  const correct = trainer.answers.filter(answer => answer?.correct).length;
  const percent = total ? Math.round(correct / total * 100) : 0;
  if (trainer.mode === 'surprise') {
    const surprise = state.progress.surprise;
    surprise.attempts += 1;
    surprise.best = Math.max(Number(surprise.best || 0), percent);
    surprise.lastAt = new Date().toISOString();
    surprise.history.push({ date: toISO(new Date()), correct, total });
    surprise.history = surprise.history.slice(-60);
  }
  const byTopic = {};
  trainer.answers.forEach((answer, index) => {
    if (!answer) return;
    const question = QUESTION_BY_ID[trainer.queue[index]];
    if (!question) return;
    if (!byTopic[question.topicId]) byTopic[question.topicId] = { correct: 0, total: 0 };
    byTopic[question.topicId].total += 1;
    if (answer.correct) byTopic[question.topicId].correct += 1;
  });
  Object.entries(byTopic).forEach(([topicId, value]) => {
    const progress = topicProgress(topicId);
    progress.practice = true;
    progress.attempts = Number(progress.attempts || 0) + 1;
    progress.best = Math.max(Number(progress.best || 0), Math.round(value.correct / value.total * 100));
    progress.lastPractice = new Date().toISOString();
  });
  state.progress.quizHistory.push({
    date: new Date().toISOString(),
    subject: trainer.subject,
    topicId: trainer.topicId,
    mode: trainer.mode,
    total,
    correct
  });
  if (trainer.originSessionId) {
    const session = (state.plan?.sessions || []).find(item => item.id === trainer.originSessionId);
    if (session && !sessionIsDone(session.id)) {
      completeSessionInternal(trainer.originSessionId, { noActivity: true });
      addActivity(session.duration, session.date);
    }
  } else {
    addActivity(Math.max(5, Math.round(total * 1.5)));
  }
  trainer.finished = true;
  saveState();
  render();
}

function getMistakeEntries() {
  return Object.values(state.progress.mistakes || {})
    .map(item => ({ ...item, question: QUESTION_BY_ID[item.questionId] }))
    .filter(item => item.question && profileSubjects().includes(item.question.subject))
    .sort((a, b) => String(b.lastAt).localeCompare(String(a.lastAt)));
}

function mistakesForCurrentFilter() {
  const entries = getMistakeEntries();
  if (mistakeFilter === 'all') return entries;
  return entries.filter(item => item.question.subject === mistakeFilter);
}

function renderMistakes() {
  const entries = mistakesForCurrentFilter();
  const allEntries = getMistakeEntries();
  const subjectCounts = {};
  allEntries.forEach(item => {
    subjectCounts[item.question.subject] = (subjectCounts[item.question.subject] || 0) + 1;
  });
  return '' +
    '<div class="page-head">' +
      '<div><h1>Журнал ошибок</h1><p>Ошибки — не приговор, а карта слабых мест. Разберите их и вернитесь в тему через 2–3 дня.</p></div>' +
      '<div class="page-actions">' +
        (allEntries.length ? '<button class="btn btn-secondary btn-sm" data-action="practice-mistakes">' + icon('rotate') + 'Тренировать все</button><button class="btn btn-ghost btn-sm" data-action="open-clear-mistakes">Очистить</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="mistakes-toolbar">' +
      '<div class="seg-chips">' +
        '<button class="seg-chip' + (mistakeFilter === 'all' ? ' active' : '') + '" data-action="mistake-filter" data-filter="all">Все · ' + allEntries.length + '</button>' +
        profileSubjects().map(id => '<button class="seg-chip' + (mistakeFilter === id ? ' active' : '') + '" data-action="mistake-filter" data-filter="' + id + '">' + SUBJECTS[id].short + ' · ' + (subjectCounts[id] || 0) + '</button>').join('') +
      '</div>' +
      '<span class="small muted">' + (entries.length ? 'Сначала свежие ошибки' : 'Пока пусто') + '</span>' +
    '</div>' +
    (entries.length ? '<div class="mistakes-list">' + entries.map(item => {
      const question = item.question;
      const topic = TOPIC_BY_ID[question.topicId];
      const subject = SUBJECTS[question.subject];
      const wrongAnswer = question.options[item.lastWrong] || '—';
      const rightAnswer = question.options[question.correct];
      return '' +
        '<article class="mistake-card">' +
          '<div class="mistake-top">' +
            '<span class="tag brand subject-tag" style="--subj-color:' + subject.color + ';--subj-soft:' + subject.soft + '">' + subject.short + '</span>' +
            '<span class="tag">' + escapeHTML(topic?.title || 'Тема') + '</span>' +
            '<span class="tag">' + (subject.isEssay ? 'Этап' : 'Часть ' + question.part) + '</span>' +
            '<span class="mistake-count">' + item.count + ' ' + pluralize(item.count, ['ошибка', 'ошибки', 'ошибок']) + '</span>' +
          '</div>' +
          '<div class="mistake-q">' + escapeHTML(question.text) + '</div>' +
          '<div class="mistake-answers"><span class="wrong">Вы ответили: ' + escapeHTML(wrongAnswer) + '</span><span class="right">Верно: ' + escapeHTML(rightAnswer) + '</span></div>' +
          '<div class="mistake-actions">' +
            '<button class="btn btn-soft" data-action="practice-mistake" data-question="' + question.id + '">' + icon('rotate') + 'Решить снова</button>' +
            '<button class="btn btn-secondary" data-action="open-theory" data-topic="' + question.topicId + '">' + icon('bookOpen') + 'К теории</button>' +
            '<button class="btn btn-ghost" data-action="remove-mistake" data-question="' + question.id + '">' + icon('check') + 'Уже не ошибаюсь</button>' +
          '</div>' +
          '<details class="mistake-details"><summary>Показать объяснение</summary><p>' + escapeHTML(question.explanation) + '</p></details>' +
        '</article>';
    }).join('') + '</div>' : '' +
      '<div class="card pad empty-state" style="padding:54px 24px"><div class="empty-ico">' + icon('checkCircle') + '</div><b>Журнал ошибок пуст</b><small>Это не значит, что ошибок не будет. Пройдите практику — сюда попадут задания, где нужен разбор.</small><button class="btn btn-primary btn-sm" data-action="nav" data-view="trainer">' + icon('target') + 'Начать тренировку</button></div>') +
    '<div class="notice" style="margin-top:16px">' + icon('lightbulb') + '<div>Ошибка исчезает из журнала автоматически после правильного решения. Если задание даётся тяжело, вернитесь к теории и объяснению, а не просто перещёлкивайте ответы.</div></div>';
}

function renderProgress() {
  const totalMinutes = Object.values(state.progress.activity || {}).reduce((sum, value) => sum + Number(value || 0), 0);
  const days = Array.from({ length: 14 }, (_, index) => addDays(startOfDay(new Date()), index - 13));
  const maxMinutes = Math.max(30, ...days.map(day => Number(state.progress.activity[toISO(day)] || 0)));
  const doneEntries = Object.entries(state.progress.sessions || {})
    .filter(([, value]) => value?.doneAt)
    .sort((a, b) => String(b[1].doneAt).localeCompare(String(a[1].doneAt)))
    .map(([id, value]) => {
      const session = (state.plan?.sessions || []).find(item => item.id === id);
      return session ? { session, doneAt: value.doneAt } : null;
    })
    .filter(Boolean)
    .slice(0, 6);
  const overdue = overdueSessions().slice(0, 3);
  const weak = topWeakTopics(3).filter(topic => !isTopicDone(topic.id)).slice(0, 3);
  const lagItems = overdue.map(session => ({
    icon: 'calendar',
    title: (TOPIC_BY_ID[session.topicId]?.title || session.title),
    note: 'Пропущено ' + formatDateShort(session.date) + ' · ' + SUBJECTS[session.subject].short,
    action: session.type === 'theory' ? 'open-theory' : session.type === 'mock' ? 'start-mock' : 'start-practice',
    topicId: session.topicId,
    subject: session.subject,
    sessionId: session.id,
    label: 'Вернуться'
  })).concat(weak.map(topic => ({
    icon: 'target',
    title: topic.title,
    note: SUBJECTS[topic.subject].short + ' · вес ' + topic.weight + '/5 · ' + (state.progress.topics[topic.id]?.attempts ? 'лучший результат ' + (state.progress.topics[topic.id]?.best || 0) + '%' : 'ещё не практиковались'),
    action: 'start-practice',
    topicId: topic.id,
    subject: topic.subject,
    label: 'Практика'
  }))).slice(0, 5);
  const statCards = [
    ['checkCircle', totalTopicsDone() + ' / ' + totalSelectedTopics(), 'тем освоено', '#e7f8f0', '#12b76a'],
    ['clock', formatMinutes(totalMinutes), 'всего практики', '#eaf4ff', '#2e90fa'],
    ['target', overallAccuracy() ? overallAccuracy() + '%' : '—', 'точность ответов', '#eeecff', '#5146e5'],
    ['flame', currentStreak() + ' ' + pluralize(currentStreak(), ['день', 'дня', 'дней']), 'текущая серия', '#fff4e5', '#f79009']
  ].map(item => '<div class="stat-card"><div class="stat-icon" style="--icon-bg:' + item[3] + ';--icon-color:' + item[4] + '">' + icon(item[0]) + '</div><div><b>' + item[1] + '</b><small>' + item[2] + '</small></div></div>').join('');
  return '' +
    '<div class="page-head">' +
      '<div><h1>Прогресс</h1><p>Не только проценты: важно, что вы уже сделали и где нужен следующий шаг.</p></div>' +
      '<div class="page-actions"><button class="btn btn-secondary btn-sm" data-action="nav" data-view="mistakes">' + icon('alert') + 'Журнал ошибок</button><button class="btn btn-primary btn-sm" data-action="nav" data-view="plan">' + icon('calendar') + 'К плану</button></div>' +
    '</div>' +
    '<div class="stat-grid" style="margin-bottom:16px">' + statCards + '</div>' +
    '<div style="margin-bottom:16px">' + renderForecastDetail() + '</div>' +
    '<div style="margin-bottom:16px">' + renderPseCard() + '</div>' +
    '<div class="mind-grid">' + renderReflectionCard() + renderMoodCard() + '</div>' +
    '<div style="margin-top:16px;margin-bottom:16px">' + renderAnxietyCard() + '</div>' +
    '<div class="progress-page-grid">' +
      '<div>' +
        '<section class="card activity-card" style="margin-bottom:16px">' +
          '<div class="activity-head"><div><h2>Ритм занятий</h2><p>Минуты учебной активности за 14 дней</p></div><div class="activity-total"><b>' + formatMinutes(weeklyMinutes()) + '</b><small>за 7 дней</small></div></div>' +
          '<div class="activity-bars">' + days.map(day => {
            const iso = toISO(day);
            const minutes = Number(state.progress.activity[iso] || 0);
            const height = Math.max(2, Math.round(minutes / maxMinutes * 100));
            return '<div class="activity-day' + (minutes > maxMinutes * .65 ? ' high' : '') + (iso === toISO(new Date()) ? ' today' : '') + '"><div class="activity-bar-wrap"><div class="activity-bar" style="height:' + height + '%"></div></div><small>' + day.getDate() + '</small><span class="mins">' + (minutes ? minutes : '') + '</span></div>';
          }).join('') + '</div>' +
          '<div class="notice" style="margin-top:16px">' + icon('info') + '<div>Серия считается по дням с завершёнными занятиями или практикой. Пропуск одного дня не обнуляет прогресс — просто возвращайтесь в ритм.</div></div>' +
        '</section>' +
        '<section class="card pad">' +
          '<div class="card-head"><div><h3>Предметы</h3><p>Темы, где есть и теория, и практика</p></div><span class="badge brand">' + profileSubjects().length + ' ' + pluralize(profileSubjects().length, ['предмет', 'предмета', 'предметов']) + '</span></div>' +
          '<div style="margin-top:12px">' + profileSubjects().map(id => {
            const subject = SUBJECTS[id];
            const topics = topicsForSubject(id);
            const done = topics.filter(topic => isTopicDone(topic.id)).length;
            const percent = topics.length ? Math.round(done / topics.length * 100) : 0;
            return '<div style="padding:13px 0;border-bottom:1px solid var(--line-2)">' +
              '<div style="display:flex;align-items:center;gap:9px;margin-bottom:8px"><span class="legend-dot" style="background:' + subject.color + '"></span><b style="font-size:11.5px">' + subject.short + '</b><span class="small muted" style="margin-left:auto;font-size:9.5px">' + done + ' / ' + topics.length + ' тем · ' + subjectAccuracy(id) + '%</span></div>' +
              '<div class="coverage-track"><span style="width:' + percent + '%;background:' + subject.color + '"></span></div>' +
            '</div>';
          }).join('') + '</div>' +
        '</section>' +
      '</div>' +
      '<div>' +
        '<section class="card pad" style="margin-bottom:16px">' +
          '<div class="card-head"><div><h3>Что отстаёт</h3><p>Следующие шаги, а не приговор</p></div></div>' +
          (lagItems.length ? '<div class="lag-list" style="margin-top:12px">' + lagItems.map(item => '' +
            '<div class="lag-item"><span class="lag-ico">' + icon(item.icon) + '</span><div style="min-width:0"><b>' + escapeHTML(item.title) + '</b><small>' + escapeHTML(item.note) + '</small></div><button class="btn btn-soft" data-action="' + item.action + '" data-topic="' + (item.topicId || '') + '" data-subject="' + (item.subject || '') + '" data-session="' + (item.sessionId || '') + '">' + item.label + '</button></div>'
          ).join('') + '</div>' : '<div class="empty-state" style="padding:24px 10px"><b>Всё под контролем</b><small>Нет просроченных занятий. Можно двигаться по плану.</small></div>') +
        '</section>' +
        '<section class="card pad">' +
          '<div class="card-head"><div><h3>Что сделано</h3><p>Последние завершённые шаги</p></div><span class="badge mint">' + Object.keys(state.progress.sessions || {}).filter(id => sessionIsDone(id)).length + '</span></div>' +
          (doneEntries.length ? '<div class="done-list" style="margin-top:8px">' + doneEntries.map(item => '' +
            '<div class="done-item"><span class="done-check">' + icon('check') + '</span><b>' + escapeHTML(TOPIC_BY_ID[item.session.topicId]?.title || item.session.title) + '</b><small>' + formatDate(new Date(item.doneAt), { day: 'numeric', month: 'short' }) + '</small></div>'
          ).join('') + '</div>' : '<div class="empty-state" style="padding:24px 10px"><b>Пока нет отметок</b><small>Отметьте занятие выполненным или пройдите практику.</small></div>') +
        '</section>' +
      '</div>' +
    '</div>';
}

function renderForecastDetail() {
  const { forecast, trend } = forecastOverview();
  const sparkDays = Array.from({ length: 7 }, (_, index) => addDays(startOfDay(new Date()), index - 6));
  const subjectRows = forecast.subjects.map(item => {
    const subject = SUBJECTS[item.subjectId];
    return '' +
      '<div class="subject-forecast-row" style="--subj-color:' + subject.color + '">' +
        '<div class="subject-forecast-name"><span class="legend-dot" style="background:' + subject.color + '"></span><span>' + escapeHTML(subject.short) + '</span></div>' +
        '<div class="subject-forecast-score">' + item.low + '–' + item.high + ' <small>· ' + item.score + ' б.</small></div>' +
        '<div class="subject-forecast-track"><span style="width:' + item.score + '%"></span></div>' +
      '</div>';
  }).join('');
  return '' +
    '<section class="card forecast-detail">' +
      '<div class="card-head">' +
        '<div><h3>Прогноз баллов</h3><p>Живая оценка по закрытым темам, весам КИМ и точности практики</p></div>' +
        '<span class="badge brand">' + icon('trendUp') + 'обновляется сразу</span>' +
      '</div>' +
      (forecast.maxTotal ? '' +
        '<div class="forecast-detail-top">' +
          '<div class="forecast-big">' +
            '<b>' + forecast.lowTotal + '–' + forecast.highTotal + '</b>' +
            '<small>сумма по ' + forecast.subjects.length + ' ' + pluralize(forecast.subjects.length, ['предмету', 'предметам', 'предметам']) + ' · средний ' + forecast.avg + ' из 100</small>' +
            forecastTrendHTML(trend) +
          '</div>' +
          '<div style="flex:1;min-width:160px">' +
            '<div class="forecast-spark">' + forecastSparkBars() + '</div>' +
            '<div class="forecast-spark-labels">' + sparkDays.map(day => '<span>' + WEEKDAYS_SHORT[day.getDay()] + '</span>').join('') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="subject-forecast-list">' + subjectRows +
          (forecast.essay ? '<div class="subject-forecast-row" style="--subj-color:' + SUBJECTS.essay.color + '">' +
            '<div class="subject-forecast-name"><span class="legend-dot" style="background:' + SUBJECTS.essay.color + '"></span><span>Сочинение</span></div>' +
            '<div class="subject-forecast-score">' + (forecast.essay.ready ? 'допуск' : forecast.essay.done + ' / ' + forecast.essay.total) + ' <small>· ' + (forecast.essay.ready ? 'готово' : 'этапов') + '</small></div>' +
            '<div class="subject-forecast-track"><span style="width:' + Math.round(forecast.essay.done / forecast.essay.total * 100) + '%;background:' + SUBJECTS.essay.color + '"></span></div>' +
          '</div>' : '') +
        '</div>' +
        '<div class="forecast-foot-note">Это ориентир, а не официальный балл: прогноз пересчитывается после каждой практики и учитывает покрытие тем. Чем больше реальных ответов, тем уже диапазон.</div>'
      : '<div class="empty-state" style="padding:30px 16px"><div class="empty-ico">' + icon('chart') + '</div><b>Пока нечего прогнозировать</b><small>Добавьте хотя бы один предмет ЕГЭ, кроме сочинения.</small></div>') +
    '</section>';
}

function renderDailyQuestionCard() {
  const meta = dailyQuestionMeta();
  if (!meta || !meta.question) return '';
  const { daily, question, topic } = meta;
  const subject = SUBJECTS[question.subject];
  const answeredDays = dailyQuestionCount();
  const explanationClass = daily.correct ? 'good' : 'bad';
  return '' +
    '<section class="card pad daily-card">' +
      '<div class="card-head">' +
        '<div><div class="daily-top"><span class="badge brand">' + icon('quote') + 'Вопрос дня</span><span class="tag">' + escapeHTML(subject.short) + '</span><span class="tag">' + escapeHTML(topic ? topic.title : 'Слабая тема') + '</span></div><p style="margin-top:8px">Одна короткая карточка из темы, которая сейчас просит внимания.</p></div>' +
        '<span class="badge mint">' + answeredDays + ' ' + pluralize(answeredDays, ['день', 'дня', 'дней']) + ' с вопросом</span>' +
      '</div>' +
      '<div class="daily-question">' + escapeHTML(question.text) + '</div>' +
      '<div class="daily-options">' + question.options.map((option, index) => {
        let className = 'daily-option';
        if (daily.checked) {
          className += ' disabled';
          if (index === question.correct) className += ' correct';
          else if (index === daily.selected) className += ' wrong';
        } else if (index === daily.selected) className += ' selected';
        return '<button class="' + className + '" data-action="daily-option" data-index="' + index + '"><span class="option-letter">' + ['А', 'Б', 'В', 'Г'][index] + '</span><span>' + escapeHTML(option) + '</span></button>';
      }).join('') + '</div>' +
      (daily.checked ? '<div class="daily-explanation ' + explanationClass + '">' +
        '<b>' + icon(daily.correct ? 'checkCircle' : 'alert') + (daily.correct ? 'Верно' : 'Неверно. Правильный ответ — ' + ['А', 'Б', 'В', 'Г'][question.correct]) + '</b>' +
        '<span>' + escapeHTML(question.explanation) + '</span>' +
      '</div>' : '') +
      '<div class="daily-foot">' +
        '<div class="daily-source">Авторский аналог в формате ЕГЭ. Оригинальные задания и ответы — в ' + fipiSubjectLink(question.subject, 'открытом банке ФИПИ') + '.</div>' +
        (daily.checked
          ? '<span class="badge mint">' + icon('check') + 'ответ сохранён</span>'
          : '<button class="btn btn-primary btn-sm" data-action="daily-check"' + (daily.selected === null ? ' disabled' : '') + '>' + icon('check') + 'Проверить</button>') +
      '</div>' +
    '</section>';
}

function renderAchievementTeaser() {
  const states = ACHIEVEMENTS.map(achievementState);
  const unlocked = states.filter(item => item.unlocked).length;
  const locked = states.filter(item => !item.unlocked).sort((a, b) => b.percent - a.percent).slice(0, 3);
  return '' +
    '<section class="card pad ach-teaser">' +
      '<div class="card-head"><div><h3>Дерево достижений</h3><p>Маленькие подтверждения того, что вы не стоите на месте</p></div><span class="badge brand">' + unlocked + ' / ' + states.length + '</span></div>' +
      (locked.length
        ? '<div class="ach-teaser-list">' + locked.map(item => (
          '<div class="ach-teaser-item">' +
            '<span class="ach-teaser-ico">' + icon(item.icon) + '</span>' +
            '<span style="flex:1;min-width:0"><b>' + escapeHTML(item.title) + '</b><small>' + escapeHTML(item.desc) + '</small><div class="ach-teaser-progress"><span style="width:' + item.percent + '%"></span></div></span>' +
            '<span class="ach-teaser-meta">' + achievementValueLabel(item, item.current) + ' / ' + achievementValueLabel(item, item.target) + '</span>' +
          '</div>'
        )).join('') + '</div>'
        : '<div class="empty-state" style="padding:24px 12px"><div class="empty-ico">' + icon('trophy') + '</div><b>Все достижения открыты</b><small>Дерево выросло полностью. Теперь — только повторение и уверенность.</small></div>') +
      '<button class="section-link" data-action="nav" data-view="achievements">Смотреть всё дерево ' + icon('arrowRight') + '</button>' +
    '</section>';
}

function renderAchievements() {
  const states = ACHIEVEMENTS.map(achievementState);
  const unlocked = states.filter(item => item.unlocked).length;
  const percent = states.length ? Math.round(unlocked / states.length * 100) : 0;
  const circumference = 2 * Math.PI * 36;
  const branches = Object.entries(ACHIEVEMENT_BRANCHES).map(([id, branch], index) => {
    const branchStates = states.filter(item => item.branch === id);
    const branchUnlocked = branchStates.filter(item => item.unlocked).length;
    const nodes = branchStates.map(item => '' +
      '<div class="ach-node ' + (item.unlocked ? 'unlocked' : 'locked') + (freshAchievements.has(item.id) ? ' fresh' : '') + '">' +
        '<span class="ach-node-icon">' + icon(item.icon) + '</span>' +
        '<span class="ach-node-body">' +
          '<b>' + escapeHTML(item.title) + '</b>' +
          '<small>' + escapeHTML(item.desc) + '</small>' +
          '<div class="ach-node-progress"><span style="width:' + item.percent + '%"></span></div>' +
          '<span class="ach-node-meta"><span>' + achievementValueLabel(item, item.current) + ' / ' + achievementValueLabel(item, item.target) + '</span><span class="' + (item.unlocked ? 'ok' : '') + '">' + (item.unlocked ? 'получено' : item.percent + '%') + '</span></span>' +
        '</span>' +
      '</div>'
    ).join('');
    return '' +
      '<div class="ach-branch">' +
        '<div class="ach-branch-head"><span class="ach-branch-dot">' + (index + 1) + '</span><b>' + escapeHTML(branch.title) + '</b><small>' + escapeHTML(branch.subtitle) + '</small><span class="ach-branch-count">' + branchUnlocked + ' / ' + branchStates.length + '</span></div>' +
        '<div class="ach-nodes">' + nodes + '</div>' +
      '</div>';
  }).join('');
  const topicsGrid = profileSubjects().map(subjectId => {
    const subject = SUBJECTS[subjectId];
    const topics = topicsForSubject(subjectId);
    const done = topics.filter(topic => isTopicDone(topic.id));
    return '' +
      '<div class="ach-subject-topics" style="--subj-color:' + subject.color + '">' +
        '<div class="ach-subject-topics-head"><span class="legend-dot" style="background:' + subject.color + '"></span><b>' + escapeHTML(subject.short) + '</b><span>' + done.length + ' / ' + topics.length + '</span></div>' +
        (done.length
          ? done.slice(0, 8).map(topic => '<div class="topic-pill">' + icon('check') + '<span>' + escapeHTML(topic.title) + '</span></div>').join('') +
            (done.length > 8 ? '<div class="topic-pill empty">и ещё ' + (done.length - 8) + ' ' + pluralize(done.length - 8, ['тема', 'темы', 'тем']) + '</div>' : '')
          : '<div class="topic-pill empty">Пока нет закрытых тем — всё впереди.</div>') +
      '</div>';
  }).join('');
  return '' +
    '<div class="page-head">' +
      '<div><h1>Дерево достижений</h1><p>Не рейтинг и не гонка. Здесь растут подтверждения вашей регулярности, закрытых тем и времени в практике.</p></div>' +
      '<div class="page-actions"><button class="btn btn-secondary btn-sm" data-action="nav" data-view="progress">' + icon('chart') + 'К прогрессу</button><button class="btn btn-primary btn-sm" data-action="nav" data-view="plan">' + icon('calendar') + 'Продолжить план</button></div>' +
    '</div>' +

function applyRebalance(reason) {
  const profile = state.profile;
  if (!profile) return;
  const rebalance = state.progress.rebalance || {};
  let title = 'Подход обновлён';
  let text = 'План пересобран.';
  if (reason === 'time' || reason === 'tired') {
    rebalance.prevDailyMinutes = rebalance.prevDailyMinutes || Number(profile.dailyMinutes || 90);
    profile.dailyMinutes = Math.max(30, Number(profile.dailyMinutes || 90) - 15);
    title = reason === 'time' ? 'Темп стал бережнее' : 'Разрешили себе отдых';
    text = 'Дневная нагрузка — ' + formatMinutes(profile.dailyMinutes) + '. Это не отставание, а способ не бросить.';
    if (reason === 'tired') {
      if (rebalance.prevSpacedReview === undefined) rebalance.prevSpacedReview = Boolean(profile.spacedReview);
      profile.spacedReview = true;
      text += ' Повторение включено, чтобы темы не забывались.';
    }
  } else if (reason === 'topic') {
    const topicId = TOPIC_BY_ID[rebalance.lastMissedTopicId] ? rebalance.lastMissedTopicId : topWeakTopics(1)[0]?.id;
    rebalance.focusTopicId = topicId || null;
    title = 'Тема взята в фокус';
    text = topicId ? 'Начнём с темы «' + TOPIC_BY_ID[topicId].title + '»: сначала теория, потом практика.' : 'План пересобран с приоритетом слабых тем.';
  }
  rebalance.pendingReason = false;
  rebalance.reason = reason;
  rebalance.appliedAt = new Date().toISOString();
  state.plan = generatePlan(profile);
  planWeekStart = startOfWeek(new Date());
  selectedPlanDate = toISO(new Date());
  modal = null;
  saveState();
  render();
  showToast(title, text, 'success');
}

function dismissRebalance() {
  if (state.progress.rebalance) {
    state.progress.rebalance.pendingReason = false;
    state.progress.rebalance.dismissedAt = new Date().toISOString();
  }
  modal = null;
  saveState();

}

function resetPace() {
  const profile = state.profile;

  if (!profile || !rebalance) return;

  if (restoredPace && rebalance.prevSpacedReview !== undefined) profile.spacedReview = Boolean(rebalance.prevSpacedReview);
  state.progress.rebalance = rebalance.lastSignature ? { lastSignature: rebalance.lastSignature } : null;

function emptyDiagnosticState() {
  return { mode: 'test', ratings: {}, confirmed: false, completed: false, result: null, prior: false };
}

function diagnosticFromProgress() {
  const prior = state.progress.diagnostic;
  if (!prior?.completedAt) return emptyDiagnosticState();
  return {
    mode: prior.mode === 'self' ? 'self' : 'test',
    ratings: { ...(prior.ratings || {}) },
    confirmed: true,
    completed: true,
    result: prior.result ? JSON.parse(JSON.stringify(prior.result)) : null,
    prior: true
  };
}

function ensureObDiagnostic() {
  if (!obDraft) obDraft = buildOnboardingDraft();
  if (!obDraft.diagnostic) obDraft.diagnostic = emptyDiagnosticState();
  return obDraft.diagnostic;
}

function diagnosticSubjects() {
  return (obDraft?.subjects || []).filter(id => SUBJECTS[id]);
}

function buildDiagnosticQueue() {
  const subjects = diagnosticSubjects();
  if (!subjects.length) return [];
  const target = 15;
  const base = Math.floor(target / subjects.length);
  const extra = target % subjects.length;
  const perSubject = subjects.map((subjectId, index) => {
    const quota = base + (index < extra ? 1 : 0);
    const topicPools = shuffle(topicsForSubject(subjectId)).map(topic => shuffle(topic.questions.map(question => question.id)));
    const picked = [];
    let round = 0;
    while (picked.length < quota && round < 4) {
      topicPools.forEach(pool => {
        if (pool[round] && picked.length < quota) picked.push(pool[round]);
      });
      round += 1;
    }
    return picked;
  });
  const queue = [];
  const maxLen = Math.max(0, ...perSubject.map(list => list.length));
  for (let index = 0; index < maxLen; index += 1) {
    perSubject.forEach(list => {
      if (list[index] && queue.length < target) queue.push(list[index]);
    });
  }
  return [...new Set(queue)];
}

function startObDiagQuiz() {
  const diag = ensureObDiagnostic();
  const queue = buildDiagnosticQueue();
  if (!queue.length) {
    showToast('Нет вопросов', 'Выберите хотя бы один предмет с заданиями.', 'warn');
    return;
  }
  diag.mode = 'test';
  diag.confirmed = false;
  diag.completed = false;
  diag.result = null;
  obDiagQuiz = { queue, index: 0, selected: null, checked: false, answers: [], finished: false };
  render();
  requestAnimationFrame(() => document.querySelector('[data-ob-body]')?.scrollTo(0, 0));
}

function finishObDiagQuiz() {
  if (!obDiagQuiz) return;
  const diag = ensureObDiagnostic();
  const total = obDiagQuiz.queue.length;
  const answers = obDiagQuiz.answers.filter(Boolean);
  const correct = answers.filter(answer => answer.correct).length;
  const bySubject = {};
  const detailedAnswers = answers.map((answer, index) => {
    const question = QUESTION_BY_ID[obDiagQuiz.queue[index]];
    if (!question) return null;
    if (!bySubject[question.subject]) bySubject[question.subject] = { correct: 0, total: 0 };
    bySubject[question.subject].total += 1;
    if (answer.correct) bySubject[question.subject].correct += 1;
    return { qid: question.id, selected: answer.selected, correct: answer.correct };
  }).filter(Boolean);
  diag.result = {
    total,
    correct,
    percent: total ? Math.round(correct / total * 100) : 0,
    bySubject,
    answers: detailedAnswers,
    finishedAt: new Date().toISOString()
  };
  diag.completed = true;
  diag.confirmed = true;
  diag.mode = 'test';
  obDiagQuiz.finished = true;
  render();
  requestAnimationFrame(() => document.querySelector('[data-ob-body]')?.scrollTo(0, 0));
}

function resetObDiagnostic() {
  const current = ensureObDiagnostic();
  obDraft.diagnostic = { ...emptyDiagnosticState(), mode: current.mode };
  obDiagQuiz = null;
}

function applyDiagnosticProgress(diag) {
  if (!diag) return;
  const profile = state.profile;
  if (!profile) return;
  const now = new Date().toISOString();
  const allowed = id => Boolean(TOPIC_BY_ID[id]) && profile.subjects.includes(TOPIC_BY_ID[id].subject);
  Object.entries(diag.ratings || {}).forEach(([topicId, rating]) => {
    if (!allowed(topicId) || rating === 'none') return;
    const progress = topicProgress(topicId);
    if (rating === 'know') {
      progress.theory = true;
      progress.practice = true;
      progress.best = Math.max(Number(progress.best || 0), 82);
      progress.attempts = Math.max(Number(progress.attempts || 0), 1);
    } else if (rating === 'tried') {
      progress.theory = true;
      progress.best = Math.max(Number(progress.best || 0), 52);
      progress.attempts = Math.max(Number(progress.attempts || 0), 1);
    }
    progress.diagnostic = rating;
  });
  const answers = diag.result?.answers || [];
  const byTopic = {};
  answers.forEach(answer => {
    const question = QUESTION_BY_ID[answer.qid];
    if (!question || !profile.subjects.includes(question.subject)) return;
    if (!byTopic[question.topicId]) byTopic[question.topicId] = { correct: 0, total: 0 };
    byTopic[question.topicId].total += 1;
    if (answer.correct) byTopic[question.topicId].correct += 1;
  });
  Object.entries(byTopic).forEach(([topicId, stats]) => {
    const progress = topicProgress(topicId);
    const accuracy = (stats.correct + 0.5) / (stats.total + 1);
    progress.practice = true;
    progress.attempts = Math.max(Number(progress.attempts || 0), 1);
    progress.best = Math.max(Number(progress.best || 0), Math.min(90, Math.round(accuracy * 100)));
    if (accuracy >= 0.5) progress.theory = true;
    progress.lastPractice = progress.lastPractice || now;
    progress.diagnostic = 'test';
  });
  const bySubject = diag.result?.bySubject || {};
  Object.entries(bySubject).forEach(([subjectId, stats]) => {
    if (!SUBJECTS[subjectId] || !stats.total) return;
    state.progress.quizHistory.push({
      date: now,
      subject: subjectId,
      topicId: null,
      mode: 'diagnostic',
      total: stats.total,
      correct: stats.correct
    });
  });
  const selectedTopics = profile.subjects.flatMap(subjectId => topicsForSubject(subjectId));
  const summary = diag.mode === 'self'
    ? {
        know: selectedTopics.filter(topic => diag.ratings?.[topic.id] === 'know').length,
        tried: selectedTopics.filter(topic => diag.ratings?.[topic.id] === 'tried').length,
        none: selectedTopics.filter(topic => !diag.ratings?.[topic.id] || diag.ratings[topic.id] === 'none').length,
        total: selectedTopics.length
      }
    : {
        correct: diag.result?.correct || 0,
        total: diag.result?.total || 0,
        percent: diag.result?.percent || 0
      };
  state.progress.diagnostic = {
    completedAt: now,
    mode: diag.mode,
    ratings: { ...(diag.ratings || {}) },
    result: diag.result ? JSON.parse(JSON.stringify(diag.result)) : null,
    summary
  };
}

function renderObDiagQuiz() {
  const quiz = obDiagQuiz;
  const question = QUESTION_BY_ID[quiz.queue[quiz.index]];
  if (!question) return '';
  const topic = TOPIC_BY_ID[question.topicId];
  const subject = SUBJECTS[question.subject];
  const answer = quiz.answers[quiz.index];
  const isLast = quiz.index >= quiz.queue.length - 1;
  const progress = Math.round(quiz.index / quiz.queue.length * 100);
  return '' +
    '<div class="diag-quiz-wrap">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="ob-label" style="margin:0">Вопрос ' + (quiz.index + 1) + ' из ' + quiz.queue.length + '</span><button class="section-link" data-action="diag-exit">' + icon('x') + 'Прервать</button></div>' +
      '<div class="quiz-progress" style="margin-top:9px"><span style="width:' + progress + '%"></span></div>' +
      '<div class="quiz-card" style="box-shadow:none;padding:22px;margin-top:14px">' +
        '<div class="quiz-meta"><span class="quiz-qnum">' + (quiz.index + 1) + '</span><span class="tag brand">' + escapeHTML(subject.short) + '</span><span class="tag">' + escapeHTML(topic ? topic.title : 'Диагностика') + '</span></div>' +
        '<div class="quiz-question" style="font-size:17px">' + escapeHTML(question.text) + '</div>' +
        '<div class="quiz-options">' + question.options.map((option, index) => {
          let className = 'quiz-option';
          if (quiz.checked) {
            className += ' disabled';
            if (index === question.correct) className += ' correct';
            else if (index === quiz.selected) className += ' wrong';
          } else if (index === quiz.selected) className += ' selected';
          return '<button class="' + className + '" data-action="diag-option" data-index="' + index + '"><span class="option-letter">' + ['А', 'Б', 'В', 'Г'][index] + '</span><span>' + escapeHTML(option) + '</span></button>';

function renderObDiagResult(diag) {

    '<div class="summary-item"><small>' + escapeHTML(SUBJECTS[subjectId]?.short || subjectId) + '</small><b>' + stats.correct + ' / ' + stats.total + ' · ' + Math.round(stats.correct / Math.max(1, stats.total) * 100) + '%</b></div>'

    '<div class="diag-result"><div class="diag-result-score">' + result.percent + '%</div><div><b>' + (result.percent >= 70 ? 'Уверенная стартовая точка' : result.percent >= 40 ? 'База есть, есть что укрепить' : 'Честная точка старта — уже хорошо') + '</b><small>' + result.correct + ' верных из ' + result.total + '. Результат уже учтён в стартовом прогрессе и плане.</small></div><button class="btn btn-secondary btn-sm" data-action="diag-restart">' + icon('rotate') + 'Пройти заново</button></div>' +

          '<div class="diag-topic-list">' + topics.map(topic => {

            return '' +

                  '<button class="' + (rating === 'know' ? 'active' : '') + '" data-rating="know" data-action="diag-rate" data-topic="' + topic.id + '" data-value="know">уверенно</button>' +

}

function buildOnboardingDraft() {
  const profile = state.profile;
  const examYear = profile?.examYear || resolveExamYear();
  const generatedDates = examDatesForYear(examYear);
  const selected = profile?.subjects?.filter(id => SUBJECTS[id]) || ['essay'];
  const targets = {};
  const levels = {};
  SUBJECT_ORDER.forEach(id => {
    targets[id] = Number(profile?.targets?.[id] || (id === 'essay' ? 5 : 80));
    levels[id] = profile?.levels?.[id] || 'basic';
  });
  return {
    name: profile?.name || currentUser?.name || '',
    subjects: [...selected],
    targets,
    levels,
    examYear,
    examDates: { ...generatedDates, ...(profile?.examDates || {}) },
    studyDays: [...(profile?.studyDays || [1, 2, 3, 4, 5, 6])].map(Number),
    dailyMinutes: Number(profile?.dailyMinutes || 90),
    sessionMinutes: Number(profile?.sessionMinutes || 45),
    preferredTimes: [...(profile?.preferredTimes || DEFAULT_PREFERRED_TIMES)],
    schoolEnd: profile?.schoolEnd || '15:00',
    tutorDays: [...(profile?.tutorDays || [])].map(Number),
    tutorTime: profile?.tutorTime || '17:00',
    sleepStart: profile?.sleepStart || '23:00',
    bufferDay: Number(profile?.bufferDay || 7),
    miniMocks: profile?.miniMocks !== undefined ? Boolean(profile.miniMocks) : true,
    spacedReview: profile?.spacedReview !== undefined ? Boolean(profile.spacedReview) : true,
    notify: Boolean(state.settings.notify),
    emailNotify: Boolean(state.settings.emailNotify),
    email: state.settings.email || '',
    support: ['manual', 'calendar'],
    diagnostic: diagnosticFromProgress()
  };
}

function draftProfile(draft) {
  const examDates = {};
  draft.subjects.forEach(id => {
    examDates[id] = draft.examDates[id] || examDatesForYear(draft.examYear)[id];
  });
  const targets = {};
  const levels = {};
  draft.subjects.forEach(id => {
    targets[id] = Number(draft.targets[id] || (id === 'essay' ? 5 : 80));
    levels[id] = draft.levels[id] || 'basic';
  });
  return {
    name: String(draft.name || '').trim() || 'Ученик',
    subjects: [...draft.subjects],
    targets,
    levels,
    examYear: draft.examYear,
    examDates,
    studyDays: [...draft.studyDays].map(Number).sort(),
    dailyMinutes: Number(draft.dailyMinutes),
    sessionMinutes: Number(draft.sessionMinutes),
    preferredTimes: [...draft.preferredTimes].sort(),
    schoolEnd: draft.schoolEnd,
    tutorDays: [...draft.tutorDays].map(Number),
    tutorTime: draft.tutorTime,
    sleepStart: draft.sleepStart,
    bufferDay: Number(draft.bufferDay),
    miniMocks: Boolean(draft.miniMocks),
    spacedReview: Boolean(draft.spacedReview)
  };
}

function previewDiagnosticPlan(draft) {
  if (!draft) return null;
  const profile = draftProfile(draft);
  const savedProfile = state.profile;
  const savedProgress = state.progress;
  try {
    state.profile = profile;
    state.progress = normalizeProgress(state.progress);
    if (draft.diagnostic) applyDiagnosticProgress(draft.diagnostic);
    return { profile, plan: generatePlan(profile) };
  } catch (error) {
    return null;
  } finally {
    state.profile = savedProfile;
    state.progress = savedProgress;
  }
}

function validateObStep(step) {
  const d = obDraft;
  if (step === 0 && !d.subjects.length) {
    showToast('Выберите хотя бы один предмет', 'Без предметов маршрут не собрать.', 'warn');
    return false;
  }
  if (step === 1) {
    const diag = d.diagnostic || emptyDiagnosticState();
    if (diag.mode === 'test' && !diag.completed) {
      showToast('Диагностика не завершена', 'Пройдите короткий тест или переключитесь на самооценку.', 'warn');
      return false;
    }
    if (diag.mode === 'self' && !diag.confirmed) {
      showToast('Подтвердите самооценку', 'Так мы поймём, что можно пропустить в стартовом плане.', 'warn');
      return false;
    }
  }
  if (step === 3) {
    if (!d.studyDays.length) {
      showToast('Нужен хотя бы один учебный день', 'Иначе занятиям негде появиться.', 'warn');
      return false;
    }
    if (!d.preferredTimes.length) {
      showToast('Выберите удобное время', 'Плану нужен хотя бы один слот.', 'warn');
      return false;
    }
    if (Number(d.dailyMinutes) < Number(d.sessionMinutes)) {
      showToast('Дневная нагрузка меньше занятия', 'Увеличьте нагрузку или сократите занятие.', 'warn');
      return false;
    }
  }
  if (step === 4) {
    if (timeToMinutes(d.schoolEnd) >= timeToMinutes(d.sleepStart)) {
      showToast('Проверьте время', 'Школа не может заканчиваться после отхода ко сну.', 'warn');
      return false;
    }
    if (timeToMinutes(d.tutorTime) + 60 > timeToMinutes(d.sleepStart)) {
      showToast('Репетитор слишком поздно', 'Занятие должно успеть закончиться до сна.', 'warn');
      return false;
    }
  }
  if (step === 5 && d.emailNotify) {
    const email = String(d.email || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showToast('Проверьте email', 'Для email-напоминаний нужен корректный адрес.', 'warn');
      return false;
    }
  }
  return true;
}

function saveEmailSetting(value) {
  state.settings.email = String(value || '').trim();
}

function completeOnboarding() {
  if (!validateObStep(6)) return;
  const profile = draftProfile(obDraft);
  const previousPlan = state.plan;
  const diagnostic = obDraft.diagnostic;
  state.profile = profile;
  state.onboarded = true;
  state.settings.notify = Boolean(obDraft.notify);
  state.settings.emailNotify = Boolean(obDraft.emailNotify);
  state.settings.email = String(obDraft.email || '').trim();
  applyDiagnosticProgress(diagnostic);
  state.plan = generatePlan(profile);
  state.meta.profileUpdatedAt = new Date().toISOString();
  state.progress.activity[toISO(new Date())] = Number(state.progress.activity[toISO(new Date())] || 0);
  if (state.progress.diagnostic) {
    const baseline = computeForecast();
    state.progress.diagnostic.baseline = {
      score: baseline.totalScore,
      low: baseline.lowTotal,
      high: baseline.highTotal,
      avg: baseline.avg,
      at: new Date().toISOString()
    };
  }
  planWeekStart = startOfWeek(new Date());
  selectedPlanDate = toISO(new Date());
  selectedSubject = null;
  trainer = null;
  modal = null;
  obDiagQuiz = null;
  obDraft = null;
  obStep = 0;
  editingProfile = false;
  view = 'dashboard';
  recordForecastSnapshot();
  saveState();
  if (state.settings.notify && typeof Notification !== 'undefined' && Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
  const forecast = computeForecast();
  showToast('План готов', forecast.maxTotal
    ? 'Стартовый ориентир — ' + forecast.lowTotal + '–' + forecast.highTotal + ' баллов. Первый шаг уже на обзоре.'
    : 'Ближайшее занятие уже на обзоре. Первый шаг — самый важный.', 'success');
  if (previousPlan && previousPlan.sessions?.length) {
    showToast('Профиль обновлён', 'Старые отметки сохранены, новые темы добавлены в маршрут.', 'info');
  }
  render();
}

function prepareAuthenticatedView() {
  if (!state.onboarded || !state.profile || !(state.profile.subjects || []).length) {
    view = 'onboarding';
    obStep = 0;
    obDraft = buildOnboardingDraft();
    editingProfile = false;
    return;
  }
  view = 'dashboard';
  trainerSubject = profileSubjects()[0] || null;
  if (planIsStale(state.plan)) {
    state.plan = generatePlan(state.profile);
    saveState();
  }
  maybeAutoRebalance();
  if (state.progress.rebalance?.pendingReason) modal = { type: 'rebalance' };
  recordForecastSnapshot();
  planWeekStart = startOfWeek(new Date());
  selectedPlanDate = toISO(new Date());
}

function startUserSession(user, options) {
  currentUser = user;
  activeStorageKey = accountStateKey(user.id);
  state = options?.importedState || loadState(activeStorageKey) || defaultState();
  if (options?.importedState) saveState();
  if (state.onboarded && addUpcomingEssayTrack()) saveState();
  selectedSubject = null;
  trainer = null;
  trainerSubject = null;
  mistakeFilter = 'all';
  settingsDraft = null;
  modal = null;
  obDraft = null;
  obStep = 0;
  obDiagQuiz = null;
  groupJoinCode = '';
  groupNameDraft = '';
  pendingImport = null;
  pendingImportName = '';
  editingProfile = false;
  authBusy = false;
  authError = '';
  authDraft = { name: '', email: user.email, password: '', confirm: '' };
  prepareAuthenticatedView();
  render();
  startReminders();
  if (options?.toast) showToast(options.toast.title, options.toast.text, options.toast.type || 'success');
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function logoutAccount() {
  if (!currentUser) return;
  const email = currentUser.email;
  saveState();
  clearSession();
  currentUser = null;
  activeStorageKey = STORAGE_KEY;
  state = defaultState();
  view = 'dashboard';
  obDraft = null;
  obStep = 0;
  obDiagQuiz = null;
  groupJoinCode = '';
  groupNameDraft = '';
  pendingImport = null;
  pendingImportName = '';
  selectedSubject = null;
  trainer = null;
  trainerSubject = null;

function startReminders() {
  if (remindersStarted) return;

    if (currentUser) checkReminders();
  }, 60000);
}

  if (authBusy) return;

  const password = String(authDraft.password || '');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    authError = 'Введите корректный email.';
    render();
    return;
  }
  if (authMode === 'register') {
    const name = String(authDraft.name || '').trim();
    if (name.length < 2) {
      authError = 'Имя должно содержать хотя бы 2 символа.';
      render();
      return;
    }
    if (password.length < 8) {
      authError = 'Пароль должен содержать минимум 8 символов.';
      render();
      return;
    }
    if (password !== String(authDraft.confirm || '')) {
      authError = 'Пароли не совпадают.';
      render();
      return;
    }
  }
  authBusy = true;
  render();
  try {
    if (authMode === 'login') {
      const user = findAccountByEmail(email);
      if (!user) throw new Error('Неверный email или пароль.');
      const valid = await verifyAccountPassword(user, password);
      if (!valid) throw new Error('Неверный email или пароль.');
      touchAccount(user.id);
      saveSession(user.id);
      startUserSession(user, {
        toast: { title: 'С возвращением', text: 'План и прогресс восстановлены.', type: 'success' }
      });
      return;
    }
    const accountsBefore = readAccounts().users.length;
    const legacy = accountsBefore === 0 ? readLegacyState() : null;
    const user = await createAccount(authDraft.name, email, password);
    saveSession(user.id);
    startUserSession(user, {
      importedState: legacy,
      toast: legacy
        ? { title: 'Аккаунт создан', text: 'Текущий прогресс перенесён в новый профиль.', type: 'success' }
        : { title: 'Аккаунт создан', text: 'Соберём первый план подготовки.', type: 'success' }
    });
    if (legacy) localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    authBusy = false;
    authError = error?.message || 'Не удалось выполнить вход. Попробуйте ещё раз.';
    render();
  }
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (!currentUser) {
    app.innerHTML = renderAuth();
    document.body.classList.remove('modal-open');
    document.title = 'Вход — Фокус';
    return;
  }
  if (!state.onboarded || !state.profile || view === 'onboarding') {
    if (!obDraft) obDraft = buildOnboardingDraft();
    app.innerHTML = renderOnboarding();
    document.title = editingProfile ? 'Профиль — Фокус' : 'Знакомство — Фокус';
    document.body.classList.remove('modal-open');
    return;
  }
  const autoRebalance = maybeAutoRebalance();
  if ((autoRebalance?.pendingReason || state.progress.rebalance?.pendingReason) && !modal) {
    modal = { type: 'rebalance' };
  }
  const newlyUnlocked = evaluateAchievements();
  if (newlyUnlocked.length) {
    newlyUnlocked.forEach(item => freshAchievements.add(item.id));
    queueCelebration(newlyUnlocked.map(item => ({ id: item.id, title: item.title, desc: item.desc, icon: item.icon })));
  }
  recordForecastSnapshot();
  let content = '';
  if (view === 'plan') content = renderPlan();
  else if (view === 'subjects') content = renderSubjects();
  else if (view === 'trainer') content = renderTrainer();
  else if (view === 'mistakes') content = renderMistakes();
  else if (view === 'progress') content = renderProgress();
  else if (view === 'achievements') content = renderAchievements();
  else if (view === 'group') content = renderGroup();
  else if (view === 'fipi') content = renderFipi();
  else if (view === 'settings') content = renderSettings();
  else content = renderDashboard();
  app.innerHTML = renderShell(content) + renderModalRoot() + renderCelebrationRoot();
  document.body.classList.toggle('modal-open', Boolean(modal) || Boolean(celebrationCurrent));
  document.title = 'Фокус ЕГЭ · ' + pageTitle();
  startCelebrationTimer();
}

function openModal(type, payload) {
  modal = { type, ...(payload || {}) };
  render();
}

function closeModal() {
  stopBreathing(false);
  if (modal?.type === 'target') {
    targetDraftSubject = null;
    targetDraftValue = 80;
  }
  if (modal?.type === 'rebalance' && state.progress?.rebalance?.pendingReason) {
    state.progress.rebalance.pendingReason = false;
    state.progress.rebalance.dismissedAt = new Date().toISOString();
    saveState();
  }
  if (modal?.type === 'import') {
    pendingImport = null;
    pendingImportName = '';
  }
  modal = null;
  document.body.classList.remove('modal-open');

}

function showToast(title, text, type) {
  let root = document.querySelector('.toast-root');
  if (!root) {
    root = document.createElement('div');
    root.className = 'toast-root';
    root.setAttribute('aria-live', 'polite');
    document.body.appendChild(root);
  }
  const tone = type === 'warn' ? 'warn' : type === 'error' ? 'error' : '';
  const toast = document.createElement('div');
  toast.className = 'toast ' + tone;
  const iconName = type === 'warn' || type === 'error' ? 'alert' : type === 'info' ? 'info' : 'checkCircle';
  toast.innerHTML = '<span class="toast-ico">' + icon(iconName) + '</span><div style="flex:1;min-width:0"><b>' + escapeHTML(title) + '</b><small>' + escapeHTML(text || '') + '</small></div><button class="toast-close" data-toast-close aria-label="Закрыть">' + icon('x') + '</button>';
  while (root.children.length >= 3) root.firstElementChild.remove();
  root.appendChild(toast);
  const remove = () => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(6px)';
    toast.style.transition = 'opacity .2s, transform .2s';
    setTimeout(() => toast.remove(), 210);
  };
  setTimeout(remove, 5600);
}

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function dateTimeFromISO(dateISO, time) {
  const date = parseISO(dateISO);
  const [hours, minutes] = String(time || '00:00').split(':').map(Number);
  date.setHours(hours || 0, minutes || 0, 0, 0);
  return date;
}

function updateTimerDisplays() {
  const minutes = Math.floor(timerState.remaining / 60);
  const seconds = timerState.remaining % 60;
  document.querySelectorAll('[data-timer-display]').forEach(element => {
    element.textContent = pad(minutes) + ':' + pad(seconds);
  });
}

function tickTimer() {
  timerState.remaining = Math.max(0, timerState.remaining - 1);
  updateTimerDisplays();
  if (timerState.remaining <= 0) {
    clearInterval(timerState.interval);
    timerState.running = false;
    timerState.remaining = timerState.preset * 60;
    addActivity(timerState.preset);
    saveState();
    showToast('Фокус-сессия завершена', '25 минут без телефона — это уже шаг. Сделайте короткий перерыв.', 'success');
    render();
  }
}

function toggleTimer() {
  if (timerState.running) {
    clearInterval(timerState.interval);
    timerState.running = false;
    render();
    return;
  }
  if (timerState.remaining <= 0) timerState.remaining = timerState.preset * 60;
  timerState.running = true;
  timerState.interval = setInterval(tickTimer, 1000);
  render();
}

function checkReminders() {
  if (!currentUser) return;
  if (!state.onboarded || !state.settings.notify || !state.plan) return;
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const now = new Date();
  const today = toISO(now);
  (state.plan.sessions || [])
    .filter(session => session.date === today && !sessionIsDone(session.id))
    .forEach(session => {
      if (state.progress.remindersSent[session.id]) return;
      const start = dateTimeFromISO(session.date, session.start);
      const diff = (start - now) / 60000;
      if (diff > 10 || diff < -2) return;
      const title = session.topicId ? TOPIC_BY_ID[session.topicId]?.title || session.title : session.title;
      try {
        new Notification('Скоро занятие · ' + SUBJECTS[session.subject].short, {
          body: session.start + ' — ' + title + '. ' + session.duration + ' минут фокуса.',
          tag: 'fokus-' + session.id
        });
      } catch (error) {
        showToast('Напоминание', session.start + ' — ' + title, 'info');
      }
      state.progress.remindersSent[session.id] = new Date().toISOString();
      saveState();
    });
}

function icsEscape(value) {
  return String(value || '')
    .replace(/\\/g, '\\\\')
    .replace(/\n/g, '\\n')
    .replace(/,/g, '\\,')
    .replace(/;/g, '\\;');
}

function icsDateTime(dateISO, time) {
  const date = parseISO(dateISO);
  const [hours, minutes] = String(time || '00:00').split(':').map(Number);
  return String(date.getFullYear()) + pad(date.getMonth() + 1) + pad(date.getDate()) + 'T' + pad(hours) + pad(minutes) + '00';
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportICS() {
  if (!state.plan || !state.plan.sessions) {
    showToast('Нет плана', 'Сначала соберите план подготовки.', 'warn');
    return;
  }
  const today = toISO(new Date());
  const sessions = state.plan.sessions.filter(session => session.date >= today);
  if (!sessions.length) {
    showToast('Нет будущих занятий', 'В плане не осталось занятий для экспорта.', 'warn');
    return;
  }
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Fokus EGE//Preparation Plan//RU',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH'
  ];
  sessions.forEach(session => {
    const topic = session.topicId ? TOPIC_BY_ID[session.topicId] : null;
    const title = topic ? topic.title : session.title;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + session.id + '@fokus-ege.local');
    lines.push('DTSTAMP:' + stamp);
    lines.push('DTSTART:' + icsDateTime(session.date, session.start));
    lines.push('DTEND:' + icsDateTime(session.date, session.end));
    lines.push('SUMMARY:' + icsEscape('Фокус ЕГЭ · ' + SUBJECTS[session.subject].short + ': ' + title));
    lines.push('DESCRIPTION:' + icsEscape((SESSION_LABELS[session.type] || session.type) + ' · ' + session.duration + ' мин. План подготовки «Фокус».'));
    lines.push('BEGIN:VALARM');
    lines.push('TRIGGER:-PT10M');
    lines.push('ACTION:DISPLAY');
    lines.push('DESCRIPTION:' + icsEscape('Скоро занятие: ' + title));
    lines.push('END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  downloadFile('fokus-ege-plan.ics', lines.join('\r\n') + '\r\n', 'text/calendar;charset=utf-8');
  showToast('Календарь готов', 'Файл .ics можно открыть в Google Календаре, Apple Календаре или Outlook.', 'success');
}

function exportJSON() {
  downloadFile('fokus-ege-backup-' + toISO(new Date()) + '.json', JSON.stringify(state, null, 2), 'application/json;charset=utf-8');
  showToast('Резервная копия сохранена', 'JSON-файл лежит в загрузках.', 'success');
}

async function handleImportFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== 'object' || !parsed.progress || typeof parsed.progress !== 'object') {
      throw new Error('В файле нет данных прогресса.');
    }
    pendingImport = normalizeState(parsed);
    pendingImportName = file.name || 'fokus-backup.json';
    modal = { type: 'import' };
    render();
  } catch (error) {
    pendingImport = null;
    pendingImportName = '';
    showToast('Не удалось прочитать файл', error?.message || 'Проверьте, что это JSON-резервная копия «Фокуса».', 'error');
  }
}

function applyReplan() {
