/* === Focus 2.0: forecast, daily question, achievements, groups, FIPI === */
.hero-forecast{max-width:290px;padding:16px 17px}
.forecast-range{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.forecast-range b{font-size:33px;line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.forecast-range span{font-size:10px;color:rgba(255,255,255,.55);font-weight:700}
.forecast-trend{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;padding:3px 7px;border-radius:7px;background:rgba(158,240,198,.13);color:#9ef0c6;white-space:nowrap}
.forecast-trend svg{width:11px;height:11px;stroke-width:2.1}
.forecast-trend.down{background:rgba(255,180,170,.12);color:#ffc0b8}
.forecast-trend.flat{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.forecast-avg{font-size:9.5px;color:rgba(255,255,255,.58);margin-top:6px;line-height:1.45}
.forecast-meter{height:6px;border-radius:8px;background:rgba(255,255,255,.13);overflow:hidden;margin-top:11px}
.forecast-meter span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#9ef0c6,#68d6ff);transition:width .6s}
.forecast-note{font-size:8.5px;color:rgba(255,255,255,.43);line-height:1.45;margin-top:8px}
.hero-phrase{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:10px;line-height:1.45;color:rgba(255,255,255,.68)}
.hero-phrase svg{width:13px;height:13px;color:#ffd38a;flex:none}
.motivation-grid{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(290px,.62fr);gap:16px;margin-top:16px}
.daily-card{position:relative;overflow:hidden}
.daily-card:before{content:"";position:absolute;right:-70px;top:-90px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(81,70,229,.1),transparent 68%);pointer-events:none}
.daily-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.daily-question{font-size:16px;line-height:1.42;letter-spacing:-.025em;font-weight:750;margin:15px 0 13px;max-width:760px}
.daily-options{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.daily-option{display:flex;align-items:center;gap:9px;text-align:left;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:11px;line-height:1.35;font-weight:650;transition:.14s}
.daily-option:hover{border-color:#cfcaf6;background:var(--surface-2)}
.daily-option.selected{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 2px rgba(81,70,229,.07)}
.daily-option.correct{border-color:var(--mint);background:var(--mint-soft);color:#087443}
.daily-option.wrong{border-color:var(--red);background:var(--red-soft);color:#b42318}
.daily-option.disabled{pointer-events:none}
.daily-option .option-letter{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);font-size:9.5px;font-weight:800;flex:none;color:var(--muted)}
.daily-option.selected .option-letter{background:var(--brand);color:#fff}
.daily-option.correct .option-letter{background:var(--mint);color:#fff}
.daily-option.wrong .option-letter{background:var(--red);color:#fff}
.daily-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px}
.daily-source{font-size:9px;color:var(--muted);line-height:1.4}
.daily-source a{color:var(--brand);font-weight:750;display:inline-flex;align-items:center;gap:3px}
.daily-source a svg{width:11px;height:11px}
.daily-explanation{margin-top:12px;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:10.5px;line-height:1.55;color:var(--ink-2)}
.daily-explanation.good{border-color:#bdf0d7;background:var(--mint-soft)}
.daily-explanation.bad{border-color:#ffd4d0;background:var(--red-soft)}
.daily-explanation b{display:flex;align-items:center;gap:6px;font-size:10.5px;margin-bottom:4px}
.daily-explanation b svg{width:14px;height:14px}
.daily-explanation.good b{color:#087443}
.daily-explanation.bad b{color:#b42318}
.ach-teaser-list{display:flex;flex-direction:column;gap:8px;margin-top:13px}

.ach-teaser-ico svg{width:15px;height:15px}
.ach-teaser-item b{display:block;font-size:10px;line-height:1.25}
.ach-teaser-item small{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}
.ach-teaser-progress{height:4px;border-radius:5px;background:#e8ebf4;overflow:hidden;margin-top:5px}
.ach-teaser-progress span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#8d84ee,#5146e5)}
.ach-teaser-meta{margin-left:auto;font-size:9px;font-weight:800;color:var(--muted);white-space:nowrap}
.ach-teaser .section-link{margin-top:13px;width:100%;justify-content:center}
.encourage-line{display:flex;gap:8px;align-items:flex-start;font-size:10.5px;line-height:1.5;color:var(--muted);margin-top:12px}
.encourage-line svg{width:14px;height:14px;color:var(--orange);margin-top:1px;flex:none}
.forecast-detail{padding:20px 22px}
.forecast-detail-top{display:flex;align-items:flex-start;gap:22px;margin-top:4px;flex-wrap:wrap}
.forecast-big{display:flex;flex-direction:column;min-width:170px}
.forecast-big b{font-size:36px;line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.forecast-big small{font-size:9.5px;color:var(--muted);margin-top:6px}

.forecast-big .forecast-trend.flat{background:var(--surface-2);color:var(--muted)}
.forecast-spark{display:flex;align-items:flex-end;gap:4px;height:66px;flex:1;min-width:150px;max-width:290px;padding:6px 0}
.forecast-spark-bar{flex:1;min-width:8px;border-radius:5px 5px 2px 2px;background:#e7e5fb;position:relative;min-height:4px}
.forecast-spark-bar.on{background:linear-gradient(180deg,#8d84ee,#5146e5)}
.forecast-spark-bar.today{background:linear-gradient(180deg,#34d399,#12b76a)}
.forecast-spark-labels{display:flex;justify-content:space-between;font-size:8px;color:var(--muted-2);margin-top:4px;max-width:290px}
.subject-forecast-list{display:flex;flex-direction:column;gap:10px;margin-top:17px;border-top:1px solid var(--line-2);padding-top:15px}

.subject-forecast-name{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:750;min-width:0}
.subject-forecast-name .legend-dot{width:7px;height:7px}
.subject-forecast-score{font-size:10.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.subject-forecast-score small{font-weight:650;color:var(--muted);font-size:9px}
.subject-forecast-track{height:6px;border-radius:7px;background:#eef0f7;overflow:hidden}
.subject-forecast-track span{display:block;height:100%;border-radius:7px;background:var(--subj-color,var(--brand));transition:width .5s}
.forecast-foot-note{font-size:9px;color:var(--muted);line-height:1.5;margin-top:14px;padding-top:11px;border-top:1px solid var(--line-2)}
.ach-hero{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;background:linear-gradient(135deg,#f7f5ff,#fff 62%);overflow:hidden;position:relative}
.ach-hero:before{content:"";position:absolute;right:-50px;top:-80px;width:230px;height:230px;border-radius:50%;border:1px solid rgba(81,70,229,.08)}
.ach-hero-main{display:flex;align-items:center;gap:17px;min-width:240px}

.ach-hero-ring span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:18px;font-weight:800;line-height:1}

.ach-tree:before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:2px;border-radius:3px;background:linear-gradient(180deg,#cfc9ff,#12b76a)}
.ach-branch{position:relative;margin-bottom:10px}
.ach-branch:before{content:"";position:absolute;left:-18px;top:29px;width:14px;height:2px;background:#d7d2ff}

.ach-subject-topics-head span{margin-left:auto;font-size:9px;color:var(--muted);font-weight:700}

.strategy-note svg{width:13px;height:13px;color:var(--brand);margin-top:1px;flex:none}
.milestone-list{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.milestone{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2)}
.milestone-date{text-align:center;padding-right:9px;border-right:1px solid var(--line)}
.milestone-date b{display:block;font-size:17px;line-height:1;letter-spacing:-.04em}
.milestone-date small{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.milestone-body b{display:block;font-size:10.5px;line-height:1.3}
.milestone-body small{display:block;font-size:9px;color:var(--muted);line-height:1.45;margin-top:2px}
.milestone-status{font-size:8px;font-weight:800;padding:4px 6px;border-radius:6px;white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.milestone.done .milestone-status{background:var(--mint-soft);border-color:#c9f2df;color:#087443}
.milestone.overdue .milestone-status{background:var(--red-soft);border-color:#ffd3cf;color:#b42318}
.milestone.soon .milestone-status{background:var(--orange-soft);border-color:#ffe4c0;color:#9a4a06}
.milestone.review .milestone-status{background:var(--brand-soft);border-color:#dedaff;color:var(--brand)}
.milestone .milestone-progress{height:3px;border-radius:4px;background:#e9ecf5;overflow:hidden;margin-top:5px}
.milestone .milestone-progress span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#8a80f5,#5146e5)}
.milestone-details{margin-top:8px}
.milestone-details summary{cursor:pointer;font-size:9px;color:var(--brand);font-weight:750;list-style:none}
.milestone-details summary::-webkit-details-marker{display:none}
.milestone-topics{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.milestone-topics span{font-size:8.5px;line-height:1.35;padding:4px 6px;border-radius:5px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}
.milestone-topics span.done{background:var(--mint-soft);border-color:#c9f2df;color:#087443}
.root-cause{padding:14px;border-radius:14px;border:1px solid #ffe4c0;background:linear-gradient(135deg,#fffaf2,#fff);margin-bottom:18px}
.root-cause.ok{border-color:#c9f2df;background:linear-gradient(135deg,#f4fdf8,#fff)}
.root-cause-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:6px}
.root-cause-head svg{width:16px;height:16px;color:var(--orange)}
.root-cause.ok .root-cause-head svg{color:var(--mint)}
.root-cause p{font-size:10.5px;line-height:1.6;color:var(--ink-2)}
.root-chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:10px}
.root-node{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:750;padding:5px 7px;border-radius:7px;background:var(--surface);border:1px solid var(--line);color:var(--muted);max-width:100%}
.root-node svg{width:12px;height:12px;flex:none}
.critical-chips .root-node{font-size:10px;line-height:1.35;padding:6px 8px}
.critical-chips .root-node svg{width:13px;height:13px}
.root-node.weak{border-color:#ffd3cf;background:var(--red-soft);color:#b42318}
.root-node.root{border-color:#ffcf99;background:var(--orange-soft);color:#9a4a06;box-shadow:0 0 0 2px rgba(247,144,9,.08)}
.root-node.done{border-color:#c9f2df;background:var(--mint-soft);color:#087443}
.root-arrow{color:var(--muted-2);font-size:9px}
.dependency-map{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.dep-node{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line-2);font-size:10px;line-height:1.35}
.dep-node .dep-dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2);flex:none}
.dep-node.done .dep-dot{background:var(--mint)}
.dep-node.weak{border-color:#ffd3cf;background:#fff8f7}
.dep-node.weak .dep-dot{background:var(--red)}
.dep-node .dep-meta{margin-left:auto;font-size:8.5px;color:var(--muted);white-space:nowrap}
.dep-node .dep-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep-node .dep-indent{color:var(--muted-2);font-size:9px;width:14px;text-align:right;flex:none}
.topic-mistakes{margin-top:8px}
.topic-mistakes summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:750;color:var(--orange)}
.topic-mistakes summary::-webkit-details-marker{display:none}
.topic-mistakes summary:after{content:"+";font-size:12px;line-height:1}
.topic-mistakes[open] summary:after{content:"−"}
.topic-mistakes ol{margin:8px 0 0;padding-left:17px;display:flex;flex-direction:column;gap:4px}
.topic-mistakes li{font-size:9.5px;line-height:1.5;color:var(--ink-2)}
.mistake-five{list-style:none;counter-reset:mistake;display:flex;flex-direction:column;gap:7px}
.mistake-five li{counter-increment:mistake;display:flex;gap:9px;font-size:10.5px;line-height:1.55;color:var(--ink-2)}
.mistake-five li:before{content:counter(mistake);width:19px;height:19px;border-radius:6px;background:var(--orange-soft);color:#9a4a06;font-size:8.5px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.pse-card{position:relative;overflow:hidden}
.pse-card:before{content:"";position:absolute;right:-100px;top:-120px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(81,70,229,.09),transparent 67%);pointer-events:none}
.pse-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.pse-top h3{font-size:15px}
.pse-top p{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.pse-summary{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pse-summary span{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line-2);font-size:9px;font-weight:750;color:var(--muted)}
.pse-summary .g{color:#087443;background:var(--mint-soft);border-color:#c9f2df}
.pse-summary .y{color:#9a4a06;background:var(--orange-soft);border-color:#ffe4c0}
.pse-summary .r{color:#b42318;background:var(--red-soft);border-color:#ffd3cf}
.pse-strip{display:flex;gap:5px;overflow-x:auto;padding:14px 2px 8px;scrollbar-width:thin;position:relative;z-index:1}
.pse-task{width:31px;min-width:31px;height:43px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid transparent;transition:.14s;position:relative}
.pse-task:hover{transform:translateY(-2px);box-shadow:0 7px 14px rgba(31,36,68,.12)}
.pse-task b{font-size:11px;line-height:1;font-variant-numeric:tabular-nums}
.pse-task small{font-size:6.5px;font-weight:800;opacity:.72;line-height:1}
.pse-task.green{background:#e6f8ef;border-color:#b6ecd2;color:#087443}
.pse-task.yellow{background:#fff5e3;border-color:#ffe0ac;color:#9a4a06}
.pse-task.red{background:#feeceb;border-color:#ffd0cc;color:#b42318}
.pse-task.current{box-shadow:0 0 0 2px var(--brand);border-color:var(--brand)}
.pse-legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:3px;font-size:8.5px;color:var(--muted)}
.pse-legend span{display:inline-flex;align-items:center;gap:5px}
.pse-legend i{width:8px;height:8px;border-radius:3px;display:block}
.pse-legend .g{background:#12b76a}.pse-legend .y{background:#f79009}.pse-legend .r{background:#f04438}
.pse-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
.pse-foot small{font-size:8.5px;color:var(--muted);line-height:1.45}
.pse-task-hero{display:flex;align-items:center;gap:14px;padding:17px 18px;border-radius:15px;border:1px solid var(--line)}
.pse-task-hero.green{background:linear-gradient(135deg,#effbf5,#fff);border-color:#c9f2df}
.pse-task-hero.yellow{background:linear-gradient(135deg,#fff9ee,#fff);border-color:#ffe4c0}
.pse-task-hero.red{background:linear-gradient(135deg,#fff5f4,#fff);border-color:#ffd3cf}
.pse-task-hero .pse-big-num{width:49px;height:49px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:800;letter-spacing:-.05em;flex:none}
.pse-task-hero b{display:block;font-size:13px}
.pse-task-hero small{display:block;font-size:9.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.pse-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.pse-detail-box{padding:12px 13px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2)}
.pse-detail-box h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.pse-topic-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.pse-topic-row:last-child{border-bottom:0}
.pse-topic-row .pse-topic-name{min-width:0;flex:1}
.pse-topic-row b{display:block;font-size:10px;line-height:1.3}
.pse-topic-row small{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}
.pse-mini-track{width:50px;height:4px;border-radius:4px;background:#e8ebf4;overflow:hidden;flex:none}
.pse-mini-track span{display:block;height:100%;border-radius:4px;background:var(--brand)}
.mind-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.mind-card{position:relative;overflow:hidden}
.mind-card.pad{padding:22px}
.mood-options{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.mood-option{width:47px;height:53px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.15s}
.mood-option span{font-size:20px;line-height:1}
.mood-option small{font-size:7.5px;color:var(--muted);font-weight:700}
.mood-option:hover{border-color:#cfcaf7;background:var(--brand-soft-2);transform:translateY(-1px)}
.mood-option.active{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 2px rgba(81,70,229,.08)}
.mood-today{margin-top:12px;padding:9px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line-2);font-size:9.5px;color:var(--muted);line-height:1.5}
.mood-today b{color:var(--ink)}
.mood-insight{margin-top:12px;padding:11px 12px;border-radius:11px;background:linear-gradient(135deg,#f5f3ff,#fbfaff);border:1px solid #e7e3ff;font-size:10px;line-height:1.6;color:var(--ink-2)}
.mood-insight b{color:var(--brand)}
.mood-heatmap{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr));gap:4px;margin-top:13px}
.mood-heatmap .mh-head{font-size:7.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding-bottom:2px}
.mood-heatmap .mh-day{font-size:8px;font-weight:750;color:var(--muted);display:flex;align-items:center}
.mood-heat-cell{height:18px;border-radius:4px;background:#eef0f7;border:1px solid transparent;display:grid;place-items:center;font-size:7px;font-weight:800;color:transparent}
.mood-heat-cell[data-level="1"]{background:#fee2df;color:#b42318}
.mood-heat-cell[data-level="2"]{background:#ffead1;color:#9a4a06}
.mood-heat-cell[data-level="3"]{background:#fff7dc;color:#8a6500}
.mood-heat-cell[data-level="4"]{background:#dcf7e9;color:#087443}
.mood-heat-cell[data-level="5"]{background:#bff0d8;color:#065f3b}
.mood-heat-cell.empty{background:var(--surface-2);color:transparent}
.reflection-input{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:11px 12px;font-size:11px;line-height:1.55;margin-top:11px}
.reflection-input:focus{outline:none;border-color:#8b83ee;box-shadow:0 0 0 4px rgba(81,70,229,.08)}
.reflection-row{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.reflection-row .select-input{height:34px;font-size:10px;border-radius:9px;flex:1;min-width:150px}
.reflection-actions{display:flex;gap:6px;margin-left:auto}
.reflection-quote{position:relative;padding:12px 14px 12px 34px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);font-size:10.5px;line-height:1.6;color:var(--ink-2);margin-top:11px}
.reflection-quote:before{content:"“";position:absolute;left:11px;top:4px;font-size:31px;line-height:1;color:var(--brand);font-family:Georgia,serif;opacity:.55}
.reflection-quote b{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.past-self{margin-top:11px;padding:12px 13px;border-radius:12px;background:linear-gradient(135deg,#102f29,#0d4b41);color:#fff;position:relative;overflow:hidden}
.past-self:before{content:"";position:absolute;right:-40px;top:-70px;width:160px;height:160px;border-radius:50%;border:1px solid rgba(255,255,255,.16)}
.past-self small{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:rgba(255,255,255,.55);margin-bottom:5px;position:relative;z-index:1}
.past-self b{display:block;font-size:11px;line-height:1.5;font-weight:700;position:relative;z-index:1}
.past-self p{font-size:9.5px;line-height:1.55;color:rgba(255,255,255,.62);margin-top:5px;position:relative;z-index:1}
.psych-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.anxiety-card{text-align:left;padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);transition:.15s}
.anxiety-card:hover{transform:translateY(-2px);border-color:#cfcaf7;box-shadow:0 10px 24px rgba(31,36,68,.06)}
.anxiety-card .anxiety-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin-bottom:9px}
.anxiety-card .anxiety-ico svg{width:17px;height:17px}
.anxiety-card b{display:block;font-size:10.5px;line-height:1.35}
.anxiety-card small{display:block;font-size:9px;color:var(--muted);line-height:1.5;margin-top:4px}
.anxiety-card .anxiety-done{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:8px;font-weight:800;color:#087443}
.anxiety-card .anxiety-done svg{width:11px;height:11px}
.breath-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:250px;padding:22px;border-radius:18px;background:radial-gradient(circle at 50% 35%,#37317d,#17133b 72%);color:#fff;position:relative;overflow:hidden}
.breath-stage:before,.breath-stage:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.1);pointer-events:none}
.breath-stage:before{width:330px;height:330px;left:50%;top:50%;transform:translate(-50%,-50%)}
.breath-stage:after{width:250px;height:250px;left:50%;top:50%;transform:translate(-50%,-50%);border-color:rgba(255,255,255,.15)}
.breath-orb{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8b1ff,#6b60ff 58%,#463bd2);box-shadow:0 0 55px rgba(122,112,255,.55),inset 0 0 26px rgba(255,255,255,.24);display:grid;place-items:center;text-align:center;transition:transform 4s ease-in-out,box-shadow .4s;position:relative;z-index:1}
.breath-orb[data-phase="in"]{transform:scale(1.28)}
.breath-orb[data-phase="hold"]{transform:scale(1.28);box-shadow:0 0 70px rgba(158,240,198,.5),inset 0 0 26px rgba(255,255,255,.24)}
.breath-orb[data-phase="out"]{transform:scale(.9)}
.breath-orb[data-phase="rest"]{transform:scale(.9);opacity:.72}
.breath-orb b{display:block;font-size:17px;line-height:1.1}
.breath-orb small{display:block;font-size:9px;color:rgba(255,255,255,.65);margin-top:3px}
.breath-caption{margin-top:15px;font-size:9.5px;color:rgba(255,255,255,.55);text-align:center;line-height:1.5;position:relative;z-index:1;max-width:320px}
.breath-meta{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:9px;color:rgba(255,255,255,.55);position:relative;z-index:1}
.breath-meta b{color:#fff}
.anxiety-steps{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.anxiety-step{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;font-size:10px;line-height:1.5;color:var(--ink-2)}
.anxiety-step .step-num{width:19px;height:19px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:8.5px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.anxiety-step.done{border-color:#c9f2df;background:var(--mint-soft)}
.anxiety-step.done .step-num{background:var(--mint);color:#fff}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap}
.quick-action{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:10px;font-weight:750;color:var(--ink-2);transition:.15s}
.quick-action:hover{border-color:#cfcaf7;background:var(--brand-soft-2);transform:translateY(-1px)}
.quick-action .qa-ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.quick-action .qa-ico svg{width:12px;height:12px}
.lastweek-banner{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;border:1px solid #ffe0ac;background:linear-gradient(135deg,#fff8eb,#fff);margin-bottom:14px;flex-wrap:wrap}
.lastweek-banner .lw-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--orange-soft);color:#9a4a06;flex:none}
.lastweek-banner .lw-ico svg{width:18px;height:18px}
.lastweek-banner b{display:block;font-size:11px}
.lastweek-banner small{display:block;font-size:9.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.lastweek-banner .btn{margin-left:auto}
.micro-strip{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.micro-chip{display:inline-flex;align-items:center;gap:5px;height:31px;padding:0 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:9.5px;font-weight:750;color:var(--muted);transition:.15s}
.micro-chip:hover{border-color:#cfcaf7;color:var(--brand);background:var(--brand-soft-2)}
.micro-chip b{color:var(--ink);font-size:10.5px}
.surprise-clock{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;background:#1b173f;color:#fff;margin-bottom:12px}
.surprise-clock .sc-ico{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#ffd38a;flex:none}
.surprise-clock .sc-ico svg{width:13px;height:13px}
.surprise-clock b{font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.surprise-clock small{font-size:8.5px;color:rgba(255,255,255,.55);margin-left:auto;line-height:1.4;text-align:right}
.surprise-clock.urgent{background:#4a1720}
.surprise-clock.urgent .sc-ico{color:#ffb4ac}
.surprise-clock .sc-bar{width:100%;height:3px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden;position:absolute;left:0;bottom:0}
.schedule-form{display:grid;grid-template-columns:180px 1fr;gap:10px;margin-top:12px}
.schedule-form .full{grid-column:1/-1}
.schedule-textarea{width:100%;min-height:98px;resize:vertical;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:11px 12px;font-size:10px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.schedule-textarea:focus{outline:none;border-color:#8b83ee;box-shadow:0 0 0 4px rgba(81,70,229,.08)}
.schedule-preview{margin-top:12px;border:1px solid var(--line-2);border-radius:11px;overflow:hidden}
.schedule-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--line-2);font-size:9.5px;background:var(--surface)}
.schedule-row:last-child{border-bottom:0}
.schedule-row b{font-size:9.5px;white-space:nowrap}
.schedule-row small{color:var(--muted);margin-left:auto;white-space:nowrap}
.schedule-empty{padding:14px;text-align:center;font-size:10px;color:var(--muted);background:var(--surface-2)}
.schedule-status{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 10px;border-radius:9px;background:var(--mint-soft);border:1px solid #c9f2df;font-size:9.5px;color:#087443;line-height:1.45}
.schedule-status svg{width:13px;height:13px;flex:none}
.schedule-status.warn{background:var(--orange-soft);border-color:#ffe4c0;color:#9a4a06}
.target-modal-hero{padding:18px;border-radius:15px;background:linear-gradient(135deg,#1e1949,#3d31a9 58%,#5b50e8);color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.target-modal-hero:before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;border:1px solid rgba(255,255,255,.15);right:-70px;top:-100px}
.target-modal-hero small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.55);font-weight:800;position:relative;z-index:1}
.target-modal-hero b{display:block;font-size:43px;letter-spacing:-.06em;line-height:1;margin-top:5px;position:relative;z-index:1}
.target-modal-hero p{font-size:10px;color:rgba(255,255,255,.6);margin-top:5px;line-height:1.5;position:relative;z-index:1}
.target-range-wrap{display:flex;align-items:center;gap:12px;margin-top:15px}
.target-range-wrap input[type="range"]{flex:1;accent-color:var(--brand)}
.target-range-bubble{min-width:64px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-size:15px;font-weight:800;display:grid;place-items:center}
.target-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.target-modal-cell{padding:11px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.target-modal-cell small{display:block;font-size:8.5px;color:var(--muted)}
.target-modal-cell b{display:block;font-size:12px;margin-top:3px}
.celebration-root{position:fixed;inset:0;z-index:420;display:grid;place-items:center;padding:22px;background:rgba(12,10,32,.58);backdrop-filter:blur(9px);animation:fadeIn .22s ease both}
.celebration-card{position:relative;z-index:2;width:100%;max-width:430px;border-radius:26px;padding:30px 28px 24px;text-align:center;color:#fff;overflow:hidden;background:radial-gradient(circle at 50% 0%,#5d50de 0%,#2a216c 45%,#151132 100%);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 100px rgba(36,26,120,.55),0 0 80px rgba(122,112,255,.35);animation:celebrationIn .55s cubic-bezier(.2,1.2,.3,1) both}
.celebration-card:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;border:1px solid rgba(255,255,255,.11);left:50%;top:-210px;transform:translateX(-50%)}
.celebration-card:after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.09),transparent 30%);animation:celebrationSweep 4s linear infinite;pointer-events:none}
.celebration-badge{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;color:#ffe9a8;background:radial-gradient(circle at 35% 28%,#fff6c9,#ffb84d 48%,#e77b00);box-shadow:0 0 0 9px rgba(255,211,138,.1),0 0 55px rgba(255,183,77,.55);animation:celebrationPulse 1.8s ease-in-out infinite;position:relative;z-index:1}
.celebration-badge svg{width:38px;height:38px;stroke-width:1.7}
.celebration-card .cel-eyebrow{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#cfc9ff;position:relative;z-index:1}
.celebration-card h2{font-size:26px;line-height:1.08;letter-spacing:-.04em;margin:8px 0 7px;position:relative;z-index:1}
.celebration-card p{font-size:10.5px;line-height:1.55;color:rgba(255,255,255,.65);max-width:310px;margin:0 auto;position:relative;z-index:1}
.celebration-card .btn{margin-top:18px;background:#fff;color:#352ba8;position:relative;z-index:2}
.celebration-confetti{position:fixed;top:-16px;width:8px;height:14px;border-radius:2px;pointer-events:none;z-index:1;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:1}100%{transform:translate3d(var(--drift,20px),112vh,0) rotate(720deg);opacity:.95}}
@keyframes celebrationIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes celebrationSweep{to{transform:rotate(360deg)}}
@keyframes celebrationPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 9px rgba(255,211,138,.1),0 0 55px rgba(255,183,77,.45)}50%{transform:scale(1.06);box-shadow:0 0 0 13px rgba(255,211,138,.06),0 0 70px rgba(255,183,77,.7)}}
.ach-node.fresh{animation:achFresh 2.2s ease-in-out 2;border-color:#ffd38a!important;box-shadow:0 0 0 4px rgba(255,211,138,.13),0 12px 34px rgba(247,144,9,.18)!important}
@keyframes achFresh{0%,100%{filter:brightness(1)}50%{filter:brightness(1.09)}}
.choice-card:has(input:focus-visible),.btn:focus-visible{outline-offset:3px}
@media(max-width:1100px){
  .strategy-grid{grid-template-columns:1fr}
  .psych-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:900px){
  .mind-grid{grid-template-columns:1fr}
  .pse-detail-grid{grid-template-columns:1fr}
}
@media(max-width:720px){
  .strategy-card.pad{padding:18px}
  .target-main{padding:14px}
  .target-score-line b{font-size:33px}
  .target-stat-row{grid-template-columns:1fr 1fr}
  .psych-grid{grid-template-columns:1fr}
  .milestone{grid-template-columns:44px minmax(0,1fr);gap:8px}
  .milestone-status{grid-column:2;justify-self:start;margin-top:2px}
  .mind-card.pad{padding:18px}
  .pse-task{width:29px;min-width:29px;height:41px}
  .target-modal-grid{grid-template-columns:1fr}
  .schedule-form{grid-template-columns:1fr}
  .celebration-card{padding:26px 20px 21px}
  .celebration-card h2{font-size:23px}
  .lastweek-banner .btn{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  .celebration-confetti{display:none}
  .celebration-card,.celebration-badge,.celebration-card:after,.ach-node.fresh{animation:none!important}
  .breath-orb{transition-duration:.4s!important}
}

  'e-structure': ['Нарушают логику абзацев.', 'Не делят текст на части.', 'Теряют связь между аргументами.', 'Повторяют одну мысль разными словами.', 'Заканчивают без вывода.'],
  'e-language': ['Допускают речевые повторы.', 'Пишут разговорным стилем.', 'Нарушают грамматические нормы.', 'Не проверяют пунктуацию.', 'Не оставляют время на вычитку.']
};

function pad(value) {
  return String(value).padStart(2, '0');
}

function startOfDay(date) {
  const copy = new Date(date);
  copy.setHours(0, 0, 0, 0);
  return copy;
}

function toISO(date) {
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
}

function parseISO(value) {
  if (!value) return startOfDay(new Date());
  const parts = String(value).split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function addDays(date, amount) {
  const copy = new Date(date);
  copy.setDate(copy.getDate() + amount);
  return copy;
}

function addMinutes(date, minutes) {
  const copy = new Date(date);
  copy.setMinutes(copy.getMinutes() + minutes);
  return copy;
}

function daysBetween(a, b) {
  return Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
}

function startOfWeek(date) {
  const copy = startOfDay(date);
  const offset = (copy.getDay() + 6) % 7;
  return addDays(copy, -offset);
}

function dayNumber(date) {
  return date.getDay() === 0 ? 7 : date.getDay();
}

function timeToMinutes(value) {
  const parts = String(value || '00:00').split(':').map(Number);
  return (parts[0] || 0) * 60 + (parts[1] || 0);
}

function minutesToTime(value) {
  const normalized = ((Number(value) % 1440) + 1440) % 1440;
  return pad(Math.floor(normalized / 60)) + ':' + pad(normalized % 60);
}

function formatDate(value, options) {
  const date = typeof value === 'string' ? parseISO(value) : value;
  return new Intl.DateTimeFormat('ru-RU', options || { day: 'numeric', month: 'long' }).format(date);
}

function formatDateShort(value) {
  return formatDate(value, { day: 'numeric', month: 'short' });
}

function formatDateFull(value) {
  return formatDate(value, { day: 'numeric', month: 'long', year: 'numeric' });
}

function formatWeekday(value) {
  const date = typeof value === 'string' ? parseISO(value) : value;
  return WEEKDAYS_FULL[date.getDay()];
}

function pluralize(number, forms) {
  const n = Math.abs(number) % 100;
  const n1 = n % 10;
  if (n > 10 && n < 20) return forms[2];
  if (n1 > 1 && n1 < 5) return forms[1];
  if (n1 === 1) return forms[0];
  return forms[2];
}

function daysLabel(number) {
  return number + ' ' + pluralize(number, ['день', 'дня', 'дней']);
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  }[char]));
}

function capitalize(value) {
  const text = String(value || '');
  return text ? text.charAt(0).toUpperCase() + text.slice(1) : '';
}

function initials(name) {
  const parts = String(name || 'У').trim().split(/\s+/).filter(Boolean);
  return (parts[0]?.[0] || 'У') + (parts[1]?.[0] || '');
}

function resolveExamYear() {
  const today = startOfDay(new Date());
  let year = today.getFullYear();
  const lastExam = new Date(year, 5, 11);
  if (lastExam < today) year += 1;
  return year;
}

function examDatesForYear(year) {
  const dates = {};
  Object.keys(SUBJECTS).forEach(id => {
    const exam = SUBJECTS[id].exam;
    dates[id] = toISO(new Date(year + Number(exam.yearOffset || 0), exam.month - 1, exam.day));
  });
  return dates;
}

function defaultState() {
  return {
    version: 2,
    onboarded: false,
    profile: null,
    plan: null,
    progress: {
      topics: {},
      sessions: {},
      mistakes: {},
      activity: {},
      quizHistory: [],
      remindersSent: {},
      diagnostic: null,
      forecastHistory: {},
      achievements: {},
      dailyQuestion: null,
      dailyQuestions: {},
      rebalance: null,
      reflections: [],
      mood: [],
      anxiety: { completed: {}, lastAt: '', sessions: 0 },
      surprise: { attempts: 0, best: 0, lastAt: '', history: [] },
      schedule: { source: '', importedAt: '', lessons: [] }
    },
    group: null,
    settings: {

      sound: false
    },

      createdAt: new Date().toISOString(),

    }

}

function isPlainRecord(value) {
  return Boolean(value) && typeof value === 'object' && !Array.isArray(value);
}

function asRecord(value) {
  return isPlainRecord(value) ? value : {};
}

function asArray(value) {
  return Array.isArray(value) ? value : [];
}

function asFiniteNumber(value, fallback) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

function asISODate(value) {
  const text = typeof value === 'string' ? value : '';
  return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : '';
}

function normalizeProfile(profile) {
  if (!isPlainRecord(profile)) return null;
  const subjects = [...new Set(asArray(profile.subjects).filter(id => typeof id === 'string' && SUBJECTS[id]))];
  const examDates = {};
  Object.entries(asRecord(profile.examDates)).forEach(([id, date]) => {
    if (SUBJECTS[id] && asISODate(date)) examDates[id] = date;
  });
  const targets = {};
  const levels = {};
  subjects.forEach(id => {
    targets[id] = asFiniteNumber(profile.targets?.[id], id === 'essay' ? 5 : 80);
    levels[id] = typeof profile.levels?.[id] === 'string' ? profile.levels[id] : 'basic';
  });
  return {
    ...profile,
    name: typeof profile.name === 'string' ? profile.name : '',
    subjects,
    targets,
    levels,
    examYear: asFiniteNumber(profile.examYear, resolveExamYear()),
    examDates,
    studyDays: asArray(profile.studyDays).map(Number).filter(day => day >= 1 && day <= 7),
    preferredTimes: asArray(profile.preferredTimes).filter(time => /^\d{2}:\d{2}$/.test(String(time))),
    dailyMinutes: Math.max(30, asFiniteNumber(profile.dailyMinutes, 90)),
    sessionMinutes: Math.max(15, asFiniteNumber(profile.sessionMinutes, 45)),
    schoolEnd: typeof profile.schoolEnd === 'string' ? profile.schoolEnd : '15:00',
    tutorDays: asArray(profile.tutorDays).map(Number).filter(day => day >= 1 && day <= 7),
    tutorTime: typeof profile.tutorTime === 'string' ? profile.tutorTime : '17:00',
    sleepStart: typeof profile.sleepStart === 'string' ? profile.sleepStart : '23:00',
    bufferDay: asFiniteNumber(profile.bufferDay, 7),
    miniMocks: Boolean(profile.miniMocks),
    spacedReview: Boolean(profile.spacedReview)
  };
}

function normalizePlan(plan) {
  if (!isPlainRecord(plan) || !Array.isArray(plan.sessions)) return null;
  const sessions = plan.sessions.filter(session => (
    isPlainRecord(session) &&
    typeof session.id === 'string' &&
    asISODate(session.date) &&
    typeof session.start === 'string' &&
    SUBJECTS[session.subject]
  )).map(session => ({
    ...session,
    date: asISODate(session.date),
    start: String(session.start),
    end: typeof session.end === 'string' ? session.end : String(session.start),
    duration: Math.max(1, asFiniteNumber(session.duration, 45)),
    subject: session.subject,
    topicId: TOPIC_BY_ID[session.topicId] ? session.topicId : null,
    title: typeof session.title === 'string' ? session.title : 'Занятие',
    type: typeof session.type === 'string' ? session.type : 'practice',
    stage: typeof session.stage === 'string' ? session.stage : ''
  }));
  const stats = asRecord(plan.stats);
  return {
    ...plan,
    sessions,
    lastWeekSubjects: asArray(plan.lastWeekSubjects).filter(id => SUBJECTS[id]),
    warnings: asArray(plan.warnings).filter(warning => typeof warning === 'string'),
    stats: {
      covered: Math.max(0, asFiniteNumber(stats.covered, 0)),
      total: Math.max(0, asFiniteNumber(stats.total, 0)),
      sessions: Math.max(0, asFiniteNumber(stats.sessions, sessions.length)),
      generatedAt: typeof stats.generatedAt === 'string' ? stats.generatedAt : ''
    },
    generatedAt: typeof plan.generatedAt === 'string' ? plan.generatedAt : ''
  };
}

function normalizeTopicMap(value) {
  const topics = {};
  Object.entries(asRecord(value)).forEach(([id, entry]) => {
    if (!TOPIC_BY_ID[id] || !isPlainRecord(entry)) return;
    topics[id] = {
      ...entry,
      theory: Boolean(entry.theory),
      practice: Boolean(entry.practice),
      attempts: Math.max(0, asFiniteNumber(entry.attempts, 0)),
      best: clamp(asFiniteNumber(entry.best, 0), 0, 100)
    };
  });
  return topics;
}

function normalizeProgress(progress) {
  const source = asRecord(progress);
  const activity = {};
  Object.entries(asRecord(source.activity)).forEach(([date, minutes]) => {
    if (asISODate(date)) activity[date] = Math.max(0, asFiniteNumber(minutes, 0));
  });
  const forecastHistory = {};
  Object.entries(asRecord(source.forecastHistory)).forEach(([date, entry]) => {
    if (!asISODate(date) || !isPlainRecord(entry)) return;
    forecastHistory[date] = {
      score: asFiniteNumber(entry.score, 0),
      low: asFiniteNumber(entry.low, 0),
      high: asFiniteNumber(entry.high, 0),
      avg: asFiniteNumber(entry.avg, asFiniteNumber(entry.score, 0)),
      at: typeof entry.at === 'string' ? entry.at : ''
    };
  });
  const achievements = {};
  Object.entries(asRecord(source.achievements)).forEach(([id, entry]) => {
    if (!ACHIEVEMENT_BY_ID[id]) return;
    achievements[id] = isPlainRecord(entry)
      ? { ...entry, unlockedAt: typeof entry.unlockedAt === 'string' ? entry.unlockedAt : '' }
      : { unlockedAt: '' };
  });
  const diagnosticSource = asRecord(source.diagnostic);
  const diagnosticResult = isPlainRecord(diagnosticSource.result) ? diagnosticSource.result : null;
  const diagnostic = source.diagnostic && isPlainRecord(source.diagnostic)
    ? {
        ...source.diagnostic,
        mode: diagnosticSource.mode === 'self' ? 'self' : 'test',
        ratings: Object.fromEntries(Object.entries(asRecord(diagnosticSource.ratings)).filter(([id]) => TOPIC_BY_ID[id])),
        result: diagnosticResult ? {
          ...diagnosticResult,
          total: Math.max(0, asFiniteNumber(diagnosticResult.total, 0)),
          correct: Math.max(0, asFiniteNumber(diagnosticResult.correct, 0)),
          percent: Math.max(0, asFiniteNumber(diagnosticResult.percent, 0)),
          bySubject: asRecord(diagnosticResult.bySubject),
          answers: asArray(diagnosticResult.answers).filter(answer => isPlainRecord(answer) && QUESTION_BY_ID[answer.qid])
        } : null,
        baseline: isPlainRecord(diagnosticSource.baseline) ? {
          ...diagnosticSource.baseline,
          score: asFiniteNumber(diagnosticSource.baseline.score, 0),
          low: asFiniteNumber(diagnosticSource.baseline.low, 0),
          high: asFiniteNumber(diagnosticSource.baseline.high, 0),
          avg: asFiniteNumber(diagnosticSource.baseline.avg, 0)
        } : null,
        summary: asRecord(diagnosticSource.summary)
      }
    : null;
  const dailyQuestionSource = asRecord(source.dailyQuestion);
  const dailyQuestion = QUESTION_BY_ID[dailyQuestionSource.questionId] && asISODate(dailyQuestionSource.date)
    ? dailyQuestionSource
    : null;
  const dailyQuestions = {};
  Object.entries(asRecord(source.dailyQuestions)).forEach(([date, entry]) => {
    if (asISODate(date) && isPlainRecord(entry)) dailyQuestions[date] = entry;
  });
  const rebalance = source.rebalance && isPlainRecord(source.rebalance)
    ? {
        ...source.rebalance,
        count: Math.max(0, asFiniteNumber(source.rebalance.count, 0)),
        pendingReason: Boolean(source.rebalance.pendingReason)
      }
    : null;
  const sessions = {};
  Object.entries(asRecord(source.sessions)).forEach(([id, entry]) => {
    if (!isPlainRecord(entry)) return;
    sessions[id] = { ...entry, doneAt: typeof entry.doneAt === 'string' ? entry.doneAt : '' };
  });
  const mistakes = {};
  Object.entries(asRecord(source.mistakes)).forEach(([id, entry]) => {
    if (!QUESTION_BY_ID[id] || !isPlainRecord(entry)) return;
    mistakes[id] = {
      ...entry,
      questionId: id,
      count: Math.max(1, asFiniteNumber(entry.count, 1)),
      lastWrong: Math.max(0, asFiniteNumber(entry.lastWrong, 0)),
      lastAt: typeof entry.lastAt === 'string' ? entry.lastAt : ''
    };
  });
  const reflections = asArray(source.reflections).filter(entry => (
    isPlainRecord(entry) && asISODate(entry.date) && String(entry.text || '').trim()
  )).map((entry, index) => ({
    id: typeof entry.id === 'string' ? entry.id : 'reflection-' + entry.date + '-' + index,
    date: asISODate(entry.date),
    topicId: TOPIC_BY_ID[entry.topicId] ? entry.topicId : null,
    text: String(entry.text || '').trim().slice(0, 900),
    createdAt: typeof entry.createdAt === 'string' ? entry.createdAt : entry.date + 'T12:00:00.000Z'
  })).slice(-400);
  const mood = asArray(source.mood).filter(entry => (
    isPlainRecord(entry) && asISODate(entry.date)
  )).map(entry => ({
    date: asISODate(entry.date),
    level: clamp(asFiniteNumber(entry.level, 3), 1, 5),
    hour: clamp(asFiniteNumber(entry.hour, 12), 0, 23),
    period: typeof entry.period === 'string' ? entry.period : '',
    note: String(entry.note || '').trim().slice(0, 300),
    at: typeof entry.at === 'string' ? entry.at : entry.date + 'T12:00:00.000Z'
  })).slice(-400);
  const anxietySource = asRecord(source.anxiety);
  const anxietyCompleted = {};
  Object.entries(asRecord(anxietySource.completed)).forEach(([id, date]) => {
    if (ANXIETY_EXERCISE_BY_ID[id] && typeof date === 'string' && date) anxietyCompleted[id] = date;
  });
  const anxiety = {
    completed: anxietyCompleted,
    lastAt: typeof anxietySource.lastAt === 'string' ? anxietySource.lastAt : '',
    sessions: Math.max(0, asFiniteNumber(anxietySource.sessions, 0))
  };
  const surpriseSource = asRecord(source.surprise);
  const surprise = {
    attempts: Math.max(0, asFiniteNumber(surpriseSource.attempts, 0)),
    best: clamp(asFiniteNumber(surpriseSource.best, 0), 0, 100),
    lastAt: typeof surpriseSource.lastAt === 'string' ? surpriseSource.lastAt : '',
    history: asArray(surpriseSource.history).filter(entry => isPlainRecord(entry)).map(entry => ({
      date: typeof entry.date === 'string' ? entry.date : '',
      correct: Math.max(0, asFiniteNumber(entry.correct, 0)),
      total: Math.max(0, asFiniteNumber(entry.total, 0))
    })).slice(-60)
  };
  const scheduleSource = asRecord(source.schedule);
  const schedule = {
    source: typeof scheduleSource.source === 'string' ? scheduleSource.source : '',
    importedAt: typeof scheduleSource.importedAt === 'string' ? scheduleSource.importedAt : '',
    lessons: asArray(scheduleSource.lessons).filter(lesson => (
      isPlainRecord(lesson) &&
      (asISODate(lesson.date) || (Number(lesson.weekday) >= 1 && Number(lesson.weekday) <= 7)) &&
      /^\d{2}:\d{2}$/.test(String(lesson.start)) &&
      /^\d{2}:\d{2}$/.test(String(lesson.end))
    )).map((lesson, index) => ({
      id: typeof lesson.id === 'string' ? lesson.id : 'lesson-' + index,
      date: asISODate(lesson.date),
      weekday: clamp(asFiniteNumber(lesson.weekday, 0), 0, 7),
      start: String(lesson.start),
      end: String(lesson.end),
      title: String(lesson.title || 'Урок').slice(0, 120),
      source: typeof lesson.source === 'string' ? lesson.source : 'manual'
    })).slice(-1000)
  };
  return {
    topics: normalizeTopicMap(source.topics),
    sessions,
    mistakes,
    activity,
    quizHistory: asArray(source.quizHistory).filter(item => (
      isPlainRecord(item) && SUBJECTS[item.subject]
    )).map(item => ({
      ...item,
      date: typeof item.date === 'string' ? item.date : '',
      subject: item.subject,
      mode: typeof item.mode === 'string' ? item.mode : 'practice',
      total: Math.max(0, asFiniteNumber(item.total, 0)),
      correct: Math.max(0, asFiniteNumber(item.correct, 0))
    })),
    remindersSent: asRecord(source.remindersSent),
    diagnostic,
    forecastHistory,
    achievements,
    dailyQuestion,
    dailyQuestions,
    rebalance,
    reflections,
    mood,
    anxiety,
    surprise,
    schedule
  };
}

function normalizeGroup(group, profile) {
  if (!isPlainRecord(group)) return null;
  const members = asArray(group.members).filter(member => isPlainRecord(member) && typeof member.id === 'string').map(member => ({
    ...member,
    name: typeof member.name === 'string' ? member.name : 'Участник',
    isMe: Boolean(member.isMe),
    demo: Boolean(member.demo),
    sessions: Math.max(0, asFiniteNumber(member.sessions, 0))
  }));
  if (!members.some(member => member.isMe) && profile) {
    members.unshift({ id: 'me', name: profile.name || currentUser?.name || 'Вы', isMe: true, demo: false, sessions: 0 });
  }
  return {
    ...group,
    id: typeof group.id === 'string' ? group.id : 'group_local',
    name: typeof group.name === 'string' ? group.name : 'Наша команда',
    code: typeof group.code === 'string' ? group.code : '',
    demo: Boolean(group.demo),
    targetPerMember: Math.max(1, asFiniteNumber(group.targetPerMember, 3)),
    members
  };
}

function normalizeState(loaded) {
  const base = defaultState();
  if (!isPlainRecord(loaded)) return base;
  const profile = normalizeProfile(loaded.profile);
  return {
    ...base,
    ...loaded,
    version: 2,
    onboarded: Boolean(loaded.onboarded),
    profile,
    plan: normalizePlan(loaded.plan),
    progress: normalizeProgress(loaded.progress),
    group: normalizeGroup(loaded.group, profile),
    settings: {
      ...base.settings,
      ...asRecord(loaded.settings),
      notify: Boolean(loaded.settings?.notify),
      emailNotify: Boolean(loaded.settings?.emailNotify),
      sound: Boolean(loaded.settings?.sound),
      email: typeof loaded.settings?.email === 'string' ? loaded.settings.email : ''
    },
    meta: { ...base.meta, ...asRecord(loaded.meta) }
  };
}

function topicTaskNumbers(topic) {
  const text = String(topic?.examTasks || '')
    .replace(/\(часть\s*\d+\)/gi, '')
    .replace(/критерии/gi, '');
  const numbers = new Set();
  text.replace(/(\d+)(?:\s*[–—-]\s*(\d+))?/g, (match, first, second) => {
    const from = Number(first);
    const to = second ? Number(second) : from;
    if (!Number.isFinite(from) || !Number.isFinite(to)) return match;
    for (let value = from; value <= Math.min(to, from + 40); value += 1) numbers.add(value);
    return match;
  });
  return numbers;
}

function kimTaskTopicIds(subjectId, taskNumber) {
  const override = KIM_TASK_TOPIC_OVERRIDES[subjectId + ':' + taskNumber];
  if (override) return override.filter(id => TOPIC_BY_ID[id]);
  const topics = topicsForSubject(subjectId);
  const matching = topics.filter(topic => topicTaskNumbers(topic).has(taskNumber));
  if (matching.length) return matching.map(topic => topic.id);
  let nearest = null;
  let distance = Infinity;
  topics.forEach(topic => {
    topicTaskNumbers(topic).forEach(number => {
      const delta = Math.abs(number - taskNumber);
      if (delta < distance) {
        distance = delta;
        nearest = topic.id;
      }
    });
  });
  if (nearest && distance <= 3) return [nearest];
  const index = topics.length ? (taskNumber - 1) % topics.length : -1;
  return index >= 0 ? [topics[index].id] : [];
}

function kimTaskMeta(subjectId, taskNumber) {
  const topics = kimTaskTopicIds(subjectId, taskNumber).map(id => TOPIC_BY_ID[id]).filter(Boolean);
  const fallback = KIM_TASK_LABELS[subjectId]?.[taskNumber];
  const title = fallback || topics[0]?.title || 'Задание ' + taskNumber;
  const points = Number(KIM_POINTS[subjectId]?.[taskNumber - 1] || 1);
  return { subjectId, number: taskNumber, title, points, topics };
}

function topicPointValue(topic) {
  const topics = topicsForSubject(topic.subject);
  const total = topics.reduce((sum, item) => sum + Math.max(1, Number(item.weight) || 1), 0);
  return total ? 100 * Math.max(1, Number(topic.weight) || 1) / total : 0;
}

function formatPace(value) {
  const number = Math.max(0, Number(value) || 0);
  const rounded = number < 1 ? Math.round(number * 100) / 100 : Math.round(number * 10) / 10;
  return String(rounded).replace('.', ',');
}

const SUBJECT_DATIVE = {
  essay: 'сочинению',
  math: 'математике',
  physics: 'физике',
  russian: 'русскому',
  social: 'обществознанию'
};

function subjectDative(subjectId) {
  return SUBJECT_DATIVE[subjectId] || (SUBJECTS[subjectId]?.short.toLowerCase() || 'предмету');
}

function targetScoreFor(subjectId, override) {
  if (override !== undefined) return clamp(Number(override) || 0, 0, 100);
  return clamp(Number(state.profile?.targets?.[subjectId] || (SUBJECTS[subjectId]?.isEssay ? 5 : 80)), 0, 100);
}

function remainingStudyDays(subjectId) {
  const profile = state.profile;
  const examDate = examDateFor(subjectId);
  if (!profile || !examDate) return 0;
  const end = parseISO(examDate);
  const today = startOfDay(new Date());
  if (end <= today) return 0;
  const days = (profile.studyDays || []).map(Number);
  let count = 0;
  for (let cursor = new Date(today); cursor < end; cursor = addDays(cursor, 1)) {
    if (days.includes(dayNumber(cursor)) && Number(profile.bufferDay) !== dayNumber(cursor)) count += 1;
  }
  return count;
}

function currentSubjectPace(subjectId) {
  const topics = topicsForSubject(subjectId);
  const done = topics.filter(topic => isTopicDone(topic.id)).length;
  const created = state.meta?.createdAt ? new Date(state.meta.createdAt) : new Date();
  const elapsedDays = Math.max(7, daysBetween(new Date(), created));
  return done / elapsedDays * 7;
}

function targetAnalysis(subjectId, overrideTarget) {
  const subject = SUBJECTS[subjectId];
  if (!subject) return null;
  const topics = topicsForSubject(subjectId);
  const doneTopics = topics.filter(topic => isTopicDone(topic.id));
  const target = targetScoreFor(subjectId, overrideTarget);
  const examDate = examDateFor(subjectId);
  const daysLeft = examDate ? Math.max(0, daysBetween(parseISO(examDate), new Date())) : 0;
  if (subject.isEssay) {
    const done = doneTopics.length;
    const ready = done >= Math.max(4, Math.ceil(topics.length * 0.7));
    return {
      subjectId, subject, target, score: null, low: null, high: null, gap: 0,
      isEssay: true, ready, doneTopics: done, totalTopics: topics.length,
      neededTopics: [], remainingTopics: topics.filter(topic => !isTopicDone(topic.id)),
      daysLeft, requiredPerDay: 0, requiredPerWeek: 0, currentPerWeek: 0, deltaPerDay: 0, deltaPerWeek: 0,
      deadline: examDate ? toISO(addDays(parseISO(examDate), -14)) : '',
      criticalTasks: ['Критерий 1–2', 'Один сильный аргумент', 'Проверка работы'],
      sentence: ready
        ? 'Допуск уже в прогнозе: ключевые этапы закрыты. Осталось закрепить аргументы и проверку.'
        : 'До сочинения ' + daysLeft + ' ' + pluralize(daysLeft, ['день', 'дня', 'дней']) + '. Для допуска нужно закрыть ещё ' + (Math.max(4, Math.ceil(topics.length * 0.7)) - done) + ' этапов.'
    };
  }
  const forecast = forecastForSubject(subjectId) || { score: 0, low: 0, high: 0, mastery: 0, coverage: 0, accuracy: null, answers: 0 };
  const gap = Math.max(0, target - forecast.score);
  const sorted = topics.filter(topic => !isTopicDone(topic.id))
    .map(topic => ({ topic, points: topicPointValue(topic) }))
    .sort((a, b) => b.points - a.points || a.topic.difficulty - b.topic.difficulty);
  const needed = [];
  let covered = 0;
  for (const item of sorted) {
    if (covered >= gap) break;
    needed.push(item.topic);
    covered += item.points;
  }
  const studyDays = remainingStudyDays(subjectId);
  const requiredPerDay = studyDays ? needed.length / studyDays : 0;
  const activeDays = Math.max(1, (state.profile?.studyDays || []).filter(day => Number(day) !== Number(state.profile?.bufferDay)).length);
  const weeksLeft = Math.max(0.3, daysLeft / 7);
  const requiredPerWeek = needed.length / weeksLeft;
  const currentPerWeek = currentSubjectPace(subjectId);
  const deltaPerWeek = Math.max(0, requiredPerWeek - currentPerWeek);
  const deltaPerDay = deltaPerWeek / activeDays;
  const criticalTasks = [];
  needed.slice(0, 3).forEach(topic => {
    if (!criticalTasks.includes(topic.examTasks)) criticalTasks.push(topic.examTasks);
  });
  if (!criticalTasks.length && gap > 0) {
    const meta = kimTaskMeta(subjectId, KIM_TASK_COUNTS[subjectId] || 1);
    criticalTasks.push(meta.title);
  }
  let sentence = '';
  if (gap <= 0) {
    sentence = 'При текущем темпе — ' + forecast.score + '. Цель ' + target + ' уже в прогнозе: запас ' + Math.max(0, forecast.score - target) + ' б. Можно снизить темп и заняться точностью.';
  } else {
    const topicCount = needed.length + ' ' + pluralize(needed.length, ['тему', 'темы', 'тем']);
    if (deltaPerDay > 0.02) {
      sentence = 'При текущем темпе — ' + forecast.score + '. Для ' + target + ' нужно +' + formatPace(deltaPerDay) + ' темы в день и закрыть ещё ' + topicCount + '.';
    } else if (studyDays > 0) {
      sentence = 'При текущем темпе — ' + forecast.score + '. Для ' + target + ' нужно закрыть ещё ' + topicCount + ' — это ≈' + formatPace(requiredPerDay) + ' темы за учебный день. Текущего ритма достаточно, если не пропускать занятия.';
    } else {
      sentence = 'При текущем темпе — ' + forecast.score + '. Для ' + target + ' нужно закрыть ещё ' + topicCount + ', но до экзамена не осталось учебных дней. Выберите самые важные темы.';
    }
  }
  return {
    subjectId, subject, target, score: forecast.score, low: forecast.low, high: forecast.high,
    gap, isEssay: false, ready: gap <= 0, doneTopics: doneTopics.length, totalTopics: topics.length,
    neededTopics: needed, remainingTopics: sorted.map(item => item.topic),
    daysLeft, studyDays, requiredPerDay,
    requiredPerWeek, currentPerWeek, deltaPerDay, deltaPerWeek,
    deadline: examDate ? toISO(addDays(parseISO(examDate), -14)) : '',
    criticalTasks, sentence
  };
}

function targetOverview() {
  const analyses = profileSubjects().filter(id => !SUBJECTS[id].isEssay).map(id => targetAnalysis(id)).filter(Boolean);
  const essay = profileSubjects().filter(id => SUBJECTS[id].isEssay).map(id => targetAnalysis(id))[0] || null;
  const targetTotal = analyses.reduce((sum, item) => sum + item.target, 0);
  const scoreTotal = analyses.reduce((sum, item) => sum + (item.score || 0), 0);
  const gap = Math.max(0, targetTotal - scoreTotal);
  const sorted = analyses.slice().sort((a, b) => b.gap - a.gap);
  return {
    analyses,
    essay,
    targetTotal,
    scoreTotal,
    gap,

  };

function strategicMinimum(subjectId, overrideTarget) {
  const subject = SUBJECTS[subjectId];
  const topics = topicsForSubject(subjectId);
  const target = targetScoreFor(subjectId, overrideTarget);
  const totalWeight = topics.reduce((sum, topic) => sum + Math.max(1, Number(topic.weight) || 1), 0);
  const sorted = topics.slice().sort((a, b) => (
    (Number(b.weight) || 1) - (Number(a.weight) || 1) ||
    (Number(a.difficulty) || 3) - (Number(b.difficulty) || 3) ||
    a.order - b.order
  ));
  const threshold = subject?.isEssay ? Math.min(5, target) * 0.8 : target * 0.8;
  const bonusLimit = subject?.isEssay ? target + 0.6 : target * 1.02;
  const mandatory = [];
  const bonus = [];
  const skipped = [];
  let mandatoryPoints = 0;
  let bonusPoints = 0;
  sorted.forEach(topic => {
    const points = subject?.isEssay ? (target / topics.length) : topicPointValue(topic);
    if (mandatoryPoints < threshold) {
      mandatory.push({ topic, points });
      mandatoryPoints += points;
    } else if (mandatoryPoints + bonusPoints < bonusLimit) {
      bonus.push({ topic, points });
      bonusPoints += points;
    } else {
      skipped.push({ topic, points });
    }
  });
  if (!mandatory.length && sorted.length) mandatory.push({ topic: sorted[0], points: topicPointValue(sorted[0]) });
  const mandatoryIds = new Set(mandatory.map(item => item.topic.id));
  const mandatoryDone = mandatory.filter(item => isTopicDone(item.topic.id)).length;
  const completion = mandatory.length ? mandatoryDone / mandatory.length : 0;
  let skipNote = '';
  if (target <= 70) {
    skipNote = subjectId === 'math'
      ? 'Для 70 баллов не нужны № 18 (параметр) и сложные пункты стереометрии. Это стратегия, а не пробел.'
      : subjectId === 'russian'
        ? 'Для 70 не нужно выжимать максимум из сочинения: уверенные 17–19 баллов за № 27 уже достаточны.'
        : subjectId === 'social'
          ? 'Для 70 можно не писать эссе № 25 на максимум: сначала часть 1 и план № 24.'
          : subjectId === 'physics'
            ? 'Для 70 можно не решать № 25–26 развёрнутой части. Сначала гарантируйте часть 1.'
            : 'Для допуска важнее критерии 1–2 и один сильный аргумент, а не идеальная композиция.';
  } else {
    skipNote = 'Цель выше 70 — стратегического минимума уже недостаточно. Бонусные темы дают запас и снижают риск на экзамене.';
  }
  return {
    subjectId, target, mandatory, bonus, skipped,
    mandatoryPoints, bonusPoints, completion, mandatoryDone,
    skipNote
  };
}

function backwardMilestones(subjectId) {
  const subject = SUBJECTS[subjectId];
  const examDate = examDateFor(subjectId);
  if (!subject || !examDate) return [];
  const exam = parseISO(examDate);
  const today = startOfDay(new Date());
  const minimum = strategicMinimum(subjectId);
  const mandatory = minimum.mandatory.map(item => item.topic);
  const completion = minimum.completion;
  const definitions = [
    { key: 'base', days: 60, title: 'Закрыть базу и диагностику', note: 'Разобрать фундамент и убрать главные пробелы.', ratio: 0.35, topics: mandatory.slice(0, Math.max(1, Math.ceil(mandatory.length * 0.35))) },
    { key: 'minimum', days: 30, title: 'Стратегический минимум', note: 'Темы, которые дают ~80% целевых баллов.', ratio: 0.8, topics: mandatory },
    { key: 'two-weeks', days: 14, title: 'За 2 недели: практика', note: 'Пробники, разбор ошибок и закрепление бонусных тем.', ratio: 1, topics: minimum.bonus.map(item => item.topic) },
    { key: 'week', days: 7, title: 'Последняя неделя', note: 'Только повторение, шпаргалки и сон. Новых тем нет.', ratio: 1, topics: mandatory.slice(0, 8), review: true },
    { key: 'day', days: 1, title: 'День перед экзаменом', note: 'Документы, маршрут, отдых. Никакой зубрёжки.', ratio: 1, topics: [], review: true }
  ];
  return definitions.map(definition => {
    const date = addDays(exam, -definition.days);
    const dateISO = toISO(date);
    const topicProgress = definition.topics.length
      ? definition.topics.filter(topic => isTopicDone(topic.id)).length / definition.topics.length
      : completion;
    const progress = definition.key === 'week' || definition.key === 'day' ? completion : topicProgress;
    let status = 'upcoming';
    if (definition.review) {
      if (date <= today && today <= exam) status = 'review';
      else if (date < today) status = 'done';
    } else if (progress >= definition.ratio) status = 'done';
    else if (date < today) status = 'overdue';
    else if (daysBetween(date, today) <= 7) status = 'soon';
    return {
      ...definition,
      date: dateISO,
      status,
      progress: Math.min(100, Math.round(progress * 100)),
      dateLabel: formatDateFull(date)
    };
  });
}

function topicClosure(topicId, seen) {
  const topic = TOPIC_BY_ID[topicId];
  if (!topic) return [];
  const visited = seen || new Set();
  if (visited.has(topicId)) return [];
  visited.add(topicId);
  const chain = [];
  (topic.prereqs || []).forEach(prereqId => {
    chain.push(...topicClosure(prereqId, visited));
  });
  chain.push(topic);
  return chain;
}

function dependencyInfoForTopic(topicId) {
  const topic = TOPIC_BY_ID[topicId];
  if (!topic) return null;
  const chain = topicClosure(topicId);
  const lowMastery = chain.filter(item => topicMasteryValue(item) < 0.65);
  const weak = lowMastery.length ? lowMastery : chain.filter(item => !isTopicDone(item.id));
  const root = weak[0] || chain.find(item => topicMasteryValue(item) < 0.8) || null;
  return { topic, chain, weak, root };
}

function weakestTopicForSubject(subjectId) {
  const topics = topicsForSubject(subjectId);
  return topics.slice().sort((a, b) => {
    const doneA = isTopicDone(a.id) ? 1 : 0;
    const doneB = isTopicDone(b.id) ? 1 : 0;
    if (doneA !== doneB) return doneA - doneB;
    const masteryA = topicMasteryValue(a);
    const masteryB = topicMasteryValue(b);
    if (masteryA !== masteryB) return masteryA - masteryB;
    const prereqA = dependencyInfoForTopic(a.id)?.weak.length || 0;
    const prereqB = dependencyInfoForTopic(b.id)?.weak.length || 0;
    if (prereqA !== prereqB) return prereqB - prereqA;
    return (Number(b.weight) || 1) - (Number(a.weight) || 1);
  })[0] || null;
}

function dependencyDepth(topic, seen) {
  const visited = seen || new Set();
  if (!topic || visited.has(topic.id)) return 0;
  visited.add(topic.id);
  const prereqs = (topic.prereqs || []).map(id => TOPIC_BY_ID[id]).filter(Boolean);
  if (!prereqs.length) return 0;
  return 1 + Math.max(...prereqs.map(item => dependencyDepth(item, new Set(visited))));
}

function dependencyMapForSubject(subjectId) {
  return topicsForSubject(subjectId)
    .map(topic => ({ topic, depth: dependencyDepth(topic) }))
    .sort((a, b) => a.depth - b.depth || a.topic.order - b.topic.order);
}

function pseForSubject(subjectId) {
  const count = KIM_TASK_COUNTS[subjectId] || 0;
  const tasks = [];
  for (let number = 1; number <= count; number += 1) {
    const meta = kimTaskMeta(subjectId, number);
    const related = meta.topics.length ? meta.topics : topicsForSubject(subjectId).slice(0, 1);
    const weighted = related.reduce((sum, topic) => sum + topicMasteryValue(topic) * Math.max(1, topic.weight), 0);
    const weightSum = related.reduce((sum, topic) => sum + Math.max(1, topic.weight), 0);
    const probability = Math.round(clamp(weightSum ? weighted / weightSum * 100 : 0, 0, 100));
    const tone = probability >= 68 ? 'green' : probability >= 42 ? 'yellow' : 'red';
    tasks.push({
      ...meta,
      probability,
      tone,
      status: tone === 'green' ? 'уверенно' : tone === 'yellow' ? 'нужно закрепить' : 'слабый участок'
    });
  }
  const points = tasks.reduce((sum, task) => sum + task.points, 0);
  const expected = tasks.reduce((sum, task) => sum + task.points * task.probability / 100, 0);
  return {
    subjectId,
    tasks,
    green: tasks.filter(task => task.tone === 'green').length,
    yellow: tasks.filter(task => task.tone === 'yellow').length,
    red: tasks.filter(task => task.tone === 'red').length,
    expected: Math.round(expected),
    points
  };
}

function pseTaskDetail(subjectId, taskNumber) {
  const summary = pseForSubject(subjectId);
  const task = summary.tasks.find(item => item.number === taskNumber);
  if (!task) return null;
  const related = task.topics.map(topic => {
    const progress = state.progress.topics[topic.id] || {};
    return {
      topic,
      mastery: Math.round(topicMasteryValue(topic) * 100),
      done: isTopicDone(topic.id),
      best: Number(progress.best || 0),
      attempts: Number(progress.attempts || 0)
    };
  }).sort((a, b) => a.mastery - b.mastery);
  const weak = related[0]?.topic || task.topics[0];
  return {
    ...task,
    related,
    weakTopic: weak,
    dependency: weak ? dependencyInfoForTopic(weak.id) : null,
    mistakes: weak ? (TOPIC_MISTAKES[weak.id] || []) : [],
    advice: task.probability >= 68
      ? 'Поддерживайте форму: одно короткое задание раз в 2–3 дня.'
      : task.probability >= 42
        ? 'Закрепите алгоритм на 2–3 заданиях и разберите ошибки.'
        : 'Сначала вернитесь к базовой теме, затем решите 3 простых задания.'
  };
}

function moodPeriodForHour(hour) {
  const value = Number(hour);
  if (value >= 5 && value <= 11) return MOOD_PERIODS[0];
  if (value >= 12 && value <= 16) return MOOD_PERIODS[1];
  return MOOD_PERIODS[2];
}

function moodEntryForDate(dateISO) {
  return (state.progress.mood || []).find(entry => entry.date === dateISO) || null;
}

function moodRecent(days) {
  const from = toISO(addDays(new Date(), -(days || 28)));
  return (state.progress.mood || []).filter(entry => entry.date >= from).sort((a, b) => a.date.localeCompare(b.date));
}

function moodStats() {
  const entries = moodRecent(28);
  const byPeriod = {};
  const byWeekday = {};
  MOOD_PERIODS.forEach(period => { byPeriod[period.id] = []; });
  for (let day = 1; day <= 7; day += 1) byWeekday[day] = [];
  entries.forEach(entry => {
    const period = entry.period || moodPeriodForHour(entry.hour).id;
    if (byPeriod[period]) byPeriod[period].push(entry.level);
    const weekday = dayNumber(parseISO(entry.date));
    byWeekday[weekday].push(entry.level);
  });
  const average = values => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
  return {
    count: entries.length,
    byPeriod: Object.fromEntries(Object.entries(byPeriod).map(([id, values]) => [id, average(values)])),
    byWeekday: Object.fromEntries(Object.entries(byWeekday).map(([day, values]) => [day, average(values)])),
    overall: average(entries.map(entry => entry.level))
  };
}

function moodInsight() {
  const stats = moodStats();
  if (stats.count < 4) {
    return 'Пока мало записей. Отметьте настроение 4–5 дней — тогда появится связь с днями недели и временем занятий.';
  }
  const periodEntries = MOOD_PERIODS.map(period => ({ ...period, value: stats.byPeriod[period.id] })).filter(item => item.value !== null);
  const weekdayEntries = Object.entries(stats.byWeekday).filter(([, value]) => value !== null).map(([day, value]) => ({ day: Number(day), value }));
  const best = periodEntries.slice().sort((a, b) => b.value - a.value)[0];
  const worst = periodEntries.slice().sort((a, b) => a.value - b.value)[0];
  const bestDay = weekdayEntries.slice().sort((a, b) => b.value - a.value)[0];
  const worstDay = weekdayEntries.slice().sort((a, b) => a.value - b.value)[0];
  let text = '';
  if (best) {
    const bestWord = { morning: 'утром', day: 'днём', evening: 'вечером' }[best.id] || 'в это время';
    text += 'Лучше всего вы себя чувствуете ' + bestWord + ' (' + best.value.toFixed(1) + '/5) — ставьте туда новую теорию. ';
  }
  if (worst && worst.value <= 2.8) {
    const worstWord = { morning: 'Утром', day: 'Днём', evening: 'Вечером' }[worst.id] || 'В это время';
    text += worstWord + ' настроение ниже (' + worst.value.toFixed(1) + '/5): оставьте лёгкое повторение или отдых. ';
  }
  if (bestDay) text += 'Самый ресурсный день — ' + WEEKDAYS_FULL[bestDay.day % 7] + '. ';
  if (worstDay && worstDay.value <= 2.5) text += 'По ' + WEEKDAYS_DATIVE_PLURAL[worstDay.day % 7] + ' лучше не ставить сложное: попробуйте буфер или короткую сессию.';
  if (!text) text = 'Связь пока слабая. Продолжайте отмечать настроение — рекомендации станут точнее.';
  return text;
}

function parseScheduleText(text, source) {
  const weekdayAliases = [
    ['понедельник', 1], ['понед', 1], ['пн', 1],
    ['вторник', 2], ['втор', 2], ['вт', 2],
    ['среда', 3], ['сред', 3], ['ср', 3],
    ['четверг', 4], ['четв', 4], ['чт', 4],
    ['пятница', 5], ['пятн', 5], ['пт', 5],
    ['суббота', 6], ['субб', 6], ['сб', 6],
    ['воскресенье', 7], ['воскр', 7], ['вс', 7]
  ];
  const lessons = [];
  String(text || '').split(/\r?\n/).forEach((line, index) => {
    const raw = line.trim();
    if (!raw) return;
    const timeMatch = raw.match(/(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/);
    if (!timeMatch) return;
    const start = pad(Number(timeMatch[1])) + ':' + timeMatch[2];
    const end = pad(Number(timeMatch[3])) + ':' + timeMatch[4];
    if (timeToMinutes(end) <= timeToMinutes(start)) return;
    const dateMatch = raw.match(/(\d{4})-(\d{2})-(\d{2})/);
    let date = dateMatch ? dateMatch[1] + '-' + dateMatch[2] + '-' + dateMatch[3] : '';
    let weekday = 0;
    if (date) {
      const parsed = parseISO(date);
      if (!Number.isFinite(parsed.getTime())) date = '';
      else weekday = dayNumber(parsed);
    }
    if (!date) {
      const lower = raw.toLowerCase();
      const found = weekdayAliases.find(([alias]) => new RegExp('(^|[^а-яё])' + alias + '([^а-яё]|$)').test(lower));
      if (found) weekday = found[1];
    }
    if (!date && !weekday) return;
    const title = raw
      .replace(timeMatch[0], ' ')
      .replace(/(\d{4})-(\d{2})-(\d{2})/g, ' ')
      .replace(/^[\s\d.)-]+/, '')
      .replace(/(^|[^а-яё])(понедельник|понед|пн|вторник|втор|вт|среда|сред|ср|четверг|четв|чт|пятница|пятн|пт|суббота|субб|сб|воскресенье|воскр|вс)(?=[^а-яё]|$)/gi, '$1 ')
      .replace(/\s+/g, ' ')
      .trim();
    lessons.push({
      id: 'lesson-' + Date.now().toString(36) + '-' + index,
      date,
      weekday,
      start,
      end,
      title: title.slice(0, 120) || 'Урок',
      source: source || 'manual'
    });
  });
  return lessons.slice(0, 400);
}

function scheduleConflicts(date, start, end) {
  const lessons = state.progress.schedule?.lessons || [];
  if (!lessons.length) return false;
  const iso = toISO(date);
  const weekday = dayNumber(date);
  const startMinutes = timeToMinutes(start);
  const endMinutes = timeToMinutes(end);
  return lessons.some(lesson => {
    if (lesson.date !== iso && Number(lesson.weekday) !== weekday) return false;
    return startMinutes < timeToMinutes(lesson.end) && endMinutes > timeToMinutes(lesson.start);
  });
}

function lastWeekSubjects(profile) {
  const source = profile || state.profile;
  if (!source) return [];
  const today = startOfDay(new Date());
  return (source.subjects || []).filter(subjectId => {
    const examDate = source.examDates?.[subjectId];
    if (!examDate) return false;
    const days = daysBetween(parseISO(examDate), today);
    return days > 0 && days <= 7;
  });

  let cadence = days <= 21 ? 1.5 : days <= 45 ? 2 : days <= 90 ? 3 : days <= 180 ? 5 : 7;

function bytesToHex(bytes) {
  return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
}

function hexToBytes(value) {
  const text = String(value || '');
  const bytes = new Uint8Array(Math.floor(text.length / 2));
  for (let index = 0; index < bytes.length; index += 1) {
    bytes[index] = parseInt(text.slice(index * 2, index * 2 + 2), 16);
  }
  return bytes;
}

function randomHex(length) {
  const bytes = new Uint8Array(length || 16);
  if (window.crypto?.getRandomValues) window.crypto.getRandomValues(bytes);
  else for (let index = 0; index < bytes.length; index += 1) bytes[index] = Math.floor(Math.random() * 256);
  return bytesToHex(bytes);
}

function fallbackPasswordHash(password, salt, iterations) {
  const source = String(salt) + ':' + String(password) + ':fokus-ege';
  let a = 0x811c9dc5;
  let b = 0x9e3779b9;
  let c = 0x85ebca6b;
  let d = 0xc2b2ae35;
  for (let round = 0; round < iterations; round += 1) {
    for (let index = 0; index < source.length; index += 1) {
      const code = source.charCodeAt(index) + round;
      a = Math.imul(a ^ code, 0x01000193) >>> 0;
      b = Math.imul(b ^ (a >>> 13), 0x85ebca6b) >>> 0;
      c = Math.imul(c ^ (b >>> 11), 0xc2b2ae35) >>> 0;
      d = Math.imul(d ^ (c >>> 7), 0x27d4eb2f) >>> 0;
    }
  }
  return [a, b, c, d, a ^ b ^ c ^ d, Math.imul(a, b) >>> 0, Math.imul(c, d) >>> 0, (a + b + c + d) >>> 0]
    .map(value => value.toString(16).padStart(8, '0')).join('');
}

async function derivePasswordHash(password, salt, iterations, algo) {
  if (algo === 'pbkdf2-sha256') {
    if (!window.crypto?.subtle) throw new Error('В этом браузере недоступен безопасный вход. Откройте файл в современном Chrome.');
    const material = await window.crypto.subtle.importKey(
      'raw',
      new TextEncoder().encode(password),
      'PBKDF2',
      false,
      ['deriveBits']
    );
    const bits = await window.crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: hexToBytes(salt), iterations, hash: 'SHA-256' },
      material,
      256
    );
    return bytesToHex(new Uint8Array(bits));
  }
  return fallbackPasswordHash(password, salt, iterations);
}

function safeEqual(left, right) {
  if (typeof left !== 'string' || typeof right !== 'string' || left.length !== right.length) return false;
  let result = 0;
  for (let index = 0; index < left.length; index += 1) result |= left.charCodeAt(index) ^ right.charCodeAt(index);
  return result === 0;
}

async function createAccount(name, email, password) {
  const accounts = readAccounts();
  const normalizedEmail = normalizeEmail(email);
  if (accounts.users.some(user => user.email === normalizedEmail)) {
    throw new Error('Аккаунт с таким email уже существует.');
  }
  const algo = window.crypto?.subtle ? 'pbkdf2-sha256' : 'fnv-mix';
  const iterations = algo === 'pbkdf2-sha256' ? PASSWORD_ITERATIONS : 30000;
  const salt = randomHex(16);
  const hash = await derivePasswordHash(password, salt, iterations, algo);
  const user = {
    id: 'u_' + Date.now().toString(36) + '_' + randomHex(4),
    name: String(name || '').trim(),
    email: normalizedEmail,
    salt,
    hash,
    algo,
    iterations,
    createdAt: new Date().toISOString(),
    lastLoginAt: new Date().toISOString()
  };
  accounts.users.push(user);
  writeAccounts(accounts);
  return user;
}

async function verifyAccountPassword(user, password) {
  const hash = await derivePasswordHash(password, user.salt, Number(user.iterations) || 1, user.algo);
  return safeEqual(hash, user.hash);
}
