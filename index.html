function topicMasteryValue(topic) {
  const progress = state.progress.topics[topic.id] || {};
  const best = clamp(progress.best, 0, 100) / 100;
  const attempts = maybeNumber(progress.attempts);
  if (attempts > 0) {
    return clamp(best * 0.72 + (progress.theory ? 0.14 : 0) + (progress.practice ? 0.14 : 0), 0, 1);
  }
  if (progress.theory && progress.practice) return 0.82;
  if (progress.theory) return 0.4;
  return 0;
}

function forecastForSubject(subjectId) {
  const subject = SUBJECTS[subjectId];
  const topics = topicsForSubject(subjectId);
  if (!subject || subject.isEssay || !topics.length) return null;
  const weightSum = topics.reduce((sum, topic) => sum + Math.max(1, maybeNumber(topic.weight)), 0);
  let weightedMastery = 0;
  let weightedCoverage = 0;
  topics.forEach(topic => {
    const weight = Math.max(1, maybeNumber(topic.weight));
    const progress = state.progress.topics[topic.id] || {};
    weightedMastery += weight * topicMasteryValue(topic);
    weightedCoverage += weight * (progress.theory && progress.practice ? 1 : progress.theory ? 0.35 : 0);
  });
  const mastery = weightSum ? weightedMastery / weightSum : 0;
  const coverage = weightSum ? weightedCoverage / weightSum : 0;
  const history = (state.progress.quizHistory || []).filter(item => item.subject === subjectId);
  const totalAnswers = history.reduce((sum, item) => sum + maybeNumber(item.total), 0);
  const correctAnswers = history.reduce((sum, item) => sum + maybeNumber(item.correct), 0);
  const accuracy = totalAnswers ? correctAnswers / totalAnswers : 0.5;
  const rawScore = 6 + 94 * (0.12 + mastery * 0.5 + coverage * 0.23 + accuracy * 0.15);
  const score = Math.round(clamp(rawScore, 0, 100));
  const margin = Math.round(3 + (1 - coverage) * 4 + (totalAnswers < 10 ? 2 : 0));
  return {
    subjectId,
    score,
    low: Math.max(0, score - margin),
    high: Math.min(100, score + margin),
    mastery: Math.round(mastery * 100),
    coverage: Math.round(coverage * 100),
    accuracy: totalAnswers ? Math.round(accuracy * 100) : null,
    answers: totalAnswers,
    margin
  };
}

function forecastTrend(currentForecast) {
  const forecast = currentForecast || computeForecast();
  const history = state.progress.forecastHistory || {};
  const today = toISO(new Date());
  const previousKeys = Object.keys(history).filter(key => key < today).sort();
  const weekAgo = toISO(addDays(new Date(), -7));
  const weekKeys = previousKeys.filter(key => key <= weekAgo);
  let baselineKey = weekKeys.length ? weekKeys[weekKeys.length - 1] : previousKeys.length ? previousKeys[previousKeys.length - 1] : null;
  if (baselineKey) {
    const baseline = history[baselineKey];
    const days = Math.max(1, daysBetween(new Date(), parseISO(baselineKey)));
    return {
      delta: forecast.totalScore - maybeNumber(baseline.score),
      days,
      label: days >= 6 ? 'за неделю' : 'за ' + daysLabel(days),
      baselineKey
    };
  }
  const diagnosticStart = maybeNumber(state.progress.diagnostic?.baseline?.score);
  if (state.progress.diagnostic?.baseline && diagnosticStart > 0) {
    return {
      delta: forecast.totalScore - diagnosticStart,

}

function forecastSparkBars() {

  const days = Array.from({ length: 7 }, (_, index) => addDays(startOfDay(new Date()), index - 6));

    const key = toISO(day);
    return { key, day, value: history[key] ? maybeNumber(history[key].avg || history[key].score) : null };
  });
  const max = Math.max(10, ...values.map(item => item.value || 0));
  return values.map(item => {
    const height = item.value === null ? 5 : Math.max(7, Math.round(item.value / max * 100));
    const today = item.key === toISO(new Date());
    return '<span class="forecast-spark-bar' + (item.value !== null ? ' on' : '') + (today ? ' today' : '') + '" style="height:' + height + '%" title="' + (item.value !== null ? item.value + ' б.' : 'нет данных') + '"></span>';
  }).join('');
}

function pickDailyQuestion(dateISO) {
  const weak = topWeakTopics(12).filter(topic => topic.questions.length);
  const pool = (weak.length ? weak : topicsForSubject(profileSubjects()[0] || '')).flatMap(topic => topic.questions.map(question => ({ question, topic })));
  if (!pool.length) return null;
  const seed = Number(String(dateISO || toISO(new Date())).replace(/-/g, '')) || 1;
  let index = Math.abs(seed) % pool.length;
  const previous = state.progress.dailyQuestion?.questionId;
  if (pool.length > 1 && pool[index].question.id === previous) index = (index + 1) % pool.length;
  return pool[index];
}

function ensureDailyQuestion() {

function missedStreakInfo() {
  if (!state.plan || !Array.isArray(state.plan.sessions)) return { count: 0, sessions: [] };
  const today = toISO(new Date());
  const past = state.plan.sessions
    .filter(session => session.date < today)
    .sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start));
  let count = 0;
  const missed = [];
  for (let index = past.length - 1; index >= 0; index -= 1) {
    if (sessionIsDone(past[index].id)) break;
    count += 1;
    missed.unshift(past[index]);
  }
  return { count, sessions: missed };
}

function maybeAutoRebalance() {
  if (!state.profile || !state.plan) return null;
  const info = missedStreakInfo();
  if (info.count < 3) return null;
  const signature = info.sessions.map(session => session.id).join('|');
  if (state.progress.rebalance?.lastSignature === signature) return null;
  const lastMissed = info.sessions[info.sessions.length - 1] || null;
  state.plan = generatePlan(state.profile);
  state.progress.rebalance = {
    lastSignature: signature,
    pendingReason: true,
    count: info.count,
    detectedAt: new Date().toISOString(),
    lastMissedId: lastMissed?.id || null,
    lastMissedTopicId: lastMissed?.topicId || null,
    lastMissedSubject: lastMissed?.subject || null
  };
  saveState();
  return state.progress.rebalance;
}

  return { done, target, percent: Math.min(100, Math.round(done / target * 100)) };
}

  const done = () => showToast('Код скопирован', 'Отправьте его друзьям или преподавателю.', 'success');
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {
      showToast('Не удалось скопировать', 'Код: ' + text, 'info');
    });
    return;
  }
  const area = document.createElement('textarea');
  area.value = text;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try {
    document.execCommand('copy');
    done();
  } catch (error) {
    showToast('Не удалось скопировать', 'Код: ' + text, 'info');
  }
  area.remove();
}

function getSlots(profile, date) {
  const iso = toISO(date);
  const today = toISO(new Date());
  const day = dayNumber(date);
  if (!Number.isFinite(day)) return [];
  if (!(profile.studyDays || []).map(Number).includes(day)) return [];
  if (Number(profile.bufferDay) === day) return [];
  const examDates = profile.examDates || {};
  const active = (profile.subjects || []).some(id => examDates[id] && parseISO(examDates[id]) > date);
  if (!active) return [];
  const now = new Date();
  const preferred = [...(profile.preferredTimes?.length ? profile.preferredTimes : DEFAULT_PREFERRED_TIMES)].sort();
  const schoolEnd = timeToMinutes(profile.schoolEnd || '15:00');
  const sleepStart = timeToMinutes(profile.sleepStart || '23:00');
  const tutorDays = (profile.tutorDays || []).map(Number);
  const tutorStart = timeToMinutes(profile.tutorTime || '17:00');
  const tutorEnd = tutorStart + 60;
  const sessionMinutes = Number(profile.sessionMinutes) || 45;
  const slots = [];
  let previousEnd = null;
  for (const time of preferred) {
    const start = timeToMinutes(time);
    const end = start + sessionMinutes;
    if (day <= 5 && start < schoolEnd + 15) continue;
    if (tutorDays.includes(day) && start < tutorEnd + 10 && end > tutorStart - 10) continue;
    if (scheduleConflicts(date, minutesToTime(start), minutesToTime(end))) continue;
    if (end > sleepStart) continue;
    if (end > 23 * 60 + 59) continue;
    if (previousEnd !== null && start < previousEnd + 10) continue;
    if (iso === today && start <= now.getHours() * 60 + now.getMinutes() + 10) continue;
    slots.push({ start: minutesToTime(start), end: minutesToTime(end), minutes: sessionMinutes });
    previousEnd = end;
  }
  return slots;
}

function planSubjectOrder(profile, date) {
  return [...(profile.subjects || [])]
    .filter(id => SUBJECTS[id] && profile.examDates[id] && parseISO(profile.examDates[id]) > date)
    .sort((a, b) => {
      const levelA = LEVEL_VALUE[profile.levels?.[a] || 'basic'] ?? 1;
      const levelB = LEVEL_VALUE[profile.levels?.[b] || 'basic'] ?? 1;
      if (levelA !== levelB) return levelA - levelB;
      const daysA = daysBetween(parseISO(profile.examDates[a]), date);
      const daysB = daysBetween(parseISO(profile.examDates[b]), date);
      if (daysA !== daysB) return daysA - daysB;
      return SUBJECT_ORDER.indexOf(a) - SUBJECT_ORDER.indexOf(b);
    });
}

function planStateFor(profile) {
  const result = {};
  (profile.subjects || []).forEach(subjectId => {
    result[subjectId] = {
      index: 0,
      plannedTheory: new Set(),
      plannedPractice: new Set(),
      reviews: [],
      lastFallback: null,
      lastDate: null,
      plannedCount: 0,
      lastWeekCursor: 0,
      topics: topicsForSubject(subjectId)
    };
  });
  return result;
}

function nextPlanItem(subjectId, planState, date, profile) {
  const subjectState = planState[subjectId];
  if (!subjectState) return null;
  const iso = toISO(date);
  if (isLastWeekForSubject(subjectId, date, profile)) {
    const reviewedIds = new Set(subjectState.topics.filter(topic => isTopicDone(topic.id)).map(topic => topic.id));
    const minimum = strategicMinimum(subjectId);
    minimum.mandatory.forEach(item => reviewedIds.add(item.topic.id));
    const pool = subjectState.topics.filter(topic => reviewedIds.has(topic.id));
    const fallbackPool = pool.length ? pool : subjectState.topics;
    if (!fallbackPool.length) return null;
    const index = subjectState.lastWeekCursor % fallbackPool.length;
    subjectState.lastWeekCursor += 1;
    const topic = fallbackPool[index];
    const type = index % 3 === 2 ? 'review' : 'cheatsheet';
    return { type, topic };
  }
  const dueIndex = subjectState.reviews.findIndex(review => review.due <= iso);
  if (dueIndex >= 0) {
    const review = subjectState.reviews.splice(dueIndex, 1)[0];
    return { type: 'review', topic: TOPIC_BY_ID[review.topicId] };
  }
  while (subjectState.index < subjectState.topics.length) {
    const topic = subjectState.topics[subjectState.index];
    const progress = state.progress.topics[topic.id] || {};
    const theoryKnown = Boolean(progress.theory) || subjectState.plannedTheory.has(topic.id);
    const practiceKnown = Boolean(progress.practice) || subjectState.plannedPractice.has(topic.id);
    if (!theoryKnown) {
      subjectState.plannedTheory.add(topic.id);
      return { type: 'theory', topic };
    }
    if (!practiceKnown) {
      subjectState.plannedPractice.add(topic.id);
      return { type: 'practice', topic };
    }
    subjectState.index += 1;
  }
  if (subjectState.topics.length) {
    const cadence = planReviewCadence(subjectId, date, profile);
    const lastFallback = subjectState.lastFallback ? daysBetween(date, parseISO(subjectState.lastFallback)) : 99;
    if (lastFallback >= cadence) {
      subjectState.lastFallback = iso;
      const weakest = subjectState.topics
        .slice()
        .sort((a, b) => {
          const scoreA = topicMasteryValue(a);
          const scoreB = topicMasteryValue(b);
          return scoreA - scoreB || b.weight - a.weight;
        })[0];
      return { type: 'review', topic: weakest };
    }
  }
  return null;
}

function activeFocusTopic(profile) {
  const rebalance = state.progress?.rebalance;
  if (!rebalance || rebalance.reason !== 'topic' || !rebalance.focusTopicId || !rebalance.appliedAt) return null;
  const topic = TOPIC_BY_ID[rebalance.focusTopicId];
  if (!topic || !(profile.subjects || []).includes(topic.subject)) return null;
  const age = Math.max(0, daysBetween(new Date(), parseISO(String(rebalance.appliedAt).slice(0, 10))));
  if (age > 21) return null;
  return topic;
}

function takeFocusPlanItem(focusTopic, planState, date, profile) {
  if (!focusTopic) return null;
  const subjectState = planState[focusTopic.subject];
  const examDate = profile.examDates?.[focusTopic.subject];
  if (!subjectState || subjectState.focusScheduled || !examDate || parseISO(examDate) <= date) return null;
  const progress = state.progress.topics[focusTopic.id] || {};
  const theoryKnown = Boolean(progress.theory) || subjectState.plannedTheory.has(focusTopic.id);
  const type = isLastWeekForSubject(focusTopic.subject, date, profile)
    ? (theoryKnown ? 'review' : 'cheatsheet')
    : theoryKnown ? 'practice' : 'theory';
  subjectState.focusScheduled = true;
  if (type === 'theory') subjectState.plannedTheory.add(focusTopic.id);
  else if (type === 'practice') subjectState.plannedPractice.add(focusTopic.id);
  return { subjectId: focusTopic.subject, type, topic: focusTopic };
}

function pickPlanItem(order, planState, lastSubject, date, profile, focusTopic) {
  const focusItem = takeFocusPlanItem(focusTopic, planState, date, profile);
  if (focusItem) {
    planState[focusItem.subjectId].lastDate = toISO(date);
    planState[focusItem.subjectId].plannedCount += 1;
    return focusItem;
  }
  const available = order.filter(subjectId => {
    const examDate = profile.examDates?.[subjectId];
    return examDate && parseISO(examDate) > date;
  });
  const ranked = available.map(subjectId => {
    const subjectState = planState[subjectId];
    const daysToExamValue = Math.max(1, daysBetween(parseISO(profile.examDates[subjectId]), date));
    const gapDays = subjectState.lastDate ? Math.max(0, daysBetween(date, parseISO(subjectState.lastDate))) : 21;
    const cadence = subjectCadence(subjectId, date, profile);
    const overdue = Math.max(0, gapDays - cadence);
    const urgency = daysToExamValue <= 14 ? 55 : daysToExamValue <= 30 ? 30 : daysToExamValue <= 60 ? 16 : daysToExamValue <= 120 ? 7 : 0;
    const levelBoost = (2 - (LEVEL_VALUE[profile.levels?.[subjectId] || 'basic'] ?? 1)) * 5;
    const progress = subjectProgress(subjectId);
    const targetGap = Math.max(0, Number(profile.targets?.[subjectId] || 80) - progress);
    const lastWeekBoost = isLastWeekForSubject(subjectId, date, profile) ? 1000 : 0;
    let score = lastWeekBoost + overdue * 24 + gapDays * 2 + urgency + levelBoost + Math.min(24, targetGap * 0.25);
    if (subjectId === lastSubject) score -= 13;
    if (subjectId === 'essay') score += 9;
    return { subjectId, score };
  }).sort((a, b) => b.score - a.score || SUBJECT_ORDER.indexOf(a.subjectId) - SUBJECT_ORDER.indexOf(b.subjectId));
  for (const candidate of ranked) {
    const item = nextPlanItem(candidate.subjectId, planState, date, profile);
    if (item) {
      planState[candidate.subjectId].lastDate = toISO(date);
      planState[candidate.subjectId].plannedCount += 1;
      return { subjectId: candidate.subjectId, ...item };
    }
  }
  return null;
}

function generatePlan(profile) {
  const result = {
    version: PLAN_VERSION,
    sessions: [],
    warnings: [],
    lastWeekSubjects: [],
    stats: { covered: 0, total: 0, sessions: 0, generatedAt: new Date().toISOString() },
    generatedAt: new Date().toISOString()
  };
  if (!profile || !(profile.subjects || []).length) {
    result.warnings.push('Не выбрано ни одного предмета.');
    return result;
  }
  const dates = profile.examDates || {};
  const selected = profile.subjects.filter(id => SUBJECTS[id]);
  const examDates = selected.map(id => dates[id]).filter(Boolean).map(parseISO);
  if (!examDates.length) {
    result.warnings.push('Не заданы даты экзаменов.');
    return result;
  }
  const lastExam = examDates.reduce((max, date) => date > max ? date : max, examDates[0]);
  const start = startOfDay(new Date());
  if (lastExam < start) {
    result.warnings.push('Дата экзамена уже прошла. Обновите год экзамена в настройках.');
    return result;
  }
  const planState = planStateFor(profile);
  const focusTopic = activeFocusTopic(profile);
  const sessionMinutes = Number(profile.sessionMinutes) || 45;
  const dailyMinutes = Number(profile.dailyMinutes) || 90;
  const maxSessions = Math.max(1, Math.min(3, Math.floor(dailyMinutes / sessionMinutes)));
  let coverage = 0;
  let lastSubject = null;
  let noSlotDays = 0;
  let studyDaysCount = 0;
  const plannedTopics = new Set();
  const seenIds = new Set();
  const startISO = toISO(start);
  for (let cursor = new Date(start); cursor <= lastExam; cursor = addDays(cursor, 1)) {
    const day = dayNumber(cursor);
    const dateISO = toISO(cursor);
    if ((profile.studyDays || []).map(Number).includes(day) && Number(profile.bufferDay) !== day) studyDaysCount += 1;
    const order = planSubjectOrder(profile, cursor);
    if (!order.length) continue;
    const slots = getSlots(profile, cursor);
    if (!slots.length) {
      if ((profile.studyDays || []).map(Number).includes(day) && Number(profile.bufferDay) !== day) noSlotDays += 1;
      continue;
    }
    const weekIndex = Math.floor(daysBetween(cursor, start) / 7);
    const lastWeekActive = order.some(subjectId => isLastWeekForSubject(subjectId, cursor, profile));
    if (profile.miniMocks && !lastWeekActive && cursor.getDay() === 6 && weekIndex > 0 && weekIndex % 2 === 0) {
      const subjectId = order[0];
      const mockDuration = Math.min(60, Math.max(sessionMinutes, dailyMinutes));
      const mockStart = slots[0].start;
      const mockEnd = minutesToTime(timeToMinutes(mockStart) + mockDuration);
      const id = dateISO + '-' + subjectId + '-mock';
      if (!seenIds.has(id)) {
        seenIds.add(id);
        result.sessions.push({
          id, date: dateISO, start: mockStart, end: mockEnd, duration: mockDuration,
          subject: subjectId, topicId: null, title: 'Мини-пробник · ' + SUBJECTS[subjectId].short,
          type: 'mock', stage: SESSION_LABELS.mock
        });
      }
      continue;
    }
    const slotsToUse = slots.slice(0, maxSessions);
    for (const slot of slotsToUse) {
      const picked = pickPlanItem(order, planState, lastSubject, cursor, profile, focusTopic);
      if (!picked) break;
      const topic = picked.topic;
      const type = picked.type;
      const id = dateISO + '-' + picked.subjectId + '-' + topic.id + '-' + type;
      if (seenIds.has(id)) continue;
      seenIds.add(id);
      result.sessions.push({
        id,
        date: dateISO,
        start: slot.start,
        end: slot.end,
        duration: sessionMinutes,
        subject: picked.subjectId,
        topicId: topic.id,
        title: topic.title,
        type,
        stage: SESSION_LABELS[type]
      });
      if (type === 'theory') plannedTopics.add(topic.id);
      if (type === 'practice' && profile.spacedReview) {
        planState[picked.subjectId].reviews.push(
          { topicId: topic.id, due: toISO(addDays(cursor, 3)) },
          { topicId: topic.id, due: toISO(addDays(cursor, 10)) }
        );
      }
      lastSubject = picked.subjectId;
    }
    if (dateISO === startISO && !result.sessions.some(s => s.date === startISO)) {
      continue;
    }
  }
  const allTopics = TOPICS.filter(topic => selected.includes(topic.subject));
  const covered = allTopics.filter(topic => plannedTopics.has(topic.id) || state.progress.topics[topic.id]?.theory).length;
  result.stats = {
    covered,
    total: allTopics.length,
    sessions: result.sessions.length,
    generatedAt: new Date().toISOString()
  };
  result.sessions.sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start));
  if (!result.sessions.length) {
    result.warnings.push('Не удалось поставить занятия: проверьте учебные дни, свободные часы и ограничения.');
  }
  if (covered < allTopics.length) {
    const missing = allTopics.length - covered;
    result.warnings.push('В текущем ритме успеваем охватить ' + covered + ' из ' + allTopics.length + ' тем. Не хватает времени ещё на ' + missing + ' тем.');
  }
  if (noSlotDays > Math.max(3, studyDaysCount * 0.35)) {
    result.warnings.push('Много учебных дней остались без занятий: удобные часы пересекаются со школой, репетитором или сном.');
  }
  if (profile.bufferDay && (profile.studyDays || []).map(Number).includes(Number(profile.bufferDay))) {
    result.warnings.push('Буферный день совпадает с учебным днём — он оставлен свободным от занятий.');
  }
  result.lastWeekSubjects = lastWeekSubjects(profile);
  return result;
}

function ensureSettingsDraft() {
  if (settingsDraft) return;
  const profile = state.profile;
  if (!profile) return;
  settingsDraft = {
    studyDays: [...(profile.studyDays || [])].map(Number),
    preferredTimes: [...(profile.preferredTimes || DEFAULT_PREFERRED_TIMES)],
    dailyMinutes: Number(profile.dailyMinutes) || 90,
    sessionMinutes: Number(profile.sessionMinutes) || 45,
    schoolEnd: profile.schoolEnd || '15:00',
    tutorDays: [...(profile.tutorDays || [])].map(Number),
    tutorTime: profile.tutorTime || '17:00',
    sleepStart: profile.sleepStart || '23:00',
    bufferDay: Number(profile.bufferDay) || 7,
    miniMocks: Boolean(profile.miniMocks),
    spacedReview: Boolean(profile.spacedReview)
  };
}

function icon(name, className) {
  return '<svg' + (className ? ' class="' + className + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}

function formatMinutes(minutes) {
  const value = Math.max(0, Math.round(Number(minutes) || 0));
  if (value < 60) return value + ' мин';
  const hours = Math.floor(value / 60);
  const rest = value % 60;
  return hours + ' ч' + (rest ? ' ' + rest + ' мин' : '');
}

function greeting() {
  const hour = new Date().getHours();
  if (hour < 6) return 'Доброй ночи';
  if (hour < 12) return 'Доброе утро';
  if (hour < 18) return 'Добрый день';
  return 'Добрый вечер';
}

function planIsStale(plan) {
  if (!plan || !Array.isArray(plan.sessions)) return true;
  if (Number(plan.version) !== PLAN_VERSION) return true;
  if (Number(plan.stats?.total) !== totalSelectedTopics()) return true;
  if (plan.sessions.some(session => session.topicId && !TOPIC_BY_ID[session.topicId])) return true;
  const lastWeek = lastWeekSubjects(state.profile).slice().sort().join(',');
  const plannedLastWeek = asArray(plan.lastWeekSubjects).filter(id => SUBJECTS[id]).slice().sort().join(',');
  if (lastWeek !== plannedLastWeek) return true;
  const today = toISO(new Date());
  const futureSubjects = new Set(plan.sessions.filter(session => session.date >= today).map(session => session.subject));
  if (profileSubjects().some(subjectId => examDateFor(subjectId) > today && !futureSubjects.has(subjectId))) return true;
  const blocked = lastWeekSubjects(state.profile);
  const horizon = toISO(addDays(new Date(), 7));
  if (plan.sessions.some(session => (
    session.date >= today && session.date <= horizon &&
    blocked.includes(session.subject) && session.type === 'theory'
  ))) return true;
  return false;
}

function sessionIsDone(sessionId) {
  return Boolean(state.progress.sessions?.[sessionId]?.doneAt);
}

function sessionIsMissed(session) {
  return session.date < toISO(new Date()) && !sessionIsDone(session.id);
}

function sessionsForDate(dateISO) {
  if (!state.plan) return [];
  return state.plan.sessions.filter(session => session.date === dateISO).sort((a, b) => a.start.localeCompare(b.start));
}

function nextSession() {
  if (!state.plan) return null;
  const today = toISO(new Date());
  return state.plan.sessions.find(session => session.date >= today && !sessionIsDone(session.id)) || null;
}

function overdueSessions() {
  if (!state.plan) return [];
  const today = toISO(new Date());
  return state.plan.sessions.filter(session => session.date < today && !sessionIsDone(session.id));
}

function currentFocusSession() {
  const today = toISO(new Date());
  const todaySessions = sessionsForDate(today);
  return todaySessions.find(session => !sessionIsDone(session.id)) || nextSession();
}

function sessionSubjectStyle(subjectId) {
  const subject = SUBJECTS[subjectId] || SUBJECTS.math;
  return '--subj-color:' + subject.color + ';--subj-soft:' + subject.soft + ';';
}

function primarySessionAction(session) {
  if (sessionIsDone(session.id)) return '<span class="badge mint">' + icon('check', '') + 'Выполнено</span>';
  if (session.type === 'theory') {
    return '<button class="btn btn-soft btn-sm" data-action="open-theory" data-topic="' + session.topicId + '" data-session="' + session.id + '">' + icon('bookOpen') + 'Изучить</button>';
  }
  if (session.type === 'cheatsheet') {
    return '<button class="btn btn-soft btn-sm" data-action="open-cheatsheet" data-topic="' + session.topicId + '">' + icon('bookOpen') + 'Шпаргалка</button>';
  }
  if (session.type === 'mock') {
    return '<button class="btn btn-soft btn-sm" data-action="start-mock" data-subject="' + session.subject + '" data-session="' + session.id + '">' + icon('play') + 'Пробник</button>';
  }

function sessionCheckAction(session) {

function renderCountdownCards() {

function todayTimeline(sessions) {
  const profile = state.profile;
  const day = dayNumber(new Date());
  const items = [];
  if (day <= 5) {
    items.push({ time: '08:30', title: 'Школа', note: 'до ' + (profile.schoolEnd || '15:00'), dot: '#c6cada' });
  }
  if ((profile.tutorDays || []).map(Number).includes(day)) {
    const start = profile.tutorTime || '17:00';
    items.push({ time: start, title: 'Репетитор', note: '60 минут', dot: '#f79009' });
  }
  sessions.forEach(session => {
    const subject = SUBJECTS[session.subject];
    items.push({
      time: session.start,
      title: session.topicId ? subject.short + ': ' + (TOPIC_BY_ID[session.topicId]?.title || '') : session.title,
      note: session.stage + ' · ' + session.duration + ' мин',
      dot: subject.color,
      study: true
    });
  });
  if (!items.length) {
    items.push({ time: '—', title: Number(profile.bufferDay) === day ? 'Буферный день' : 'Свободный день', note: 'Отдых тоже часть плана', dot: '#12b76a' });
  }
  return items;
}

function renderTimerInline() {
  const remaining = timerState.remaining;
  const minutes = Math.floor(remaining / 60);
  const seconds = remaining % 60;
  return '' +
    '<div class="timer-inline" title="Таймер фокуса">' + icon('clock') +
      '<b data-timer-display>' + pad(minutes) + ':' + pad(seconds) + '</b>' +
      '<button data-action="timer-toggle" aria-label="Запустить таймер">' + icon(timerState.running ? 'pause' : 'play') + '</button>' +
    '</div>';
}

function renderPaceBanner() {
  const rebalance = state.progress.rebalance;
  if (!rebalance?.reason || !rebalance.appliedAt) return '';
  const age = Math.max(0, daysBetween(new Date(), parseISO(String(rebalance.appliedAt).slice(0, 10))));
  if (age > 21) return '';
  if (rebalance.reason === 'time' || rebalance.reason === 'tired') {
    const text = rebalance.reason === 'time'
      ? 'После пропусков выбран более бережный темп: ' + formatMinutes(state.profile?.dailyMinutes || 90) + ' в день. Регулярность сейчас важнее объёма.'
      : 'После усталости темп снижен до ' + formatMinutes(state.profile?.dailyMinutes || 90) + ' в день, а повторение включено. Это забота, а не отставание.';
    return '<div class="pace-banner">' + icon('compass') + '<span>' + escapeHTML(text) + '</span><button class="btn btn-ghost btn-sm" data-action="reset-pace">Вернуть прежний темп</button></div>';
  }
  if (rebalance.reason === 'topic') {
    const topic = TOPIC_BY_ID[rebalance.focusTopicId];
    if (!topic) return '';
    const theoryFirst = !state.progress.topics[topic.id]?.theory;
    return '<div class="pace-banner">' + icon('bookOpen') + '<span>Фокус на теме «' + escapeHTML(topic.title) + '»: ' + (theoryFirst ? 'сначала короткая теория' : 'закрепим практикой') + ', без спешки.</span><button class="btn btn-soft btn-sm" data-action="' + (theoryFirst ? 'open-theory' : 'start-practice') + '" data-topic="' + topic.id + '">' + (theoryFirst ? 'Открыть теорию' : 'К практике') + '</button><button class="btn btn-ghost btn-sm" data-action="reset-pace">Снять фокус</button></div>';
  }
  return '';
}

function renderTargetCard() {
  const subjects = profileSubjects();
  if (!subjects.length) return '';
  if (!strategySubject || !subjects.includes(strategySubject)) strategySubject = subjects.find(id => !SUBJECTS[id].isEssay) || subjects[0];
  const analysis = targetAnalysis(strategySubject);
  if (!analysis) return '';
  const overview = targetOverview();
  const tabs = subjects.map(id => {
    const target = Number(state.profile?.targets?.[id] || (SUBJECTS[id].isEssay ? 5 : 80));
    return '<button class="strategy-tab' + (id === strategySubject ? ' active' : '') + '" data-action="strategy-subject" data-subject="' + id + '"><span class="dot" style="background:' + SUBJECTS[id].color + '"></span>' + SUBJECTS[id].short + ' · ' + (SUBJECTS[id].isEssay ? 'допуск' : target) + '</button>';
  }).join('');
  const scoreLabel = analysis.isEssay ? (analysis.ready ? 'зачёт' : analysis.doneTopics + '/' + analysis.totalTopics) : analysis.score;
  const targetLabel = analysis.isEssay ? 'допуск' : analysis.target;
  const trackPercent = analysis.isEssay ? Math.round(analysis.doneTopics / Math.max(1, analysis.totalTopics) * 100) : analysis.score;
  const critical = analysis.criticalTasks.slice(0, 3).map(task => '<span class="critical-chip">' + icon('zap') + escapeHTML(task) + '</span>').join('');

      '<div class="strategy-head"><div><h3>Цель и обратный отсчёт</h3><p>Введите желаемый балл — покажем, какие темы закрыть и с каким темпом.</p></div><button class="btn btn-secondary btn-sm" data-action="open-target" data-subject="' + strategySubject + '">' + icon('target') + 'Изменить цель</button></div>' +
      '<div class="strategy-tabs">' + tabs + '</div>' +
      '<div class="target-main">' +
        '<div class="target-main-copy">' +
          '<small>Цель по ' + escapeHTML(subjectDative(strategySubject)) + '</small>' +
          '<div class="target-score-line"><b>' + targetLabel + '</b><span>' + (analysis.isEssay ? 'допуск' : 'баллов') + '</span><i class="target-arrow">→</i><b style="color:#9ef0c6">' + scoreLabel + '</b><span>прогноз</span></div>' +
          '<div style="font-size:9.5px;color:rgba(255,255,255,.55);margin-top:5px">' + (analysis.isEssay ? 'Осталось этапов: ' + analysis.remainingTopics.length : 'До экзамена: ' + daysLabel(analysis.daysLeft)) + (overview.gap ? ' · общий разрыв по целям: ' + overview.gap + ' б.' : '') + '</div>' +
        '</div>' +
        '<button class="btn btn-sm" data-action="open-target" data-subject="' + strategySubject + '">' + icon('settings') + 'Настроить</button>' +
      '</div>' +
      '<div class="target-sentence' + (analysis.ready ? ' calm' : '') + '"><b>' + (analysis.ready ? 'Цель в прогнозе.' : 'План под цель.') + '</b> ' + escapeHTML(analysis.sentence) + '</div>' +
      '<div class="target-stat-row">' +
        '<div class="target-stat"><small>Осталось тем</small><b>' + analysis.remainingTopics.length + '</b></div>' +
        '<div class="target-stat"><small>Критичных тем</small><b>' + (analysis.neededTopics.length || '—') + '</b></div>' +
        '<div class="target-stat"><small>Темп к цели</small><b>' + (analysis.ready ? 'в графике' : '+' + formatPace(analysis.deltaPerWeek) + '/нед') + '</b></div>' +
      '</div>' +
      '<div class="target-track"><span style="width:' + clamp(trackPercent, 0, 100) + '%"></span></div>' +
      '<div class="target-goal-mark"><span>сейчас ' + (analysis.isEssay ? analysis.doneTopics + ' этапов' : analysis.score + ' б.') + '</span><span>цель ' + targetLabel + (analysis.isEssay ? '' : ' б.') + '</span></div>' +
      (critical ? '<div class="target-critical"><div class="target-critical-label">Критичные задания</div><div class="critical-chips">' + critical + '</div></div>' : '') +
      '<div class="strategy-note">' + icon('info') + '<span>' + (analysis.isEssay ? 'Допуск важнее идеального текста. Сначала критерии 1–2 и аргумент.' : 'Дедлайн цели — ' + formatDateShort(analysis.deadline) + ', за 2 недели до экзамена. Это оставляет время на повторение.') + '</span></div>' +
    '</section>';
}

function renderStrategicMinimumCard(subjectId) {
  const minimum = strategicMinimum(subjectId);
  const subject = SUBJECTS[subjectId];
  if (!minimum || !subject) return '';
  const mandatory = minimum.mandatory.slice(0, 9).map(item => '<span class="root-node' + (isTopicDone(item.topic.id) ? ' done' : ' weak') + '">' + icon(isTopicDone(item.topic.id) ? 'check' : 'target') + escapeHTML(item.topic.title) + '</span>').join('');
  const bonus = minimum.bonus.slice(0, 6).map(item => '<span class="root-node">' + escapeHTML(item.topic.title) + '</span>').join('');
  const skipped = minimum.skipped.slice(0, 5).map(item => escapeHTML(item.topic.examTasks)).join(', ');
  return '' +
    '<section class="card pad strategy-card" style="margin-bottom:16px">' +
      '<div class="strategy-head"><div><h3>Стратегический минимум для ' + minimum.target + ' ' + (subject.isEssay ? 'этапов' : 'баллов') + '</h3><p>Эти темы дают около 80% цели. Их достаточно, чтобы не распыляться.</p></div><span class="badge ' + (minimum.completion >= 0.8 ? 'mint' : 'brand') + '">' + Math.round(minimum.completion * 100) + '% минимума</span></div>' +
      '<div class="target-track" style="margin-top:0;margin-bottom:12px"><span style="width:' + Math.round(minimum.completion * 100) + '%"></span></div>' +
      '<div class="target-critical-label">Обязательные темы · ~' + Math.round(minimum.mandatoryPoints) + ' из ' + minimum.target + (subject.isEssay ? ' этапов' : ' б.') + '</div>' +
      '<div class="critical-chips" style="gap:6px">' + mandatory + '</div>' +
      (bonus ? '<div class="target-critical"><div class="target-critical-label">Бонусные темы для запаса</div><div class="critical-chips">' + bonus + '</div></div>' : '') +
      '<div class="target-sentence calm" style="margin-top:12px"><b>Можно не брать всё.</b> ' + escapeHTML(minimum.skipNote) + (skipped ? ' Например: ' + skipped + '.' : '') + '</div>' +
      '<div class="strategy-note">' + icon('lightbulb') + '<span>Баллы по темам — ориентир по весам КИМ, а не официальная шкала. Стратегия снижает тревогу: у цели есть конечный список.</span></div>' +
    '</section>';
}

function renderBackwardCard(subjectId) {
  const targetId = subjectId || nearestExam()?.id || profileSubjects()[0];
  if (!targetId || !SUBJECTS[targetId]) return '';
  const milestones = backwardMilestones(targetId);
  if (!milestones.length) return '';
  const labels = { done: 'готово', overdue: 'просрочено', soon: 'скоро', review: 'режим недели', upcoming: 'впереди' };
  return '' +
    '<section class="card pad strategy-card">' +
      '<div class="strategy-head"><div><h3>Обратный план от экзамена</h3><p>Конкретные дедлайны для «' + escapeHTML(SUBJECTS[targetId].short) + '». Не «когда-нибудь», а к дате.</p></div><span class="badge brand">' + daysLabel(daysToExam(targetId)) + '</span></div>' +
      '<div class="milestone-list">' + milestones.map(milestone => {
        const date = parseISO(milestone.date);
        const topicChips = milestone.topics.slice(0, 6).map(topic => '<span class="' + (isTopicDone(topic.id) ? 'done' : '') + '">' + escapeHTML(topic.title) + '</span>').join('');
        return '' +
          '<div class="milestone ' + milestone.status + '">' +
            '<div class="milestone-date"><b>' + date.getDate() + '</b><small>' + formatDate(milestone.date, { month: 'short' }) + '</small></div>' +
            '<div class="milestone-body"><b>' + escapeHTML(milestone.title) + '</b><small>' + escapeHTML(milestone.note) + ' · ' + milestone.dateLabel + '</small>' +
              (milestone.progress < 100 ? '<div class="milestone-progress"><span style="width:' + milestone.progress + '%"></span></div>' : '') +
              (topicChips ? '<details class="milestone-details"><summary>Темы к этому сроку</summary><div class="milestone-topics">' + topicChips + '</div></details>' : '') +
            '</div>' +
            '<span class="milestone-status">' + labels[milestone.status] + '</span>' +
          '</div>';
      }).join('') + '</div>' +
      '<div class="strategy-note">' + icon('compass') + '<span>Если дедлайн уже прошёл, план не рушится: он пересчитает оставшиеся шаги от сегодняшнего прогресса.</span></div>' +
    '</section>';
}

function renderDependencyCard(subjectId) {
  const targetTopic = weakestTopicForSubject(subjectId);
  if (!targetTopic) return '';
  const info = dependencyInfoForTopic(targetTopic.id);
  if (!info) return '';
  const root = info.root;
  const chain = info.chain.map((topic, index) => {
    const className = isTopicDone(topic.id) ? 'done' : root?.id === topic.id ? 'root' : 'weak';
    return (index ? '<span class="root-arrow">→</span>' : '') + '<span class="root-node ' + className + '">' + escapeHTML(topic.title) + '</span>';
  }).join('');
  const map = dependencyMapForSubject(subjectId).map(item => {
    const master = Math.round(topicMasteryValue(item.topic) * 100);
    const weak = !isTopicDone(item.topic.id) && master < 50;
    return '<div class="dep-node' + (isTopicDone(item.topic.id) ? ' done' : weak ? ' weak' : '') + '">' +
      '<span class="dep-indent">' + (item.depth ? '↳' : '•') + '</span><span class="dep-dot"></span><span class="dep-title">' + escapeHTML(item.topic.title) + '</span><span class="dep-meta">' + master + '% · вес ' + item.topic.weight + '</span>' +
    '</div>';
  }).join('');
  const rootText = root
    ? root.id === targetTopic.id
      ? 'Корень пробела — сама тема «' + root.title + '». Начните с теории и 2–3 простых заданий, не с пробника.'
      : 'Корень пробела — «' + root.title + '». Без неё тема «' + targetTopic.title + '» будет даваться тяжелее: сначала закройте базу.'
    : 'Все ключевые темы цепочки закрыты. Можно переходить к точности и скорости.';
  return '' +
    '<section class="card pad strategy-card" style="margin-bottom:16px">' +
      '<div class="strategy-head"><div><h3>Диагностика корневой причины</h3><p>Почему слабая тема проседает — с учётом зависимостей.</p></div><span class="badge ' + (root ? 'brand' : 'mint') + '">' + (root ? 'есть пробел' : 'база закрыта') + '</span></div>' +
      '<div class="root-cause' + (root ? '' : ' ok') + '">' +
        '<div class="root-cause-head">' + icon(root ? 'alert' : 'checkCircle') + (root ? 'Слабое звено: ' + escapeHTML(targetTopic.title) : 'Корневых пробелов нет') + '</div>' +
        '<p>' + escapeHTML(rootText) + '</p>' +
        '<div class="root-chain">' + chain + '</div>' +
      '</div>' +
      '<div class="dependency-map">' + map + '</div>' +
      '<div class="strategy-note">' + icon('layers') + '<span>Карта показывает порядок зависимостей: темы с отступом опираются на темы выше. Это не жёсткий запрет, а подсказка, где искать причину.</span></div>' +
    '</section>';
}

function renderPseCard(subjectId) {
  const available = profileSubjects();
  if (!available.length) return '';
  if (subjectId && SUBJECTS[subjectId]) pseSubject = subjectId;
  if (!pseSubject || !available.includes(pseSubject)) pseSubject = available.find(id => !SUBJECTS[id].isEssay) || available[0];
  const summary = pseForSubject(pseSubject);
  const subject = SUBJECTS[pseSubject];
  const tabs = !subjectId ? '<div class="strategy-tabs">' + available.map(id => '<button class="strategy-tab' + (id === pseSubject ? ' active' : '') + '" data-action="pse-subject" data-subject="' + id + '"><span class="dot" style="background:' + SUBJECTS[id].color + '"></span>' + SUBJECTS[id].short + '</button>').join('') + '</div>' : '';
  const weakest = summary.tasks.slice().filter(task => task.tone === 'red').concat(summary.tasks.filter(task => task.tone === 'yellow'))[0] || summary.tasks[0];

  return '' +
    '<section class="card pad strategy-card pse-card" style="margin-bottom:16px">' +
      '<div class="pse-top"><div><h3>Прогноз по каждому заданию КИМ</h3><p>Цвет — вероятность справиться. Нажмите на задание, чтобы увидеть темы, ошибки и шпаргалку.</p></div><span class="badge brand">' + icon('chart') + 'PSE · ' + escapeHTML(subject.short) + '</span></div>' +
      tabs +

function renderCelebrationRoot() {
  if (!celebrationCurrent || modal) return '';
  const item = celebrationCurrent;
  const confetti = Array.from({ length: 54 }, (_, index) => {
    const left = (index * 37 + 13) % 100;
    const duration = 2.4 + (index % 7) * 0.22;
    const delay = (index % 9) * 0.08;
    const drift = ((index % 11) - 5) * 18;
    const colors = ['#ffd38a', '#9ef0c6', '#b8b1ff', '#ff9db5', '#8fd4ff', '#ffffff'];
    const size = 6 + (index % 4) * 2;
    return '<span class="celebration-confetti" style="left:' + left + '%;width:' + size + 'px;height:' + (size + 5) + 'px;background:' + colors[index % colors.length] + ';animation-duration:' + duration.toFixed(2) + 's;animation-delay:' + delay.toFixed(2) + 's;--drift:' + drift + 'px"></span>';
  }).join('');
  return '' +
    '<div class="celebration-root" data-celebration-root>' + confetti +
      '<div class="celebration-card" role="dialog" aria-modal="true" aria-label="Новое достижение">' +
        '<div class="celebration-badge">' + icon(item.icon || 'trophy') + '</div>' +

      '</div>' +
    '</div>';
}

  targetDraftValue = Number(state.profile?.targets?.[id] || (SUBJECTS[id].isEssay ? 5 : 80));
  openModal('target');
}

function updateTargetPreview(subjectId, value) {
  const subject = SUBJECTS[subjectId];
  if (!subject || subject.isEssay) return;
  const analysis = targetAnalysis(subjectId, value);
  const minimum = strategicMinimum(subjectId, value);
  if (!analysis || !minimum) return;
  document.querySelectorAll('[data-target-bubble]').forEach(node => { node.textContent = String(value); });
  const preview = document.querySelector('[data-target-preview]');
  if (preview) {
    preview.textContent = analysis.sentence;
    preview.classList.toggle('calm', analysis.ready);
  }
  const cells = {
    now: analysis.score + ' б.',
    gap: Math.max(0, analysis.gap) + ' б.',
    mandatory: String(minimum.mandatory.length),
    pace: '+' + formatPace(analysis.deltaPerWeek) + ' / нед'
  };
  Object.entries(cells).forEach(([key, text]) => {
    const node = document.querySelector('[data-target-cell="' + key + '"]');
    if (node) node.textContent = text;
  });
  const note = document.querySelector('[data-target-note]');
  if (note) note.textContent = minimum.skipNote;
}

function saveTarget(subjectId) {
  const subject = SUBJECTS[subjectId];
  if (!subject || !state.profile) return;
  const value = subject.isEssay
    ? 5
    : clamp(Math.round(Number(targetDraftValue) || 80), 40, 100);
  state.profile.targets = state.profile.targets || {};
  state.profile.targets[subjectId] = value;
  strategySubject = subjectId;
  state.plan = generatePlan(state.profile);
  planWeekStart = startOfWeek(new Date());
  selectedPlanDate = toISO(new Date());
  targetDraftSubject = null;
  targetDraftValue = 80;
  modal = null;
  saveState();
  render();
  const analysis = targetAnalysis(subjectId);
  showToast(
    'Цель сохранена',
    subject.isEssay
      ? 'Допуск остаётся главным ориентиром. План пересобран.'
      : analysis?.sentence || 'План пересобран под новую цель.'
    ,
    'success'
  );
}

function startMicroSession(minutes) {
  const limit = Number(minutes) || 3;
  const size = limit <= 3 ? 3 : limit <= 10 ? 5 : 8;
  const weak = topWeakTopics(10).filter(topic => !isTopicDone(topic.id)).map(topic => topic.id);
  const pool = weak.length
    ? weak.flatMap(topicId => trainerQueueForTopic(topicId))
    : profileSubjects().flatMap(subjectId => allQuestionsForSubject(subjectId).map(question => question.id));
  const ids = shuffle([...new Set(pool)]).slice(0, size);
  if (!ids.length) {
    showToast('Нет заданий', 'Добавьте предметы в профиль, чтобы собрать микро-сессию.', 'warn');
    return;
  }
  startTrainer({ mode: 'micro', questionIds: ids });
  showToast('Микро-сессия', size + ' ' + pluralize(size, ['задание', 'задания', 'заданий']) + ' · примерно ' + limit + ' мин. Начните, даже если нет сил на большее.', 'info');
}

function startSurpriseExam() {
  const pool = profileSubjects().flatMap(subjectId => allQuestionsForSubject(subjectId).map(question => question.id));
  const ids = shuffle([...new Set(pool)]).slice(0, 5);
  if (!ids.length) {
    showToast('Нет заданий', 'Выберите предметы с карточками, чтобы провести внезапный экзамен.', 'warn');
    return;
  }
  startTrainer({ mode: 'surprise', questionIds: ids });
  showToast('Внезапный экзамен', '5 заданий · 30 секунд на каждое. Это тренировка устойчивости, а не оценка.', 'info');
}

function clearTrainerTimer() {
  if (trainerInterval) {
    clearInterval(trainerInterval);
    trainerInterval = null;
  }
}

function updateSurpriseTimerDOM() {
  document.querySelectorAll('[data-surprise-timer] b').forEach(node => { node.textContent = String(surpriseTimeLeft); });
  const bar = document.querySelector('[data-surprise-bar]');
  if (bar) bar.style.width = clamp(surpriseTimeLeft / 30 * 100, 0, 100) + '%';
}

function beginSurpriseTimer() {
  clearTrainerTimer();
  if (!trainer || trainer.mode !== 'surprise' || trainer.finished) return;
  surpriseTimeLeft = 30;
  updateSurpriseTimerDOM();
  trainerInterval = setInterval(() => {
    if (!trainer || trainer.finished || trainer.checked) return;
    surpriseTimeLeft = Math.max(0, surpriseTimeLeft - 1);
    updateSurpriseTimerDOM();
    if (surpriseTimeLeft <= 0) autoCheckSurprise();
  }, 1000);
}

function autoCheckSurprise() {
  if (!trainer || trainer.checked || trainer.finished) return;
  const question = QUESTION_BY_ID[trainer.queue[trainer.index]];
  if (!question) return;
  clearTrainerTimer();
  surpriseTimeLeft = 0;
  trainer.answers[trainer.index] = { qid: question.id, selected: -1, correct: false };
  trainer.selected = -1;
  trainer.checked = true;
  addMistake(question.id, -1);
  saveState();
  render();
  showToast('Время вышло', 'Задание ушло в журнал ошибок. Это просто материал для разбора, без штрафа.', 'info');
}

function openAnxietyExercise(exerciseId) {
  const exercise = ANXIETY_EXERCISE_BY_ID[exerciseId] ? exerciseId : 'breath';
  stopBreathing(false);
  breathState = { exercise, phase: '', phaseIndex: 0, remaining: 0, rounds: 0, timer: null, running: false };
  openModal('anxiety', { exercise });
}

function updateBreathingDOM() {
  const exercise = ANXIETY_EXERCISE_BY_ID[breathState.exercise] || ANXIETY_EXERCISE_BY_ID.breath;
  const phase = BREATH_PHASES[breathState.phaseIndex] || BREATH_PHASES[0];
  const orb = document.querySelector('[data-breath-orb]');
  const phaseNode = document.querySelector('[data-breath-phase]');
  const secondsNode = document.querySelector('[data-breath-seconds]');
  const roundsNode = document.querySelector('[data-breath-rounds]');
  const caption = document.querySelector('[data-breath-caption]');
  const button = document.querySelector('[data-action="breathing-toggle"]');
  if (orb) orb.dataset.phase = breathState.running ? phase.id : 'rest';
  if (phaseNode) {
    phaseNode.textContent = breathState.running ? phase.label : breathState.rounds >= 4 ? 'Готово' : 'Готовы?';
  }
  if (secondsNode) {
    secondsNode.textContent = breathState.running ? String(breathState.remaining) : breathState.rounds >= 4 ? '4 круга' : 'нажмите «Начать»';
  }
  if (roundsNode) roundsNode.textContent = String(breathState.rounds);
  if (caption) {
    caption.textContent = breathState.running
      ? phase.caption
      : breathState.rounds >= 4
        ? 'Четыре круга сделаны. Дыхание должно стать ровнее. Можно завершить упражнение.'
        : exercise.description;
  }
  if (button) {
    button.innerHTML = icon(breathState.running ? 'pause' : 'play') + (breathState.running ? 'Пауза' : breathState.rounds >= 4 ? 'Начать снова' : 'Начать дыхание');
  }
}

function beginBreathing() {
  if (breathState.timer) clearInterval(breathState.timer);
  breathState.running = true;
  breathState.phaseIndex = 0;
  breathState.remaining = BREATH_PHASES[0].seconds;
  breathState.rounds = 0;
  breatheTick();
  breathState.timer = setInterval(breatheTick, 1000);
  updateBreathingDOM();
}

function breatheTick() {
  if (!breathState.running) return;
  breathState.remaining -= 1;
  if (breathState.remaining > 0) {
    updateBreathingDOM();
    return;
  }
  if (breathState.phaseIndex < BREATH_PHASES.length - 1) {
    breathState.phaseIndex += 1;
    breathState.remaining = BREATH_PHASES[breathState.phaseIndex].seconds;
    updateBreathingDOM();
    return;
  }
  breathState.rounds += 1;
  if (breathState.rounds >= 4) {
    stopBreathing(false);
    updateBreathingDOM();
    return;
  }
  breathState.phaseIndex = 0;
  breathState.remaining = BREATH_PHASES[0].seconds;
  updateBreathingDOM();
}

function stopBreathing(renderAfter) {
  if (breathState.timer) clearInterval(breathState.timer);
  breathState.timer = null;
  breathState.running = false;
  if (renderAfter) updateBreathingDOM();
}

function toggleBreathing() {
  if (breathState.running) {
    stopBreathing(true);
    return;
  }
  beginBreathing();
}

function completeAnxiety(exerciseId) {
  const exercise = ANXIETY_EXERCISE_BY_ID[exerciseId];
  if (!exercise) return;
  stopBreathing(false);
  const anxiety = state.progress.anxiety;
  anxiety.completed[exercise.id] = toISO(new Date());
  anxiety.sessions = Number(anxiety.sessions || 0) + 1;
  anxiety.lastAt = new Date().toISOString();
  modal = null;
  saveState();
  render();
  showToast('Техника выполнена', exercise.title + ' — это забота о себе, а не потраченное время.', 'success');
}

function saveReflection() {
  const textarea = document.querySelector('[data-reflection-text]');
  const select = document.querySelector('[data-reflection-topic]');
  const text = String(textarea ? textarea.value : reflectionDraft.text || '').trim();
  const topicId = select ? select.value : reflectionDraft.topicId || '';
  if (!text) {
    if (textarea) textarea.focus();
    showToast('Пока пусто', 'Напишите одну фразу своими словами — этого достаточно.', 'info');
    return;
  }
  const today = toISO(new Date());
  const existing = todayReflection();
  const entry = {
    id: existing?.id || 'reflection-' + today,
    date: today,
    topicId: TOPIC_BY_ID[topicId] ? topicId : null,
    text: text.slice(0, 900),
    createdAt: existing?.createdAt || new Date().toISOString()
  };
  state.progress.reflections = (state.progress.reflections || [])
    .filter(item => item.date !== today)
    .concat(entry)
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(-400);
  reflectionDraft = { date: today, text: entry.text, topicId: entry.topicId || '' };
  saveState();
  render();
  showToast('Записано', 'Через месяц покажем эту мысль и то, как вы выросли.', 'success');
}

function ensureMoodDraft() {
  const today = toISO(new Date());
  if (moodDraft.date !== today) {
    const entry = moodEntryForDate(today);
    moodDraft = { date: today, level: entry?.level || 0, note: entry?.note || '' };
  }
  return moodDraft;
}

function upsertMoodEntry(level, note) {
  const today = toISO(new Date());
  const hour = new Date().getHours();
  const entry = {
    date: today,
    level: clamp(Number(level), 1, 5),
    hour,
    period: moodPeriodForHour(hour).id,
    note: String(note || '').trim().slice(0, 160),
    at: new Date().toISOString()
  };
  state.progress.mood = (state.progress.mood || [])
    .filter(item => item.date !== today)
    .concat(entry)
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(-400);
  return entry;
}

function selectMood(level) {
  const today = toISO(new Date());
  ensureMoodDraft();
  const noteInput = document.querySelector('[data-mood-note]');
  const note = noteInput ? noteInput.value : moodDraft.note;
  const existed = Boolean(moodEntryForDate(today));
  const entry = upsertMoodEntry(level, note);
  moodDraft = { date: today, level: entry.level, note: entry.note };
  saveState();
  render();
  if (!existed) showToast('Настроение отмечено', 'Дневник поможет найти ресурсные дни и время для сложных тем.', 'success');
}

function saveMood() {
  const today = toISO(new Date());
  ensureMoodDraft();
  const noteInput = document.querySelector('[data-mood-note]');
  const note = noteInput ? noteInput.value : moodDraft.note;
  if (!moodDraft.level) {
    showToast('Сначала выберите настроение', 'Нажмите на один из пяти смайликов — это займёт секунду.', 'info');
    return;
  }
  const entry = upsertMoodEntry(moodDraft.level, note);
  moodDraft = { date: today, level: entry.level, note: entry.note };
  saveState();
  render();
  showToast('Запись сохранена', 'Настроение и заметка добавлены в дневник.', 'success');
}

function applyScheduleImport(text, source) {
  const sourceId = source || scheduleSource || 'manual';
  const lessons = parseScheduleText(text, sourceId);
  if (!lessons.length) {
    showToast('Не удалось разобрать', 'Нужны строки вида «Пн 14:30–16:00 Алгебра» или «2026-11-05 10:00–11:30 Пробный».', 'warn');
    return false;
  }
  state.progress.schedule = {
    source: sourceId,
    importedAt: new Date().toISOString(),
    lessons
  };
  scheduleSource = sourceId;
  scheduleText = '';
  state.plan = generatePlan(state.profile);
  planWeekStart = startOfWeek(new Date());
  selectedPlanDate = toISO(new Date());
  saveState();
  render();
  showToast('Расписание импортировано', lessons.length + ' ' + pluralize(lessons.length, ['урок', 'урока', 'уроков']) + '. План обойдёт эти пересечения.', 'success');

}

function queueCelebration(items) {
  if (!Array.isArray(items) || !items.length) return;
  items.forEach(item => {
    if (!item || !item.id) return;
    if (celebrationCurrent?.id === item.id) return;
    if (celebrationQueue.some(entry => entry.id === item.id)) return;
    celebrationQueue.push(item);
  });
  if (!celebrationCurrent && celebrationQueue.length) celebrationCurrent = celebrationQueue.shift();
}

function startCelebrationTimer() {
  if (celebrationTimer) {
    clearTimeout(celebrationTimer);
    celebrationTimer = null;
  }
  if (!celebrationCurrent || modal) return;
  celebrationTimer = setTimeout(() => {
    celebrationTimer = null;
    advanceCelebration(true);
  }, 12000);
}

function advanceCelebration(renderAfter) {
  if (celebrationTimer) {
    clearTimeout(celebrationTimer);
    celebrationTimer = null;
  }
  celebrationCurrent = celebrationQueue.shift() || null;
  if (renderAfter) render();
}

function closeCelebration() {
  advanceCelebration(true);
}

  });
}

function planWeekLabel(start) {
  const end = addDays(start, 6);
  if (start.getMonth() === end.getMonth()) {
    return formatDate(start, { day: 'numeric' }) + '–' + formatDate(end, { day: 'numeric', month: 'long', year: 'numeric' });
  }
  return formatDate(start, { day: 'numeric', month: 'short' }) + ' — ' + formatDate(end, { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderPlanSession(session) {
  const subject = SUBJECTS[session.subject];
  const topic = session.topicId ? TOPIC_BY_ID[session.topicId] : null;
  const done = sessionIsDone(session.id);
  const missed = sessionIsMissed(session);
  return '' +
    '<div class="plan-session' + (done ? ' done' : '') + (missed ? ' missed' : '') + (session.type === 'mock' ? ' mock' : '') + '">' +
      '<div class="session-time-box"><b>' + session.start + '</b><small>' + session.end + '</small><small style="color:var(--muted-2);margin-top:4px">' + session.duration + ' мин</small></div>' +
      '<div style="min-width:0">' +
        '<div class="plan-session-top">' +
          '<span class="tag brand subject-tag" style="--subj-color:' + subject.color + ';--subj-soft:' + subject.soft + '">' + subject.short + '</span>' +
          '<span class="tag">' + session.stage + '</span>' +
          (missed ? '<span class="badge red">пропущено</span>' : '') +
          (done ? '<span class="badge mint">выполнено</span>' : '') +

        '<div class="plan-session-title">' + escapeHTML(topic ? topic.title : session.title) + '</div>' +
        '<div class="plan-session-meta">' +
          (topic ? '<span>' + (subject.isEssay ? 'Этап' : 'Часть ' + topic.part) + '</span><span>·</span><span>вес ' + topic.weight + '/5</span><span>·</span>' : '') +
          '<span>' + (session.type === 'cheatsheet' ? 'Шпаргалка и быстрое повторение' : session.type === 'theory' ? 'Разбор теории и алгоритма' : session.type === 'practice' ? 'Закрепление на заданиях' : session.type === 'review' ? 'Интервальное повторение' : 'Проверка темпа') + '</span>' +

function renderPlanSide() {
  const plan = state.plan;
  const stats = plan?.stats || { covered: 0, total: totalSelectedTopics() };
  const percent = stats.total ? Math.round(stats.covered / stats.total * 100) : 0;
  const legend = profileSubjects().map(id => {
    const count = (plan?.sessions || []).filter(session => session.subject === id && !sessionIsDone(session.id)).length;
    return '<div class="legend-item"><span class="legend-dot" style="background:' + SUBJECTS[id].color + '"></span><span>' + SUBJECTS[id].short + '</span><b>' + count + '</b></div>';
  }).join('');
  const weekRows = Array.from({ length: 7 }, (_, index) => {
    const day = addDays(planWeekStart, index);
    const iso = toISO(day);
    const sessions = sessionsForDate(iso);
    return '<div class="week-mini-row"><span class="week-mini-day">' + WEEKDAYS_SHORT[day.getDay()] + '</span><span>' + formatDateShort(iso) + '</span><b>' + sessions.length + ' ' + pluralize(sessions.length, ['шаг', 'шага', 'шагов']) + '</b></div>';
  }).join('');
  return '' +
    '<aside class="plan-side">' +
      '<div class="card plan-side-card">' +
        '<h3>Покрытие плана</h3>' +
        '<div class="coverage-line"><span>Тем в маршруте</span><b>' + stats.covered + ' / ' + stats.total + '</b></div>' +
        '<div class="coverage-track"><span style="width:' + percent + '%"></span></div>' +
        '<p class="coverage-note">' + (percent >= 100 ? 'Все темы стартового блока попали в план. Дальше — повторение и пробники.' : 'Приоритет отдан темам с большим весом и слабым местам. Если темп ниже нужного, увеличьте дневной лимит или добавьте учебный день.') + '</p>' +
        '<div class="subject-legend">' + legend + '</div>' +
      '</div>' +
      '<div class="card plan-side-card">' +
        '<h3>Буферы и ритм</h3>' +
        '<div class="buffer-note">' + icon('compass') + '<span>' + (capitalize(WEEKDAYS_FULL[Number(state.profile.bufferDay) % 7]) || 'Воскресенье') + ' — буферный день. Школа, репетитор и сон не занимаются учебой.</span></div>' +
        '<div style="margin-top:12px">' + weekRows + '</div>' +
      '</div>' +
      '<div class="card plan-side-card">' +
        '<h3>Почему такой порядок</h3>' +
        '<div class="coverage-note" style="margin-top:0">Сначала — ближайший дедлайн и слабые предметы. Внутри предмета соблюдается порядок тем, а занятия чередуются, чтобы не было перегруза одним предметом.</div>' +
      '</div>' +
    '</aside>';
}

  const profile = state.profile;

      '<button class="btn btn-secondary btn-sm" data-action="open-replan">Я выбился из плана</button>' +
    '</div>' : '') +
    '<div class="plan-toolbar">' +
      '<div class="plan-toolbar-left">' +

          '<button class="icon-btn" data-action="plan-week" data-offset="-1" aria-label="Предыдущая неделя">' + icon('chevronLeft') + '</button>' +
          '<div class="week-label">' + planWeekLabel(planWeekStart) + '</div>' +
          '<button class="icon-btn" data-action="plan-week" data-offset="1" aria-label="Следующая неделя">' + icon('chevronRight') + '</button>' +
        '</div>' +

      '</div>' +
      '<div class="plan-toolbar-right"><span class="tag">' + (plan.sessions.length) + ' ' + pluralize(plan.sessions.length, ['шаг', 'шага', 'шагов']) + ' в плане</span></div>' +
    '</div>' +
    '<div class="week-strip">' + weekDays.map(day => {
      const iso = toISO(day);
      const sessions = sessionsForDate(iso);
      const done = sessions.filter(session => sessionIsDone(session.id)).length;

      const buffer = Number(profile.bufferDay) === dayNumber(day) && !sessions.length;
      const dots = sessions.slice(0, 4).map(session => '<span class="day-dot' + (sessionIsDone(session.id) ? ' done' : '') + '" style="--subj-color:' + SUBJECTS[session.subject].color + '"></span>').join('');
      return '' +

          '<div class="day-tile-top"><span class="day-name">' + WEEKDAYS_SHORT[day.getDay()] + '</span>' + (isToday ? '<span class="day-today-label">сегодня</span>' : '') + '</div>' +
          '<span class="day-num">' + day.getDate() + '</span>' +
          '<div class="day-dots">' + dots + '</div>' +

          (sessions.length ? '<div class="day-progress"><span style="width:' + Math.round(done / sessions.length * 100) + '%"></span></div>' : '') +
        '</button>';

    '<div style="margin-top:16px">' + renderStrategicMinimumCard(strategyId) + '</div>';
}

function completeSessionInternal(sessionId, options) {
  const settings = options || {};
  const session = (state.plan?.sessions || []).find(item => item.id === sessionId);
  if (!session || sessionIsDone(sessionId)) return false;
  state.progress.sessions[sessionId] = { doneAt: new Date().toISOString() };
  if (!settings.noActivity) addActivity(session.duration, session.date);
  if (session.topicId) {
    const progress = topicProgress(session.topicId);
    if (session.type === 'theory') progress.theory = true;
    if (session.type === 'practice') progress.practice = true;
  }
  return true;
}

function markTheoryStudied(topicId, sessionId) {
  const progress = topicProgress(topicId);
  progress.theory = true;
  if (sessionId) completeSessionInternal(sessionId);
  const today = toISO(new Date());
  (state.plan?.sessions || [])
    .filter(session => session.topicId === topicId && session.type === 'theory' && session.date <= today && !sessionIsDone(session.id))
    .forEach(session => completeSessionInternal(session.id, { noActivity: true }));
  saveState();
}

function renderSubjects() {
  if (selectedSubject && SUBJECTS[selectedSubject] && profileSubjects().includes(selectedSubject)) {
    return renderSubjectDetail(selectedSubject);
  }
  const cards = profileSubjects().map(id => {
    const subject = SUBJECTS[id];
    const topics = topicsForSubject(id);
    const done = topics.filter(topic => isTopicDone(topic.id)).length;
    const percent = topics.length ? Math.round(done / topics.length * 100) : 0;
    const practiceCount = topics.reduce((sum, topic) => sum + topic.questions.length, 0);
    const sessions = (state.plan?.sessions || []).filter(session => session.subject === id).length;
    const target = state.profile.targets?.[id] || 80;
    const level = LEVEL_LABEL[state.profile.levels?.[id] || 'basic'];
    const isEssay = Boolean(subject.isEssay);
    return '' +
      '<button class="subject-card" style="' + sessionSubjectStyle(id) + '" data-action="open-subject" data-subject="' + id + '">' +
        '<div class="subject-card-top">' +
          '<div class="subject-card-title">' +
            '<span class="subject-mark">' + subject.icon + '</span>' +
            '<span><b>' + subject.name + '</b><small>' + (isEssay ? 'Допуск к ЕГЭ · уровень: ' + level.toLowerCase() : 'Цель ' + target + ' б. · уровень: ' + level.toLowerCase()) + '</small></span>' +
          '</div>' +
          '<div class="subject-card-count"><b>' + daysToExam(id) + '</b><small>' + pluralize(daysToExam(id), ['день', 'дня', 'дней']) + ' до ' + (isEssay ? 'сочинения' : 'ЕГЭ') + '</small></div>' +
        '</div>' +
        '<div class="subject-card-stats">' +
          '<div class="subject-stat"><b>' + done + ' / ' + topics.length + '</b><small>тем освоено</small></div>' +
          '<div class="subject-stat"><b>' + sessions + '</b><small>занятий в плане</small></div>' +
          '<div class="subject-stat"><b>' + practiceCount + '</b><small>заданий в банке</small></div>' +
        '</div>' +
        '<div class="subject-card-progress"><span style="width:' + percent + '%"></span></div>' +
        '<div class="subject-card-footer"><span>' + (isEssay ? 'Формат, аргументы и практика' : 'Часть 1 + ключевые темы части 2') + ' · ' + formatDateShort(examDateFor(id)) + '</span><span class="arrow">' + icon('arrowRight') + '</span></div>' +
      '</button>';
  }).join('');
  return '' +
    '<div class="page-head">' +
      '<div><h1>Предметы</h1><p>Теория, алгоритмы и практика по темам. Начинайте с тем, которые дают больше баллов.</p></div>' +
      '<div class="page-actions"><button class="btn btn-primary btn-sm" data-action="nav" data-view="trainer">' + icon('target') + 'Открыть тренажёр</button></div>' +
    '</div>' +
    '<div class="notice" style="margin-bottom:16px">' + icon('info') + '<div><b>Авторские карточки + первоисточник.</b> Внутренние задания составлены по темам кодификатора и не являются копиями ФИПИ. Официальные задания и ответы открываются в ' + externalLink(FIPI_BANK_ROOT, 'открытом банке ФИПИ') + '.</div></div>' +
    '<div class="subjects-grid">' + cards + '</div>';
}

function renderSubjectDetail(subjectId) {
  const subject = SUBJECTS[subjectId];
  const topics = topicsForSubject(subjectId);
  const done = topics.filter(topic => isTopicDone(topic.id)).length;
  const percent = topics.length ? Math.round(done / topics.length * 100) : 0;
  const target = state.profile.targets?.[subjectId] || 80;
  const level = LEVEL_LABEL[state.profile.levels?.[subjectId] || 'basic'];
  const isEssay = Boolean(subject.isEssay);
  const parts = [1, 2].map(part => {
    const partTopics = topics.filter(topic => topic.part === part);
    if (!partTopics.length) return '';
    return '' +
      '<section class="part-block">' +
        '<div class="part-head">' +
          '<span class="part-number">' + (isEssay ? '✍' : part) + '</span>' +
          '<div><b>' + (isEssay ? 'Этапы подготовки' : 'Часть ' + part) + '</b><small>' + (isEssay ? 'Формат, тезис, аргументы и проверка' : part === 1 ? 'Краткий ответ · база и разогрев' : 'Развёрнутый ответ · алгоритмы и структура') + '</small></div>' +
          '<span class="part-tag">' + (isEssay ? 'допуск к ЕГЭ' : part === 1 ? 'приоритет MVP' : 'ключевые темы') + '</span>' +
        '</div>' +
        '<div class="topics-list">' + partTopics.map(topic => {
          const progress = state.progress.topics[topic.id] || {};
          const topicDone = isTopicDone(topic.id);
          const best = Number(progress.best || 0);
          const scoreClass = best >= 80 ? ' good' : best > 0 ? ' low' : '';
          return '' +
            '<div class="topic-row' + (topicDone ? ' done' : '') + '">' +
              '<span class="topic-num">' + (topicDone ? icon('check') : topic.order) + '</span>' +
              '<div style="min-width:0">' +
                '<div class="topic-title">' + escapeHTML(topic.title) + '</div>' +
                '<div class="topic-meta">' +
                  '<span>' + topic.examTasks + '</span><span>·</span>' +
                  '<span class="weight">вес ' + topic.weight + '/5</span><span>·</span>' +
                  '<span class="status-dot' + (topicDone ? ' done' : '') + '"></span>' +
                  '<span>' + (topicDone ? 'освоено' : progress.theory ? 'теория изучена' : 'не начато') + '</span>' +
                '</div>' +
              '</div>' +
              '<span class="topic-score' + scoreClass + '">' + (Number(progress.attempts || 0) ? best + '%' : '—') + '</span>' +
              '<div class="topic-row-actions">' +
                '<button class="btn btn-secondary" data-action="open-theory" data-topic="' + topic.id + '">' + icon('bookOpen') + 'Теория</button>' +
                '<button class="btn btn-ghost" data-action="open-cheatsheet" data-topic="' + topic.id + '">' + icon('zap') + 'Шпаргалка</button>' +
                '<button class="btn btn-soft" data-action="start-practice" data-topic="' + topic.id + '">' + icon('target') + 'Практика</button>' +
              '</div>' +
            '</div>' +
            renderTopicMistakes(topic.id);
        }).join('') + '</div>' +
      '</section>';
  }).join('');
  return '' +

function trainerQueueForTopic(topicId) {
  const topic = TOPIC_BY_ID[topicId];
  return topic ? topic.questions.map(question => question.id) : [];
}

function startTrainer(config) {
  const cfg = config || {};
  let queue = cfg.questionIds ? [...cfg.questionIds] : [];
  if (!queue.length) {
    if (cfg.topicId) queue = trainerQueueForTopic(cfg.topicId);
    else if (cfg.subject && cfg.mode === 'mock') queue = allQuestionsForSubject(cfg.subject).slice(0, 8);
    else if (cfg.subject) queue = allQuestionsForSubject(cfg.subject).slice(0, 8);
    else queue = state.profile.subjects.flatMap(id => allQuestionsForSubject(id)).slice(0, 10);
  }
  queue = [...new Set(queue)].filter(id => QUESTION_BY_ID[id]);
  if (!queue.length) {
    showToast('Нет заданий', 'Для этой темы пока нет карточек.', 'warn');
    return;
  }
  clearTrainerTimer();
  stopBreathing(false);
  modal = null;
  trainer = {
    mode: cfg.mode || (cfg.topicId ? 'topic' : 'subject'),
    subject: cfg.subject || (cfg.topicId ? TOPIC_BY_ID[cfg.topicId]?.subject : null),
    topicId: cfg.topicId || null,
    originSessionId: cfg.originSessionId || null,
    queue,
    index: 0,
    selected: null,
    checked: false,
    answers: [],
    finished: false,
    startedAt: new Date().toISOString()
  };
  if (trainer.mode === 'surprise') surpriseTimeLeft = 30;
  view = 'trainer';
  render();
  if (trainer.mode === 'surprise') beginSurpriseTimer();
}
