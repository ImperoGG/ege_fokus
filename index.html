<meta name="theme-color" content="#5146e5">
<script>
(function () {
  try {
    var stored = localStorage.getItem('fokus_theme_v1');
    var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var style = localStorage.getItem('fokus_style_v1');
    document.documentElement.dataset.style = (style === 'paper' || style === 'nocturne') ? style : 'classic';
  } catch (error) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
