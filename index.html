<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5146e5">
<script>
(function () {
  try {
    var stored = localStorage.getItem('fokus_theme_v1');
    var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (error) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
<title>Фокус — подготовка к ЕГЭ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#f8f9fd;
  --ink:#111527;
  --ink-2:#353b52;
  --muted:#6d7489;
  --muted-2:#9299ad;
  --line:#e7eaf3;
  --line-2:#eff1f7;
  --brand:#5146e5;
  --brand-dark:#3e34c9;
  --brand-soft:#eeecff;
  --brand-soft-2:#f5f3ff;
  --mint:#12b76a;
  --mint-soft:#e7f8f0;
  --orange:#f79009;
  --orange-soft:#fff4e5;
  --red:#f04438;
  --red-soft:#feeceb;
  --blue:#2e90fa;
  --blue-soft:#eaf4ff;
  --radius-xl:28px;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:12px;
  --shadow:0 12px 40px rgba(31,36,68,.06);
  --shadow-lg:0 24px 80px rgba(31,36,68,.14);
  --font:'Manrope','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
::selection{background:#cfcaff;color:#231d73}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d5d9e6;border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:#bcc2d4}
:focus-visible{outline:3px solid rgba(81,70,229,.32);outline-offset:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pulseSoft{0%,100%{box-shadow:0 0 0 0 rgba(81,70,229,.2)}50%{box-shadow:0 0 0 8px rgba(81,70,229,0)}}
.fade-up{animation:fadeUp .35s ease both}

.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.03em}
.brand-mark{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,#6d62ff,#453ad0);color:#fff;
  box-shadow:0 8px 20px rgba(81,70,229,.28);flex:none;
}
.brand-mark svg{width:22px;height:22px}
.brand-name{font-size:19px;line-height:1}
.brand-name small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 18px;border-radius:13px;font-size:14px;font-weight:750;
  transition:transform .15s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;
  white-space:nowrap;
}
.btn svg{width:18px;height:18px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{
  background:linear-gradient(135deg,#6156f0,#4b40dd);color:#fff;
  box-shadow:0 10px 24px rgba(81,70,229,.24);
}
.btn-primary:hover{box-shadow:0 14px 28px rgba(81,70,229,.3)}
.btn-secondary{background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:0 2px 6px rgba(31,36,68,.03)}
.btn-secondary:hover{border-color:#cfd4e3;background:#fcfcff}
.btn-soft{background:var(--brand-soft);color:var(--brand);}
.btn-soft:hover{background:#e5e2ff}
.btn-ghost{color:var(--muted);}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-sm{height:34px;padding:0 12px;border-radius:10px;font-size:12.5px;gap:6px}
.btn-sm svg{width:15px;height:15px}
.btn-lg{height:52px;padding:0 24px;border-radius:15px;font-size:15px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);
  border:1px solid transparent;transition:.15s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.icon-btn svg{width:19px;height:19px}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:0 2px 12px rgba(31,36,68,.025);
}
.pad{padding:24px}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--brand);
}
.eyebrow.muted{color:var(--muted)}
h1,h2,h3,h4{letter-spacing:-.03em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}

.onboarding{
  min-height:100vh;padding:22px;display:grid;grid-template-columns:minmax(380px,43%) 1fr;
  gap:20px;background:
    radial-gradient(circle at 8% 8%,rgba(81,70,229,.08),transparent 28%),
    radial-gradient(circle at 92% 92%,rgba(18,183,106,.07),transparent 24%),
    #f4f6fb;
}
.ob-aside{
  position:relative;overflow:hidden;border-radius:32px;padding:46px;
  background:linear-gradient(150deg,#18143d 0%,#2d2477 44%,#5146e5 100%);
  color:#fff;display:flex;flex-direction:column;min-height:calc(100vh - 44px);
}
.ob-aside:before,.ob-aside:after{
  content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.13);pointer-events:none;
}
.ob-aside:before{width:620px;height:620px;right:-260px;top:-250px}
.ob-aside:after{width:440px;height:440px;right:-90px;top:140px;border-color:rgba(255,255,255,.08)}
.ob-aside .brand{position:relative;z-index:1;margin-bottom:auto}
.ob-aside .brand-name{color:#fff}
.ob-aside .brand-name small{color:rgba(255,255,255,.48)}
.ob-aside .brand-mark{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);backdrop-filter:blur(8px)}
.ob-aside-inner{position:relative;z-index:1;padding:70px 0 36px}
.ob-aside h1{font-size:clamp(32px,3.1vw,48px);line-height:1.04;letter-spacing:-.05em;max-width:540px}
.ob-aside h1 span{color:#c7c2ff}
.ob-aside p{color:rgba(255,255,255,.66);font-size:15px;line-height:1.65;max-width:480px;margin-top:20px}
.ob-preview{
  margin-top:34px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);
  border-radius:22px;padding:18px;backdrop-filter:blur(12px);max-width:490px;
}
.ob-preview-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.5);margin-bottom:13px}
.ob-preview-head span:last-child{color:#a9a2ff}
.ob-mini-session{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 13px;margin-top:8px}
.ob-mini-session .mini-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-weight:800;font-size:13px;flex:none}
.ob-mini-session b{display:block;font-size:12.5px;font-weight:700}
.ob-mini-session small{display:block;font-size:10.5px;color:rgba(255,255,255,.48);margin-top:2px}
.ob-mini-session .mini-time{margin-left:auto;font-size:10.5px;color:rgba(255,255,255,.6);font-weight:700;white-space:nowrap}
.ob-points{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;position:relative;z-index:1}
.ob-point{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:650;color:rgba(255,255,255,.72);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);padding:7px 11px;border-radius:20px}
.ob-point svg{width:13px;height:13px;color:#8ee8bd}

.ob-card{
  background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);border-radius:32px;
  box-shadow:0 30px 90px rgba(37,41,80,.08);display:flex;flex-direction:column;
  min-height:calc(100vh - 44px);overflow:hidden;backdrop-filter:blur(10px);
}
.ob-head{padding:32px 44px 0;display:flex;align-items:center;justify-content:space-between;gap:20px}
.ob-progress{display:flex;align-items:center;gap:10px;flex:1;max-width:380px}
.ob-progress-track{height:6px;border-radius:20px;background:#eceef6;flex:1;overflow:hidden}
.ob-progress-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,#7a70ff,#5146e5);transition:width .35s ease}
.ob-step-count{font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.ob-close{font-size:12px;font-weight:700;color:var(--muted);padding:8px 12px;border-radius:10px}
.ob-close:hover{background:var(--surface-2);color:var(--ink)}
.ob-head-actions{display:flex;align-items:center;gap:4px}
.ob-head-actions .icon-btn{width:34px;height:34px;border-radius:10px}
.ob-body{padding:42px 44px 20px;flex:1;overflow-y:auto;animation:fadeUp .3s ease both}
.ob-body h2{font-size:clamp(26px,2.4vw,36px);line-height:1.08;letter-spacing:-.04em;margin:11px 0 10px}
.ob-sub{color:var(--muted);font-size:14px;line-height:1.6;max-width:620px}
.ob-field{margin-top:28px}
.ob-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ob-label span{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:650;font-size:12px}
.text-input,.select-input{
  width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;
  padding:0 15px;font-size:14px;font-weight:600;transition:.15s;
}
.text-input:hover,.select-input:hover{border-color:#cfd4e3}
.text-input:focus,.select-input:focus{outline:none;border-color:#8b83ee;box-shadow:0 0 0 4px rgba(81,70,229,.09)}
.text-input::placeholder{color:#adb3c4;font-weight:500}
.ob-name-row{display:grid;grid-template-columns:1fr 200px;gap:14px;align-items:end}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.choice-card{
  position:relative;display:flex;align-items:center;gap:14px;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:17px;
  transition:.16s ease;min-height:84px;
}
.choice-card:hover{border-color:#c9c5f5;transform:translateY(-1px);box-shadow:0 10px 24px rgba(37,41,80,.05)}
.choice-card.selected{border-color:var(--brand);background:linear-gradient(135deg,#f7f6ff,#f0eeff);box-shadow:0 0 0 3px rgba(81,70,229,.07)}
.choice-card .check-dot{
  position:absolute;right:12px;top:12px;width:20px;height:20px;border-radius:50%;
  border:1.5px solid #d6dae7;background:#fff;display:grid;place-items:center;transition:.15s;
}
.choice-card .check-dot svg{width:11px;height:11px;color:#fff;opacity:0}
.choice-card.selected .check-dot{border-color:var(--brand);background:var(--brand)}
.choice-card.selected .check-dot svg{opacity:1}
.subject-mark{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;
  font-size:17px;font-weight:800;letter-spacing:-.04em;
  background:var(--subj-soft,#eef0ff);color:var(--subj-color,#5146e5);
}
.choice-card b{display:block;font-size:13.5px;letter-spacing:-.01em}
.choice-card small{display:block;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.choice-card .choice-spacer{width:20px}

.goal-list{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.goal-row{
  border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:#fff;
  display:grid;grid-template-columns:minmax(180px,1fr) minmax(170px,1.2fr) auto;gap:20px;align-items:center;
}
.goal-subject{display:flex;align-items:center;gap:12px;min-width:0}
.goal-subject b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-subject small{font-size:10.5px;color:var(--muted);display:block;margin-top:3px}
.goal-range{display:flex;align-items:center;gap:12px}
.goal-range input{flex:1;accent-color:var(--brand);height:4px}
.goal-value{width:58px;text-align:center;background:var(--surface-2);border-radius:9px;padding:6px 4px;font-size:12px;font-weight:800}
.level-seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px}
.level-seg button{font-size:10.5px;font-weight:700;color:var(--muted);padding:7px 9px;border-radius:8px;transition:.15s;white-space:nowrap}
.level-seg button:hover{color:var(--ink)}
.level-seg button.active{background:#fff;color:var(--ink);box-shadow:0 2px 7px rgba(31,36,68,.09)}
.level-hint{font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;line-height:1.5;background:var(--surface-2);border-radius:12px;padding:11px 13px;margin-top:14px}
.level-hint svg{width:14px;height:14px;color:var(--brand);margin-top:1px}

.range-wrap{display:flex;align-items:center;gap:14px}
.range-wrap input[type=range]{flex:1;accent-color:var(--brand);height:5px}
.range-bubble{min-width:92px;text-align:center;background:var(--brand-soft);color:var(--brand);border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:800;white-space:nowrap}
.seg-chips{display:flex;flex-wrap:wrap;gap:7px}
.seg-chip,.day-chip,.time-chip{
  height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:11.5px;font-weight:750;color:var(--muted);transition:.15s;
}
.seg-chip:hover,.day-chip:hover,.time-chip:hover{border-color:#c9c5f5;color:var(--ink)}
.seg-chip.active,.day-chip.active,.time-chip.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 5px 12px rgba(81,70,229,.2)}
.day-chips{display:flex;gap:6px;flex-wrap:wrap}
.day-chip{width:44px;padding:0;display:grid;place-items:center}
.time-chips{display:flex;gap:7px;flex-wrap:wrap}
.time-chip{font-variant-numeric:tabular-nums}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.form-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--ink-2);margin-bottom:8px}
.form-hint{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:6px}
.week-load-preview{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px}
.week-load-preview b{font-size:14px}
.week-load-dots{display:flex;gap:4px}
.week-load-dot{width:24px;height:7px;border-radius:8px;background:#e2e5ef}
.week-load-dot.on{background:linear-gradient(90deg,#7a70ff,#5146e5)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:13px;font-size:11.5px;line-height:1.55;color:var(--ink-2);background:var(--brand-soft-2);border:1px solid #e7e3ff}
.notice svg{width:15px;height:15px;color:var(--brand);margin-top:1px}
.notice.orange{background:var(--orange-soft);border-color:#ffe5bf}
.notice.orange svg{color:var(--orange)}
.notice.red{background:var(--red-soft);border-color:#ffd6d2}
.notice.red svg{color:var(--red)}
.support-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.support-card{border:1.5px solid var(--line);border-radius:17px;padding:16px;background:#fff;display:flex;gap:12px;align-items:flex-start;transition:.15s}
.support-card:hover{border-color:#c9c5f5}
.support-card.selected{border-color:var(--brand);background:var(--brand-soft-2)}
.support-check{width:19px;height:19px;border-radius:6px;border:1.5px solid #d3d8e5;background:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.support-check svg{width:12px;height:12px;color:#fff;opacity:0}
.support-card.selected .support-check{background:var(--brand);border-color:var(--brand)}
.support-card.selected .support-check svg{opacity:1}
.support-card b{display:block;font-size:12px;line-height:1.3}
.support-card small{display:block;font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:4px}
.summary-card{border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:24px;background:linear-gradient(160deg,#fbfbff,#f5f5ff)}
.summary-top{display:flex;gap:14px;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid #e8e6fa;margin-bottom:18px}
.summary-top b{font-size:18px;letter-spacing:-.03em}
.summary-top small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.summary-ring{width:76px;height:76px;position:relative;flex:none}
.summary-ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.summary-ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.summary-item{background:rgba(255,255,255,.75);border:1px solid #ecebfa;border-radius:12px;padding:12px 13px}
.summary-item small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--muted);margin-bottom:5px}
.summary-item b{font-size:12.5px;line-height:1.4}
.summary-subjects{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.mini-subject{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e9e8f7;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:700;color:var(--ink-2)}
.mini-dot{width:7px;height:7px;border-radius:50%;background:var(--dot,#5146e5)}
.ob-footer{
  padding:20px 44px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-top:1px solid var(--line-2);background:rgba(255,255,255,.7);
}
.ob-footer-meta{font-size:11px;color:var(--muted);line-height:1.45;max-width:340px}
.ob-footer-actions{display:flex;gap:10px}

.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);
  padding:24px 15px 18px;display:flex;flex-direction:column;z-index:20;
}
.sidebar .brand{padding:0 8px 0 10px;margin-bottom:30px}
.sidebar .brand-mark{width:38px;height:38px}
.sidebar .brand-name{font-size:18px}
.nav-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:var(--muted-2);padding:0 13px;margin:0 0 9px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav + .nav-label{margin-top:24px}
.nav-item{
  display:flex;align-items:center;gap:11px;height:42px;padding:0 13px;border-radius:11px;
  font-size:12.5px;font-weight:700;color:var(--muted);transition:.15s;position:relative;
}
.nav-item svg{width:19px;height:19px;stroke-width:1.9}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:linear-gradient(135deg,#f0eeff,#eaE7ff);color:var(--brand)}
.nav-item.active:before{content:"";position:absolute;left:-15px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-badge{margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:8px;display:grid;place-items:center;background:var(--red);color:#fff;font-size:9.5px;font-weight:800}
.sidebar-bottom{margin-top:auto;padding-top:18px}
.mini-profile{
  display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line-2);
  border-radius:14px;background:var(--surface-2);
}
.avatar{
  width:37px;height:37px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#dcd8ff,#c7c1ff);color:#352ba8;font-size:13px;font-weight:800;
}
.mini-profile b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.mini-profile small{display:block;font-size:9.5px;color:var(--muted);margin-top:3px}
.sidebar-note{font-size:9.5px;color:var(--muted-2);line-height:1.5;padding:14px 8px 0}
.main-wrap{min-width:0;display:flex;flex-direction:column}
.topbar{
  height:74px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;
  border-bottom:1px solid rgba(231,234,243,.8);background:rgba(244,246,251,.75);
  backdrop-filter:blur(14px);position:sticky;top:0;z-index:15;
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar h1{font-size:19px;letter-spacing:-.03em;white-space:nowrap}
.topbar-date{font-size:10.5px;color:var(--muted);padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px}
.countdown-pill{
  display:flex;align-items:center;gap:9px;height:40px;padding:0 13px;border-radius:12px;
  background:#fff;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink-2);
}
.countdown-pill .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px var(--orange-soft)}
.countdown-pill b{font-size:12.5px;color:var(--ink)}
.streak-pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--ink-2)}
.streak-pill svg{width:16px;height:16px;color:#f79009}
.content{padding:28px 32px 60px;max-width:1540px;width:100%;margin:0 auto;animation:fadeIn .2s ease both}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;margin-bottom:22px}
.page-head h1{font-size:clamp(25px,2.4vw,34px);line-height:1.08;letter-spacing:-.045em}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:28px 0 14px}
.section-head h2{font-size:17px;letter-spacing:-.03em}
.section-head p{font-size:11px;color:var(--muted);margin-top:3px}
.section-link{font-size:11px;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:4px}
.section-link svg{width:14px;height:14px}
.section-link:hover{color:var(--brand-dark)}

.hero{
  position:relative;overflow:hidden;border-radius:var(--radius-xl);padding:30px 34px;color:#fff;
  background:
    radial-gradient(circle at 78% 10%,rgba(160,152,255,.45),transparent 32%),
    radial-gradient(circle at 100% 100%,rgba(18,183,106,.22),transparent 30%),
    linear-gradient(125deg,#1d1845 0%,#332885 48%,#5146e5 100%);
  display:grid;grid-template-columns:1.45fr .8fr;gap:24px;min-height:236px;
  box-shadow:0 22px 50px rgba(49,41,145,.18);
}
.hero:before{content:"";position:absolute;width:430px;height:430px;border:1px solid rgba(255,255,255,.11);border-radius:50%;right:-150px;top:-190px}
.hero:after{content:"";position:absolute;width:300px;height:300px;border:1px solid rgba(255,255,255,.07);border-radius:50%;right:-40px;top:-110px}
.hero-copy{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start}
.hero .eyebrow{color:#bdb7ff}
.hero h1{font-size:clamp(28px,3vw,40px);line-height:1.06;letter-spacing:-.05em;margin:12px 0 10px;max-width:620px}
.hero p{color:rgba(255,255,255,.62);font-size:12.5px;line-height:1.55;max-width:540px}
.hero-actions{display:flex;gap:9px;margin-top:auto;padding-top:20px;flex-wrap:wrap}
.hero .btn-primary{background:#fff;color:#352ba8;box-shadow:0 10px 24px rgba(0,0,0,.13)}
.hero .btn-primary:hover{background:#f5f4ff}
.hero .btn-secondary{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff;box-shadow:none;backdrop-filter:blur(8px)}
.hero .btn-secondary:hover{background:rgba(255,255,255,.16)}
.hero-side{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:12px}
.hero-focus{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:19px;
  padding:16px;width:100%;max-width:290px;backdrop-filter:blur(12px);
}
.hero-focus-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:rgba(255,255,255,.5);margin-bottom:12px}
.hero-focus-top span:last-child{color:#dedaff}
.hero-focus-row{display:flex;align-items:center;gap:11px}
.hero-focus-row .mini-subj{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.13);font-weight:800;font-size:13px;flex:none}
.hero-focus-row b{display:block;font-size:12.5px;line-height:1.3}
.hero-focus-row small{display:block;font-size:10px;color:rgba(255,255,255,.53);margin-top:3px}
.hero-focus-bottom{display:flex;align-items:center;gap:7px;margin-top:13px;font-size:10px;color:rgba(255,255,255,.66)}
.hero-focus-bottom svg{width:13px;height:13px;color:#9ef0c6}
.hero-ring{position:relative;width:88px;height:88px;flex:none}
.hero-ring svg{width:88px;height:88px;transform:rotate(-90deg)}
.hero-ring-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.hero-ring-label b{font-size:19px;line-height:1;display:block}
.hero-ring-label small{font-size:8px;color:rgba(255,255,255,.55);display:block;margin-top:2px}
.hero-focus .ring-wrap{display:flex;align-items:center;gap:14px;margin-top:2px}

.countdown-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.countdown-card{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 17px;
  position:relative;overflow:hidden;transition:.16s;
}
.countdown-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.countdown-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--subj-color,var(--brand))}
.countdown-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.countdown-subject{display:flex;align-items:center;gap:8px;min-width:0}
.countdown-subject .dot{width:8px;height:8px;border-radius:50%;background:var(--subj-color,var(--brand));flex:none}
.countdown-subject b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.countdown-top small{font-size:9px;color:var(--muted);white-space:nowrap}
.countdown-days{display:flex;align-items:baseline;gap:5px;margin-top:12px}
.countdown-days b{font-size:27px;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.countdown-days span{font-size:10px;color:var(--muted);font-weight:650}
.countdown-date{font-size:9.5px;color:var(--muted);margin-top:5px}
.countdown-bar{height:4px;border-radius:8px;background:#eef0f7;margin-top:12px;overflow:hidden}
.countdown-bar span{display:block;height:100%;border-radius:8px;background:var(--subj-color,var(--brand));transition:width .5s}

.dash-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.85fr);gap:16px;margin-top:16px}
.today-card .card-head,.advisor-card .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.card-head h3{font-size:15px;letter-spacing:-.025em}
.card-head p{font-size:10.5px;color:var(--muted);margin-top:4px}
.today-sessions{display:flex;flex-direction:column;gap:8px}
.session-row{
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:11px 12px;border:1px solid var(--line-2);border-radius:14px;background:#fbfbfe;
  transition:.15s;
}
.session-row:hover{border-color:#ddd9f7;background:#fff}
.session-row.done{opacity:.55;background:var(--surface-2)}
.session-row.done .session-row-title{text-decoration:line-through}
.session-subj{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:var(--subj-soft,#eef0ff);color:var(--subj-color,#5146e5);font-size:12.5px;font-weight:800;
}
.session-row-title{font-size:12px;font-weight:750;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-row-meta{display:flex;align-items:center;gap:7px;font-size:9.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.session-row-meta .dot{width:3px;height:3px;border-radius:50%;background:#c8cdda}
.session-row-time{font-size:9.5px;color:var(--muted);font-weight:700;text-align:right;white-space:nowrap}
.session-row-actions{display:flex;gap:5px;align-items:center}
.session-row-actions .btn{height:29px;padding:0 9px;border-radius:8px;font-size:10px}
.session-row-actions .btn svg{width:13px;height:13px}
.session-row-actions .icon-btn{width:29px;height:29px;border-radius:8px}
.session-row-actions .icon-btn svg{width:15px;height:15px}
.empty-state{padding:28px 16px;text-align:center;border:1px dashed #dfe3ee;border-radius:15px;background:#fcfcff}
.empty-state .empty-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin:0 auto 10px}
.empty-state .empty-ico svg{width:20px;height:20px}
.empty-state b{display:block;font-size:12px}
.empty-state small{display:block;font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.empty-state .btn{margin-top:12px}

.advisor-timeline{display:flex;flex-direction:column;gap:0;margin-top:4px}
.advisor-item{display:grid;grid-template-columns:52px 12px 1fr;gap:9px;min-height:42px;position:relative}
.advisor-time{font-size:9.5px;color:var(--muted);font-weight:700;padding-top:2px;text-align:right;font-variant-numeric:tabular-nums}
.advisor-line{display:flex;flex-direction:column;align-items:center}
.advisor-dot{width:7px;height:7px;border-radius:50%;background:var(--dot,#b9bdd0);margin-top:4px;flex:none;z-index:1}
.advisor-line:after{content:"";width:1px;background:#e4e7f0;flex:1;margin-top:4px}
.advisor-item:last-child .advisor-line:after{display:none}
.advisor-content{padding-bottom:12px}
.advisor-content b{font-size:10.5px;display:block}
.advisor-content small{font-size:9.5px;color:var(--muted);display:block;margin-top:2px}
.advisor-content .study-label{color:var(--brand);font-weight:800}
.advisor-foot{border-top:1px solid var(--line-2);padding-top:12px;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.advisor-foot span{font-size:9.5px;color:var(--muted)}
.timer-inline{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:5px 7px 5px 10px}
.timer-inline > svg{width:14px;height:14px;color:var(--muted)}
.timer-inline b{font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer-inline button{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.timer-inline button svg{width:12px;height:12px}

.progress-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px;margin-top:16px}
.week-bars{display:flex;align-items:flex-end;gap:8px;height:128px;padding-top:10px}
.week-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.week-bar-track{width:100%;max-width:34px;height:100%;background:var(--surface-2);border-radius:9px;display:flex;align-items:flex-end;overflow:hidden}
.week-bar-fill{width:100%;border-radius:9px;background:linear-gradient(180deg,#8e85ff,#5146e5);min-height:3px;transition:height .5s}
.week-bar.today .week-bar-fill{background:linear-gradient(180deg,#34d399,#12b76a)}
.week-bar small{font-size:8.5px;color:var(--muted);font-weight:700}
.week-bar b{font-size:8px;color:var(--muted-2);font-weight:600}
.subject-progress-list{display:flex;flex-direction:column;gap:12px}
.subject-progress-item{display:grid;grid-template-columns:1fr auto;gap:8px}
.subject-progress-item b{font-size:10.5px}
.subject-progress-item span{font-size:9.5px;color:var(--muted);font-weight:700}
.subject-progress-track{height:6px;background:#eef0f7;border-radius:8px;overflow:hidden;grid-column:1/-1}
.subject-progress-track i{display:block;height:100%;border-radius:8px;background:var(--subj-color,var(--brand))}

.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px 17px;display:flex;gap:12px;align-items:center}
.stat-icon{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--icon-bg,var(--brand-soft));color:var(--icon-color,var(--brand))}
.stat-icon svg{width:18px;height:18px}
.stat-card b{display:block;font-size:20px;letter-spacing:-.04em;line-height:1}
.stat-card small{display:block;font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.alert-banner{
  display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:15px;
  background:linear-gradient(100deg,#fff8ed,#fffdf9);border:1px solid #ffe7c2;margin-bottom:16px;
}
.alert-banner .alert-ico{width:35px;height:35px;border-radius:10px;background:#fff0d5;color:#b54708;display:grid;place-items:center;flex:none}
.alert-banner .alert-ico svg{width:17px;height:17px}
.alert-banner b{display:block;font-size:11.5px}
.alert-banner small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.alert-banner .btn{margin-left:auto;flex:none}

.plan-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.week-nav{display:flex;align-items:center;gap:6px}
.week-nav .week-label{min-width:178px;text-align:center;font-size:12.5px;font-weight:800;padding:0 6px}
.plan-toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-toolbar-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:16px}
.day-tile{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 9px;
  text-align:left;position:relative;transition:.15s;min-height:107px;
}
.day-tile:hover{border-color:#cfcbf5;transform:translateY(-1px)}
.day-tile.selected{border-color:var(--brand);box-shadow:0 0 0 3px rgba(81,70,229,.08);background:linear-gradient(180deg,#fff,#f8f7ff)}
.day-tile.today .day-num{color:var(--brand)}
.day-tile.buffer{background:repeating-linear-gradient(135deg,#fbfbfe,#fbfbfe 7px,#f7f8fc 7px,#f7f8fc 14px)}
.day-tile-top{display:flex;align-items:center;justify-content:space-between;gap:5px}
.day-name{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--muted)}
.day-num{font-size:17px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:7px;display:block}
.day-today-label{font-size:7.5px;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:2px 5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.day-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:10px}
.day-dot{width:6px;height:6px;border-radius:50%;background:var(--subj-color,var(--brand));opacity:.9}
.day-dot.done{background:var(--mint)}
.day-summary{font-size:8.5px;color:var(--muted);margin-top:9px;line-height:1.3}
.day-progress{height:3px;border-radius:4px;background:#eef0f7;margin-top:7px;overflow:hidden}
.day-progress span{display:block;height:100%;background:var(--brand);border-radius:4px}
.plan-main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.plan-day-card{padding:22px}
.plan-day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.plan-day-head h2{font-size:18px;letter-spacing:-.03em}
.plan-day-head p{font-size:10.5px;color:var(--muted);margin-top:4px}
.plan-sessions{display:flex;flex-direction:column;gap:9px}
.plan-session{
  display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:12px;align-items:center;
  border:1px solid var(--line-2);border-radius:15px;padding:13px;background:#fcfcfe;transition:.15s;
}
.plan-session:hover{border-color:#dedaf8;background:#fff;box-shadow:0 5px 18px rgba(37,41,80,.04)}
.plan-session.done{opacity:.57;background:#f7f8fc}
.plan-session.done .plan-session-title{text-decoration:line-through}
.plan-session.missed{border-color:#ffd9d5;background:#fffafa}
.plan-session.mock{background:linear-gradient(100deg,#f5f3ff,#fbfaff);border-color:#e2ddff}
.session-time-box{text-align:center;background:var(--surface-2);border-radius:10px;padding:7px 4px;border:1px solid var(--line-2)}
.session-time-box b{display:block;font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.session-time-box small{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}
.plan-session-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.plan-session-title{font-size:12.5px;font-weight:750;line-height:1.3;margin-top:3px}
.plan-session-meta{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--muted);margin-top:5px;flex-wrap:wrap}
.plan-session-actions{display:flex;align-items:center;gap:5px}
.plan-session-actions .btn{height:31px;font-size:10px;padding:0 10px;border-radius:8px}
.plan-session-actions .btn svg{width:13px;height:13px}
.plan-session-actions .icon-btn{width:31px;height:31px;border-radius:8px}
.plan-session-actions .icon-btn svg{width:15px;height:15px}
.plan-side{display:flex;flex-direction:column;gap:14px}
.plan-side-card{padding:18px}
.plan-side-card h3{font-size:12px;letter-spacing:-.01em;margin-bottom:11px}
.coverage-line{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px}
.coverage-line b{color:var(--ink);font-size:10.5px}
.coverage-track{height:7px;border-radius:7px;background:#eef0f7;overflow:hidden}
.coverage-track span{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#8b83ee,#5146e5)}
.coverage-note{font-size:9.5px;color:var(--muted);line-height:1.55;margin-top:10px}
.subject-legend{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.legend-item{display:flex;align-items:center;gap:7px;font-size:9.5px;color:var(--muted)}
.legend-dot{width:7px;height:7px;border-radius:50%;flex:none}
.legend-item b{margin-left:auto;color:var(--ink-2);font-size:9.5px}
.buffer-note{font-size:9.5px;color:var(--muted);line-height:1.5;display:flex;gap:8px;background:var(--surface-2);border-radius:11px;padding:10px}
.buffer-note svg{width:14px;height:14px;color:var(--muted);margin-top:1px}
.week-mini-row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:9.5px;color:var(--muted)}
.week-mini-row:last-child{border-bottom:0}
.week-mini-row b{margin-left:auto;color:var(--ink-2);font-size:9.5px}
.week-mini-day{width:23px;height:23px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:8.5px;font-weight:800;color:var(--ink-2)}

.subjects-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.subject-card{
  position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:22px;transition:.18s;text-align:left;
}
.subject-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d7d3f6}
.subject-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--subj-color)}
.subject-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.subject-card-title{display:flex;align-items:center;gap:13px;min-width:0}
.subject-card-title .subject-mark{width:52px;height:52px;border-radius:15px;font-size:18px}
.subject-card-title b{display:block;font-size:15px;letter-spacing:-.025em}

.subject-card-stats{display:flex;gap:18px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}

.subject-card-progress{height:6px;border-radius:8px;background:#eef0f7;margin-top:16px;overflow:hidden}

.subject-header{

  background:linear-gradient(135deg,var(--subj-soft),#fff 65%);margin-bottom:16px;
}

.subject-header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative;z-index:1;flex-wrap:wrap}
.subject-header-left{display:flex;align-items:center;gap:16px;min-width:0}
.subject-header-left .subject-mark{width:64px;height:64px;border-radius:18px;font-size:23px;background:#fff;box-shadow:0 8px 20px rgba(37,41,80,.07)}
.subject-header h1{font-size:27px;line-height:1.1;letter-spacing:-.04em}
.subject-header p{font-size:10.5px;color:var(--muted);margin-top:5px}
.subject-header-stats{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.subject-header-stat b{display:block;font-size:17px;letter-spacing:-.03em}
.subject-header-stat small{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:4px;font-weight:800}
.subject-toolbar{display:flex;align-items:center;justify-content:space-between;gap:13px;margin:18px 0 12px;flex-wrap:wrap}
.part-block{margin-bottom:18px}

.part-head small{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.part-head .part-tag{margin-left:auto;font-size:8px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;padding:4px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted)}
.topics-list{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--surface)}
.topic-row{
  display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--line-2);background:var(--surface);transition:.13s;
}
.topic-row:last-child{border-bottom:0}
.topic-row:hover{background:#fbfbfe}
.topic-num{width:29px;height:29px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--muted)}
.topic-row.done .topic-num{background:var(--mint-soft);color:var(--mint)}
.topic-title{font-size:12px;font-weight:750;line-height:1.35}
.topic-meta{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap;font-size:9px;color:var(--muted)}

.topic-row-actions{display:flex;gap:5px}
.topic-row-actions .btn{height:29px;font-size:9.5px;padding:0 9px;border-radius:8px}
.topic-row-actions .btn svg{width:12px;height:12px}
.topic-score{font-size:9px;font-weight:800;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:3px 6px;text-align:center;min-width:38px}

.topic-score.low{background:var(--orange-soft);color:#b54708}

.trainer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:17px}
.trainer-head h1{font-size:29px;letter-spacing:-.045em}
.trainer-head p{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.55;max-width:650px}
.subject-tabs{display:flex;gap:5px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:16px;width:fit-content;max-width:100%}
.subject-tab{height:34px;padding:0 13px;border-radius:8px;font-size:10.5px;font-weight:750;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}

.subject-tab:hover{color:var(--ink)}
.practice-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;flex-wrap:wrap}
.practice-toolbar p{font-size:10.5px;color:var(--muted)}
.practice-topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.practice-topic{
  display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);
  border-radius:14px;background:var(--surface);transition:.15s;text-align:left;
}

.practice-topic .subject-mark{width:38px;height:38px;border-radius:11px;font-size:12px}
.practice-topic-info{min-width:0;flex:1}
.practice-topic-info b{display:block;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.practice-topic-info small{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.practice-topic .arrow{width:27px;height:27px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);flex:none}
.practice-topic .arrow svg{width:13px;height:13px}
.practice-topic:hover .arrow{background:var(--brand-soft);color:var(--brand)}
.practice-banner{
  display:flex;align-items:center;gap:13px;border-radius:17px;padding:16px 18px;
  background:linear-gradient(100deg,#f3f1ff,#faf9ff);border:1px solid #e5e1ff;margin-bottom:16px;
}
.practice-banner .pb-ico{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--brand);flex:none;box-shadow:0 5px 14px rgba(81,70,229,.09)}
.practice-banner .pb-ico svg{width:19px;height:19px}
.practice-banner b{display:block;font-size:12px}
.practice-banner small{display:block;font-size:10px;color:var(--muted);margin-top:3px;line-height:1.5}
.practice-banner .btn{margin-left:auto;flex:none}

.quiz-shell{max-width:860px;margin:0 auto}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
.quiz-top-left{display:flex;align-items:center;gap:6px}
.quiz-top-left .btn{height:34px;font-size:10px}
.quiz-progress-text{font-size:10.5px;color:var(--muted);font-weight:700}
.quiz-progress{height:6px;background:#e8ebf3;border-radius:8px;overflow:hidden;margin-bottom:15px}
.quiz-progress span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#7c72ff,#5146e5);transition:width .3s}
.quiz-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}
.quiz-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:17px}
.quiz-qnum{width:31px;height:31px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.quiz-question{font-size:20px;line-height:1.45;letter-spacing:-.025em;font-weight:700;margin-bottom:20px;white-space:pre-line}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-option{
  display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:#fff;text-align:left;font-size:12.5px;line-height:1.45;
  transition:.14s;width:100%;
}
.quiz-option:hover{border-color:#c9c5f5;background:#fdfdff}
.option-letter{
  width:24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--muted);
  display:grid;place-items:center;font-size:10px;font-weight:800;flex:none;transition:.14s;
}
.quiz-option.selected{border-color:var(--brand);background:var(--brand-soft-2)}
.quiz-option.selected .option-letter{background:var(--brand);color:#fff}
.quiz-option.correct{border-color:var(--mint);background:#f2fdf8}
.quiz-option.correct .option-letter{background:var(--mint);color:#fff}
.quiz-option.wrong{border-color:var(--red);background:#fff7f6}
.quiz-option.wrong .option-letter{background:var(--red);color:#fff}
.quiz-option.disabled{pointer-events:none}
.quiz-option.disabled:not(.correct):not(.wrong){opacity:.62}
.quiz-explanation{margin-top:15px;border-radius:14px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line-2);animation:fadeUp .25s ease both}
.quiz-explanation.good{background:var(--mint-soft);border-color:#c9f0dc}
.quiz-explanation.bad{background:var(--red-soft);border-color:#ffd6d3}
.quiz-explanation-top{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;margin-bottom:6px}

.quiz-explanation.bad .quiz-explanation-top{color:#b42318}
.quiz-explanation-top svg{width:15px;height:15px}
.quiz-explanation p{font-size:11px;line-height:1.6;color:var(--ink-2)}
.quiz-explanation .q-source{font-size:8.5px;color:var(--muted-2);margin-top:8px;letter-spacing:.02em}
.quiz-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.quiz-footer .hint{font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.quiz-footer .hint svg{width:13px;height:13px}
.result-card{max-width:600px;margin:30px auto;text-align:center;padding:38px}
.result-orb{
  width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;
  background:conic-gradient(var(--mint) var(--score),#edf0f7 0);position:relative;
}
.result-orb:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.result-orb-inner{position:relative;z-index:1;text-align:center}
.result-orb-inner b{display:block;font-size:29px;letter-spacing:-.05em;line-height:1}
.result-orb-inner small{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.result-card h2{font-size:24px;letter-spacing:-.04em}
.result-card p{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:8px}
.result-stats{display:flex;justify-content:center;gap:28px;margin:20px 0 24px}
.result-stat b{display:block;font-size:18px;letter-spacing:-.03em}
.result-stat small{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.result-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

.mistakes-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.mistakes-list{display:flex;flex-direction:column;gap:9px}
.mistake-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px 17px}
.mistake-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mistake-q{font-size:12px;font-weight:700;line-height:1.5;margin-bottom:9px}
.mistake-answers{display:flex;gap:15px;flex-wrap:wrap;font-size:10px;margin-bottom:8px}
.mistake-answers .wrong{color:var(--red);font-weight:750}
.mistake-answers .right{color:var(--mint);font-weight:750}
.mistake-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mistake-actions .btn{height:29px;padding:0 9px;font-size:9.5px;border-radius:7px}
.mistake-actions .btn svg{width:12px;height:12px}
.mistake-count{margin-left:auto;font-size:8.5px;color:var(--muted);background:var(--surface-2);padding:4px 7px;border-radius:6px}
details.mistake-details{margin-top:7px}

details.mistake-details summary::-webkit-details-marker{display:none}
details.mistake-details p{font-size:10.5px;color:var(--ink-2);line-height:1.6;margin-top:7px;background:var(--surface-2);border-radius:10px;padding:10px 12px}

.progress-page-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:16px}
.activity-card{padding:22px}
.activity-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:6px}
.activity-head h2{font-size:16px}
.activity-head p{font-size:10px;color:var(--muted);margin-top:4px}
.activity-total{text-align:right}
.activity-total b{font-size:22px;letter-spacing:-.04em;display:block}
.activity-total small{font-size:8.5px;color:var(--muted)}
.activity-bars{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:20px}
.activity-day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.activity-bar-wrap{width:100%;max-width:28px;height:100%;background:var(--surface-2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.activity-bar{width:100%;min-height:2px;background:#c8c3ff;border-radius:8px;transition:height .4s}
.activity-day.high .activity-bar{background:linear-gradient(180deg,#8d84ff,#5146e5)}
.activity-day.today .activity-bar{background:linear-gradient(180deg,#34d399,#12b76a)}
.activity-day small{font-size:8px;color:var(--muted);font-weight:700}
.activity-day .mins{font-size:7px;color:var(--muted-2);height:9px}
.lag-list{display:flex;flex-direction:column;gap:9px}
.lag-item{display:flex;gap:10px;align-items:center;padding:10px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line-2)}
.lag-item .lag-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#fff;color:var(--orange);flex:none;border:1px solid var(--line-2)}
.lag-item .lag-ico svg{width:14px;height:14px}
.lag-item b{display:block;font-size:10.5px;line-height:1.3}
.lag-item small{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.lag-item .btn{margin-left:auto;flex:none;height:27px;font-size:9px;padding:0 8px}
.done-list{display:flex;flex-direction:column;gap:6px}
.done-item{display:flex;align-items:center;gap:9px;font-size:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.done-item:last-child{border-bottom:0}
.done-check{width:20px;height:20px;border-radius:6px;background:var(--mint-soft);color:var(--mint);display:grid;place-items:center;flex:none}
.done-check svg{width:12px;height:12px}
.done-item b{font-weight:700;line-height:1.3}
.done-item small{margin-left:auto;color:var(--muted);font-size:8.5px;white-space:nowrap}

.settings-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.7fr);gap:16px;align-items:start}
.settings-grid > *{min-width:0}
.settings-section{padding:22px;margin-bottom:14px}
.settings-section h2{font-size:15px;margin-bottom:4px}
.settings-section > p{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.settings-row:last-child{border-bottom:0;padding-bottom:0}
.settings-row:first-of-type{padding-top:0}
.settings-row b{display:block;font-size:11.5px}
.settings-row small{display:block;font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.45;max-width:440px}
.toggle{width:42px;height:24px;border-radius:20px;background:#dde1ec;position:relative;transition:.18s;flex:none;border:0;cursor:pointer}
.toggle:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.18s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.toggle.on{background:var(--brand)}
.toggle.on:after{left:21px}
.profile-summary{display:flex;flex-direction:column;gap:0}
.profile-line{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:10.5px}

.settings-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.settings-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.danger-zone{border-color:#ffdbd7;background:linear-gradient(135deg,#fffafa,#fff)}
.danger-zone h2{color:#b42318}
.mvp-note{font-size:9.5px;color:var(--muted);line-height:1.55;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:11px;margin-top:14px}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(17,21,39,.5);backdrop-filter:blur(7px);
  z-index:100;display:grid;place-items:center;padding:22px;animation:fadeIn .18s ease both;
}
.modal{
  width:100%;max-width:900px;max-height:90vh;background:var(--surface);border-radius:26px;
  box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;animation:popIn .26s ease both;
}
.modal.small{max-width:500px}
.modal-head{padding:23px 26px;display:flex;align-items:flex-start;gap:14px;border-bottom:1px solid var(--line-2)}
.modal-head h2{font-size:20px;letter-spacing:-.035em;line-height:1.2}
.modal-head p{font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.5}

.modal-body{padding:24px 26px;overflow-y:auto}

.modal-foot-actions{display:flex;gap:8px}
.theory-modal{max-width:920px}
.theory-header{
  position:relative;overflow:hidden;padding:28px 32px 26px;color:#fff;
  background:linear-gradient(135deg,var(--theory-color,#5146e5),var(--theory-color-2,#7d73ff));
}
.theory-header:before{content:"";position:absolute;width:300px;height:300px;border:1px solid rgba(255,255,255,.14);border-radius:50%;right:-100px;top:-160px}
.theory-header-top{display:flex;align-items:center;gap:9px;margin-bottom:15px;position:relative;z-index:1}
.theory-header-top .tag{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.12);color:#fff}
.theory-header-top .icon-btn{color:#fff;margin-left:auto}
.theory-header-top .icon-btn:hover{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}
.theory-header h2{font-size:28px;line-height:1.1;letter-spacing:-.045em;position:relative;z-index:1;max-width:700px}
.theory-header p{font-size:11.5px;line-height:1.6;color:rgba(255,255,255,.7);margin-top:9px;position:relative;z-index:1;max-width:700px}
.theory-header-meta{display:flex;gap:16px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.theory-header-meta span{font-size:9px;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:5px}
.theory-header-meta svg{width:12px;height:12px}
.theory-content{padding:27px 32px 32px}
.theory-block{margin-bottom:25px}
.theory-block:last-child{margin-bottom:0}
.theory-block h3{font-size:13px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-bottom:11px}
.theory-block h3 .block-ico{width:26px;height:26px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.theory-block h3 .block-ico svg{width:14px;height:14px}
.theory-block.warn h3 .block-ico{background:var(--orange-soft);color:#b54708}
.theory-block.steps h3 .block-ico{background:var(--mint-soft);color:var(--mint)}
.theory-text{font-size:12px;line-height:1.7;color:var(--ink-2)}
.theory-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.theory-list li{position:relative;padding-left:19px;font-size:11.5px;line-height:1.6;color:var(--ink-2)}
.theory-list li:before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.theory-block.warn .theory-list li:before{background:var(--orange)}
.theory-formulas{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.theory-formula{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px}
.theory-formula small{display:block;font-size:8.5px;color:var(--muted);margin-bottom:4px;line-height:1.3}
.theory-formula b{display:block;font-size:11.5px;line-height:1.45;font-weight:700;letter-spacing:.01em}
.theory-steps{list-style:none;counter-reset:step;display:flex;flex-direction:column;gap:8px}
.theory-steps li{counter-increment:step;display:flex;gap:10px;font-size:11.5px;line-height:1.55;color:var(--ink-2)}
.theory-steps li:before{content:counter(step);width:21px;height:21px;border-radius:7px;background:var(--mint-soft);color:#087443;font-size:9px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.theory-cta{background:linear-gradient(135deg,#f5f3ff,#fbfaff);border:1px solid #e7e3ff;border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-top:22px}
.theory-cta .tc-text{flex:1}
.theory-cta b{display:block;font-size:12px}
.theory-cta small{display:block;font-size:10px;color:var(--muted);margin-top:3px;line-height:1.5}
.confirm-icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--orange-soft);color:#b54708;margin-bottom:14px}
.confirm-icon svg{width:26px;height:26px}
.confirm-icon.red{background:var(--red-soft);color:var(--red)}
.modal .confirm-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.confirm-option{border:1px solid var(--line);border-radius:13px;padding:13px;font-size:11px;line-height:1.5;background:#fff;text-align:left;display:flex;gap:11px;align-items:flex-start}
.confirm-option:hover{border-color:#cbc7f7;background:#fdfdff}
.confirm-option b{display:block;font-size:11px;margin-bottom:2px}
.confirm-option small{display:block;font-size:9.5px;color:var(--muted);line-height:1.45}
.confirm-option .radio{width:17px;height:17px;border-radius:50%;border:1.5px solid #d4d9e6;flex:none;margin-top:1px}
.confirm-option.active{border-color:var(--brand);background:var(--brand-soft-2)}
.confirm-option.active .radio{border:5px solid var(--brand)}

.toast-root{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:300;pointer-events:none}
.toast{
  min-width:260px;max-width:370px;background:#151a2d;color:#fff;border-radius:13px;padding:12px 14px;
  display:flex;gap:10px;align-items:flex-start;box-shadow:0 16px 40px rgba(17,21,39,.25);
  animation:popIn .28s ease both;pointer-events:auto;font-size:11px;line-height:1.45;
}
.toast .toast-ico{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none;color:#a7f3d0}
.toast .toast-ico svg{width:13px;height:13px}
.toast.warn .toast-ico{color:#fec84b;background:rgba(254,200,75,.13)}
.toast.error .toast-ico{color:#fda29b;background:rgba(240,68,56,.16)}
.toast b{display:block;font-size:10.5px;margin-bottom:2px}
.toast small{display:block;font-size:9.5px;color:rgba(255,255,255,.6);line-height:1.4}
.toast-close{margin-left:auto;color:rgba(255,255,255,.45);padding:2px}
.toast-close:hover{color:#fff}
.toast-close svg{width:12px;height:12px}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:8.5px;font-weight:800;padding:4px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.badge svg{width:10px;height:10px;stroke-width:2.1}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.badge.mint{background:var(--mint-soft);color:#087443}
.badge.orange{background:var(--orange-soft);color:#b54708}
.badge.red{background:var(--red-soft);color:#b42318}
.badge.gray{background:var(--surface-2);color:var(--muted)}
.badge.outline{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag{display:inline-flex;align-items:center;font-size:8.5px;font-weight:750;padding:4px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.brand{background:var(--brand-soft);color:var(--brand)}
.tag.subject-tag{background:var(--subj-soft,#eef0ff);color:var(--subj-color,var(--brand))}
.tooltip{position:relative}
.tooltip:after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#151a2d;color:#fff;font-size:8.5px;padding:5px 7px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:20}
.tooltip:hover:after{opacity:1}

@media(max-width:1250px){
  .countdown-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-grid,.progress-split{grid-template-columns:1fr}
  .plan-main{grid-template-columns:minmax(0,1fr) 250px}
  .hero{grid-template-columns:1.35fr .75fr}
}
.auth-page{
  min-height:100vh;padding:22px;display:grid;grid-template-columns:minmax(420px,1.05fr) minmax(430px,.95fr);gap:20px;
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 10% 8%,rgba(81,70,229,.12),transparent 30%),
    radial-gradient(circle at 92% 92%,rgba(18,183,106,.08),transparent 26%),
    var(--bg);
}
.auth-aside{
  position:relative;overflow:hidden;border-radius:32px;padding:46px;color:#fff;
  background:
    radial-gradient(circle at 78% 8%,rgba(160,152,255,.36),transparent 30%),
    radial-gradient(circle at 100% 100%,rgba(18,183,106,.2),transparent 28%),
    linear-gradient(145deg,#18143d 0%,#2d2477 48%,#5146e5 100%);
  display:flex;flex-direction:column;min-height:calc(100vh - 44px);
}
.auth-aside:before,.auth-aside:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.12);pointer-events:none}
.auth-aside:before{width:640px;height:640px;right:-280px;top:-260px}
.auth-aside:after{width:460px;height:460px;right:-100px;top:150px;border-color:rgba(255,255,255,.07)}
.auth-aside .brand{position:relative;z-index:1}
.auth-aside .brand-name{color:#fff}
.auth-aside .brand-name small{color:rgba(255,255,255,.46)}
.auth-aside .brand-mark{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);backdrop-filter:blur(8px)}
.auth-aside-inner{position:relative;z-index:1;margin:auto 0;padding:50px 0}
.auth-aside .eyebrow{color:#c7c2ff}
.auth-aside h1{font-size:clamp(34px,3.4vw,54px);line-height:1.02;letter-spacing:-.055em;max-width:580px;margin:14px 0 18px}
.auth-aside h1 span{color:#c7c2ff}
.auth-aside > *{position:relative;z-index:1}
.auth-aside p{color:rgba(255,255,255,.64);font-size:14.5px;line-height:1.65;max-width:500px}
.auth-bullets{display:flex;flex-direction:column;gap:10px;margin-top:30px;max-width:500px}
.auth-bullet{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px)}
.auth-bullet-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#bdb7ff;flex:none}
.auth-bullet-ico svg{width:16px;height:16px}
.auth-bullet b{display:block;font-size:12px}
.auth-bullet small{display:block;font-size:10px;color:rgba(255,255,255,.5);margin-top:3px;line-height:1.4}
.auth-aside-foot{font-size:10px;color:rgba(255,255,255,.4);line-height:1.5;display:flex;align-items:center;gap:7px}
.auth-aside-foot svg{width:14px;height:14px}
.auth-main{min-height:calc(100vh - 44px);display:flex;flex-direction:column;padding:4px 10px 10px}
.auth-top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:48px}
.auth-mobile-brand{display:none}
.auth-card{
  width:100%;max-width:450px;margin:auto;padding:32px;border-radius:28px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);
}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:25px}
.auth-tab{height:38px;border-radius:9px;font-size:11.5px;font-weight:800;color:var(--muted);transition:.15s}
.auth-tab:hover{color:var(--ink)}
.auth-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 3px 10px rgba(31,36,68,.1)}
.auth-card h2{font-size:clamp(24px,2.2vw,32px);line-height:1.08;letter-spacing:-.045em}
.auth-sub{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
.auth-form{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.auth-field label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-bottom:7px}
.auth-input-wrap{position:relative}
.auth-input-wrap .text-input{height:50px;padding-left:42px;padding-right:44px;background:var(--surface-2)}
.auth-field-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted-2);pointer-events:none}
.auth-eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.auth-eye:hover{background:var(--surface);color:var(--ink)}
.auth-eye svg{width:17px;height:17px}
.auth-error{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border-radius:11px;background:var(--red-soft);border:1px solid rgba(240,68,56,.2);color:var(--red);font-size:10.5px;line-height:1.45}
.auth-error svg{width:15px;height:15px;margin-top:1px;flex:none}
.auth-submit{margin-top:4px}
.auth-switch{font-size:10.5px;color:var(--muted);text-align:center;margin-top:17px;line-height:1.5}
.auth-switch button{color:var(--brand);font-weight:800}
.auth-switch button:hover{color:var(--brand-dark)}
.auth-local-note{display:flex;gap:8px;align-items:flex-start;padding:10px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);font-size:9.5px;line-height:1.5;margin-top:18px}
.auth-local-note svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--brand)}
.auth-legacy{display:flex;gap:8px;align-items:flex-start;padding:10px 11px;border-radius:10px;background:var(--mint-soft);border:1px solid rgba(18,183,106,.18);color:var(--ink-2);font-size:9.5px;line-height:1.5;margin-bottom:15px}
.auth-legacy svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--mint)}
.account-card-head{display:flex;align-items:center;gap:13px;padding-bottom:16px;border-bottom:1px solid var(--line-2);margin-bottom:10px}
.account-card-head .avatar{width:48px;height:48px;border-radius:14px;font-size:16px}
.account-identity{min-width:0}
.account-identity b{display:block;font-size:15px;letter-spacing:-.02em}
.account-identity small{display:block;font-size:10px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-card-head .badge{margin-left:auto}
.theme-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.theme-option{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;transition:.15s}
.theme-option:hover{border-color:#c9c5f5}
.theme-option.active{border-color:var(--brand);background:var(--brand-soft-2);box-shadow:0 0 0 3px rgba(81,70,229,.07)}
.theme-option-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.theme-option.active .theme-option-ico{background:var(--brand);color:#fff}
.theme-option-ico svg{width:15px;height:15px}
.theme-option b{display:block;font-size:10.5px}
.theme-option small{display:block;font-size:8.5px;color:var(--muted);margin-top:2px}

:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#090c15;
  --surface:#111624;
  --surface-2:#171e2e;
  --ink:#f1f4ff;
  --ink-2:#c5cbe0;
  --muted:#8b94ac;
  --muted-2:#69738c;
  --line:#242c40;
  --line-2:#1c2334;
  --brand:#8d83ff;
  --brand-dark:#b2aaff;
  --brand-soft:#272154;
  --brand-soft-2:#1c1938;
  --mint:#3ddba4;
  --mint-soft:#12362a;
  --orange:#fdb022;
  --orange-soft:#3b2a12;
  --red:#ff7b72;
  --red-soft:#3a1c20;
  --blue:#63b3ff;
  --blue-soft:#122c48;
  --shadow:0 14px 44px rgba(0,0,0,.3);
  --shadow-lg:0 30px 90px rgba(0,0,0,.55);
}
[data-theme="dark"] body{background:var(--bg)}
[data-theme="dark"] ::selection{background:#3d3480;color:#fff}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#2c354b}
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:#3a4560}
[data-theme="dark"] .topbar{background:rgba(9,12,21,.78);border-bottom-color:rgba(36,44,64,.9)}
[data-theme="dark"] .countdown-pill,
[data-theme="dark"] .streak-pill,
[data-theme="dark"] .btn-secondary,
[data-theme="dark"] .text-input,
[data-theme="dark"] .select-input,
[data-theme="dark"] .seg-chip,
[data-theme="dark"] .day-chip,
[data-theme="dark"] .time-chip,
[data-theme="dark"] .choice-card,
[data-theme="dark"] .goal-row,
[data-theme="dark"] .support-card,
[data-theme="dark"] .support-check,
[data-theme="dark"] .level-seg button.active{background:var(--surface);border-color:var(--line);color:var(--ink)}
[data-theme="dark"] .btn-secondary:hover,
[data-theme="dark"] .text-input:hover,
[data-theme="dark"] .select-input:hover,
[data-theme="dark"] .seg-chip:hover,
[data-theme="dark"] .day-chip:hover,
[data-theme="dark"] .time-chip:hover,
[data-theme="dark"] .choice-card:hover,
[data-theme="dark"] .support-card:hover,
[data-theme="dark"] .theme-option:hover{border-color:#454f70;background:var(--surface-2)}
[data-theme="dark"] .icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
[data-theme="dark"] .nav-item.active{background:linear-gradient(135deg,#252050,#1f1b40);color:var(--brand)}
[data-theme="dark"] .avatar{background:linear-gradient(135deg,#3a3280,#2a245c);color:#d9d5ff}
[data-theme="dark"] .choice-card.selected{background:linear-gradient(135deg,#252052,#1b1938);border-color:var(--brand)}
[data-theme="dark"] .level-seg button.active{box-shadow:0 2px 8px rgba(0,0,0,.24)}
[data-theme="dark"] .ob-card{background:rgba(17,22,36,.96);border-color:var(--line);box-shadow:0 30px 90px rgba(0,0,0,.35)}
[data-theme="dark"] .ob-progress-track,
[data-theme="dark"] .countdown-bar,
[data-theme="dark"] .subject-progress-track,
[data-theme="dark"] .day-progress,
[data-theme="dark"] .coverage-track,
[data-theme="dark"] .subject-card-progress,
[data-theme="dark"] .quiz-progress,
[data-theme="dark"] .result-orb,
[data-theme="dark"] .activity-bar-wrap{background:#222a3e}
[data-theme="dark"] .ob-footer{background:rgba(17,22,36,.8)}
[data-theme="dark"] .onboarding{background:radial-gradient(circle at 8% 8%,rgba(81,70,229,.13),transparent 30%),radial-gradient(circle at 92% 92%,rgba(18,183,106,.08),transparent 26%),var(--bg)}
[data-theme="dark"] .summary-card{background:linear-gradient(160deg,#171c2c,#121827);border-color:var(--line)}
[data-theme="dark"] .summary-top{border-bottom-color:var(--line)}
[data-theme="dark"] .summary-item{background:rgba(23,30,46,.8);border-color:var(--line)}
[data-theme="dark"] .mini-subject{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
[data-theme="dark"] .notice{border-color:#302a63}
[data-theme="dark"] .notice.orange{border-color:#5a431f}
[data-theme="dark"] .notice.red{border-color:#54272a}
[data-theme="dark"] .alert-banner{background:linear-gradient(100deg,#2b2113,#211b12);border-color:#56411c}
[data-theme="dark"] .alert-banner .alert-ico{background:#3b2b10;color:var(--orange)}
[data-theme="dark"] .session-row{background:var(--surface-2)}
[data-theme="dark"] .session-row:hover{background:var(--surface);border-color:#3a4564}
[data-theme="dark"] .day-tile.selected{background:linear-gradient(180deg,var(--surface),#181f33);border-color:var(--brand)}
[data-theme="dark"] .day-tile.buffer{background:repeating-linear-gradient(135deg,#101522,#101522 7px,#0d111d 7px,#0d111d 14px)}
[data-theme="dark"] .plan-session{background:var(--surface-2);border-color:var(--line-2)}

[data-theme="dark"] .plan-session.done{background:#151b29}
[data-theme="dark"] .plan-session.missed{background:#211317;border-color:#54272a}
[data-theme="dark"] .plan-session.mock{background:linear-gradient(100deg,#211d40,#171a2a);border-color:#332c68}
[data-theme="dark"] .subject-header{background:linear-gradient(135deg,var(--surface-2),var(--surface) 70%)}
[data-theme="dark"] .subject-header-left .subject-mark{background:var(--surface-2);box-shadow:none}
[data-theme="dark"] .subject-card:hover{border-color:#3b4470}
[data-theme="dark"] .topic-row:hover{background:var(--surface-2)}
[data-theme="dark"] .topic-meta .weight{color:var(--orange)}
[data-theme="dark"] .practice-banner{background:linear-gradient(100deg,#1c1838,#141827);border-color:#2f295e}
[data-theme="dark"] .practice-banner .pb-ico{background:var(--surface-2);box-shadow:none}
[data-theme="dark"] .quiz-option{background:var(--surface);border-color:var(--line)}
[data-theme="dark"] .quiz-option:hover{background:var(--surface-2);border-color:#454f70}
[data-theme="dark"] .quiz-option.correct{background:#12352a;border-color:var(--mint)}
[data-theme="dark"] .quiz-option.wrong{background:#351b1e;border-color:var(--red)}
[data-theme="dark"] .quiz-explanation.good{border-color:#1c5b45}
[data-theme="dark"] .quiz-explanation.bad{border-color:#5b292c}
[data-theme="dark"] .quiz-explanation.good .quiz-explanation-top{color:var(--mint)}
[data-theme="dark"] .quiz-explanation.bad .quiz-explanation-top{color:var(--red)}
[data-theme="dark"] .result-orb:before{background:var(--surface)}
[data-theme="dark"] .lag-item .lag-ico{background:var(--surface)}
[data-theme="dark"] .danger-zone{border-color:#54272a;background:linear-gradient(135deg,#211316,#141827)}
[data-theme="dark"] .danger-zone h2{color:var(--red)}
[data-theme="dark"] .modal-foot{background:var(--surface-2)}
[data-theme="dark"] .confirm-option{background:var(--surface-2)}
[data-theme="dark"] .confirm-option:hover{background:var(--surface);border-color:#454f70}
[data-theme="dark"] .theory-cta{background:linear-gradient(135deg,#1c1938,#151827);border-color:#302a63}
[data-theme="dark"] .badge.mint{color:var(--mint)}
[data-theme="dark"] .badge.orange{color:var(--orange)}
[data-theme="dark"] .badge.red{color:var(--red)}
[data-theme="dark"] .theory-steps li:before{color:var(--mint)}
[data-theme="dark"] .toggle{background:#313a52}
[data-theme="dark"] .toggle:after{background:#e8ecf7}
[data-theme="dark"] .toast{background:#1b2234;border:1px solid var(--line);box-shadow:0 18px 44px rgba(0,0,0,.45)}
[data-theme="dark"] .auth-tab.active{box-shadow:0 3px 10px rgba(0,0,0,.26)}
[data-theme="dark"] .auth-card{box-shadow:0 30px 90px rgba(0,0,0,.42)}
[data-theme="dark"] .auth-error{border-color:rgba(255,123,114,.24)}
[data-theme="dark"] .subject-mark,
[data-theme="dark"] .session-subj{
  background:var(--surface-2);
  background:color-mix(in srgb,var(--subj-color,#8d83ff) 24%,var(--surface-2));
  color:var(--subj-color,#8d83ff);
  color:color-mix(in srgb,var(--subj-color,#8d83ff) 58%,#fff);
}
[data-theme="dark"] .subject-card-footer .arrow{
  background:var(--surface-2);
  background:color-mix(in srgb,var(--subj-color,#8d83ff) 20%,var(--surface-2));
  color:color-mix(in srgb,var(--subj-color,#8d83ff) 58%,#fff);
}
[data-theme="dark"] .tag.subject-tag{
